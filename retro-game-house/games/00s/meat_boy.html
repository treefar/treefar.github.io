/* ==========================================================================
   果凍勇者 — 致敬 Meat Boy (Team Meat, 2008)
   --------------------------------------------------------------------------
   復刻重點：
   1. **死亡懲罰趨近於零**。重生 0.25 秒、沒有生命數、沒有退關、連分數都不扣。
      因為失敗便宜到不值一提，關卡才敢擺滿圓鋸。這個設計十年後由《Celeste》
      發揚光大（見 10s 頁的登峰之路）——先玩這款再玩那款，能看到一條傳承線。
   2. **死亡會留下果凍漬**，而且同一個房間裡永遠不擦掉。你失敗過的每個位置
      都變成地圖的一部分——死亡不是進度的反面，死亡就是進度本身。
   3. **動量式手感**：加速極快、跑速極高、地面微滑、牆跳可以連刷。
      和講究「一格一格算」的 Celeste 相反，這款的準是「在高速中準」。
   4. 威脅全部即死、全部可預判：固定圓鋸、沿軌道往返的圓鋸、
      踩了就溶的方塊。沒有血量條，只有「碰到就重來」的乾脆。
   ========================================================================== */

            // 腳下又是一排只夠踩一下的溶解踏石，非跳不可——於是每一跳都得剛剛好。
            // 前一版是平地加一顆鋸，亂按亂跳八次全過；改成這樣之後同一隻亂按機器人零過關。
            { name: '防腐走廊', hint: '腳下是空的，頭上全是刺。非跳不可，但只能輕輕跳。',
              rows: [

            // 鋸掛在第 1 列（下緣 y=41），小跳頭頂 y=67 過得去、滿跳頭頂 y=28 撞上去。
            // 走廊中間挖了兩格洞逼你非跳不可，鋸就正好掛在那個洞的上方——

            { name: '營救', hint: '爬出井，然後低頭衝。那道縫要跳，但跳滿就撞鋸。',

// ======================================================================
// 狀態
// ======================================================================
var s = null;
var splatCv = null, splatCtx = null;   // 果凍漬圖層：房間級離屏 canvas，死亡時畫上去就不再清除

function reset() {
    s = { ch: 0, room: 0, deaths: 0, sugars: 0, score: 0, time: 0, timeShown: -1 };
    P.clear(); FT.clear();
    G.setStat('deaths', 0); G.setStat('score', 0); G.setStat('time', '0:00');
    loadRoom(0, 0);
}

function roomDef(ch, r) { return CHAPTERS[ch].rooms[r]; }

function loadRoom(ch, r) {
    var def = roomDef(ch, r);
    var solid = {}, hazard = {}, dissolves = [], saws = [], movSaws = [], sugars = [], door = null, start = null;
    var x, y, c;

    for (y = 0; y < def.rows.length; y++) {
        var row = def.rows[y];
        for (x = 0; x < row.length; x++) {
            c = row[x];
            var k = x + ',' + y;
            if (c === 'X') solid[k] = 1;
            else if (c === '^' || c === 'v' || c === '>' || c === '<') { solid[k] = 1; hazard[k] = c; }
            else if (c === 'C') dissolves.push({ x: x, y: y, state: 0, t: 0 });
            else if (c === 'Z') saws.push({ x: x * T + T / 2, y: y * T + T / 2, spin: 0 });
            else if (c === 'H' || c === 'V') movSaws.push({ gx: x, gy: y, axis: c, spin: 0 });
            else if (c === 'G') sugars.push({ x: x, y: y, taken: false, t: (x * 7 + y * 13) % 6 });
            else if (c === 'D') door = { x: x, y: y };
            else if (c === 'P') start = { x: x, y: y };
        }
    }

    s.ch = ch; s.room = r;
    s.def = def; s.cfg = CHAPTERS[ch];
    s.solid = solid; s.hazard = hazard;
    s.dissolves = dissolves; s.saws = saws; s.movSaws = movSaws;
    s.sugars = sugars; s.door = door; s.start = start;
    s.clearT = 0; s.roomDeaths = 0; s.roomTime = 0; s.hintT = 2.6;
    s.girlT = 0;

    // 移動圓鋸的軌道：從起始格沿軸向兩側掃到實體磚或畫面邊界。
    // 先算好存起來，運行時只做 ping-pong，軌道也才畫得出來。
    for (var i = 0; i < movSaws.length; i++) {
        var m = movSaws[i];
        var lo = m.axis === 'H' ? m.gx : m.gy;
        var hi = lo;
        while (lo > 0 && !solidStaticAt(m.axis === 'H' ? lo - 1 : m.gx, m.axis === 'H' ? m.gy : lo - 1)) lo--;
        while (hi < (m.axis === 'H' ? COLS : ROWS) - 1 && !solidStaticAt(m.axis === 'H' ? hi + 1 : m.gx, m.axis === 'H' ? m.gy : hi + 1)) hi++;
        m.min = lo * T + T / 2; m.max = hi * T + T / 2;
        m.pos = (m.axis === 'H' ? m.gx : m.gy) * T + T / 2;
        // 偶數顆往正向走、奇數顆反向，讓同房的鋸自然錯開節奏
        m.dir = (i % 2 === 0) ? 1 : -1;
        m.x = m.axis === 'H' ? m.pos : m.gx * T + T / 2;
        m.y = m.axis === 'V' ? m.pos : m.gy * T + T / 2;
    }

    // 果凍漬圖層重建（換房才清；同房重試永遠累積）
    splatCv = document.createElement('canvas');
    splatCv.width = VW; splatCv.height = VH;
    splatCtx = splatCv.getContext('2d');

    G.setStat('stage', (ch + 1) + '-' + (r + 1));
    spawn();

    function solidStaticAt(cx, cy) { return !!solid[cx + ',' + cy]; }
}

function spawn() {
    var st = s.start || { x: 2, y: 12 };
    s.p = {
        x: st.x * T + 4, y: st.y * T + T - 14, w: 12, h: 14,
        vx: 0, vy: 0, grounded: false, coyote: 0, face: 1,
        jumping: false, wall: 0, lock: 0, lockDir: 0,
        dead: 0, anim: 0, squash: 0, deadlyHit: null
    };
    for (var i = 0; i < s.dissolves.length; i++) { s.dissolves[i].state = 0; s.dissolves[i].t = 0; }
    RE.Input.consumeBuffer('a');
    RE.Input.consumeBuffer('b');
}

// ---------- 地形查詢 ----------
function solidAt(cx, cy) {
    if (s.solid[cx + ',' + cy]) return true;
    for (var i = 0; i < s.dissolves.length; i++) {
        var d = s.dissolves[i];
        if (d.x === cx && d.y === cy && d.state < 2) return true;
    }
    return false;
}
function solidStatic(cx, cy) { return !!s.solid[cx + ',' + cy]; }
function hazardAt(cx, cy) { return s.hazard[cx + ',' + cy] || null; }

// 尖刺只有「朝向你的那一面」會殺人，玩家可以安全站在刺牆頂上
function hazardKills(dir, o) {
    if (dir === '^') return o.vy >= 0;
    if (dir === 'v') return o.vy <= 0;
    if (dir === '>') return o.vx <= 0;
    if (dir === '<') return o.vx >= 0;
    return false;
}

// 踩到溶解方塊：開始計時
function touchDissolve(cx, cy) {
    for (var i = 0; i < s.dissolves.length; i++) {
        var d = s.dissolves[i];
        if (d.x === cx && d.y === cy && d.state === 0) {
            d.state = 1; d.t = 0;
            RetroAudio.play('blip');
        }
    }
}

/**
 * 移動並解算 tilemap 碰撞。X、Y 一定要分兩階段——
 * 兩軸一起解算時，落地那一幀角色已陷入地板，
 * 水平解算會把它誤判成撞牆而從側面推開。（沿用 celeste_like 的成熟版本）
 */
function moveAndCollide(o, dt) {
    var grounded = false, hitWallDir = 0, r, c;
    o.deadlyHit = null;

    o.x += o.vx * dt;
    var r0 = Math.floor(o.y / T), r1 = Math.floor((o.y + o.h - 1) / T);
    var c0 = Math.floor(o.x / T), c1 = Math.floor((o.x + o.w - 1) / T);
    for (r = r0; r <= r1; r++) {
        for (c = c0; c <= c1; c++) {
            if (!solidAt(c, r)) continue;
            var hz = hazardAt(c, r);
            if (hz && hazardKills(hz, o)) o.deadlyHit = hz;
            if (o.vx > 0) { o.x = c * T - o.w; o.vx = 0; hitWallDir = 1; }
            else if (o.vx < 0) { o.x = (c + 1) * T; o.vx = 0; hitWallDir = -1; }
        }
    }

    o.y += o.vy * dt;
    c0 = Math.floor(o.x / T); c1 = Math.floor((o.x + o.w - 1) / T);
    r0 = Math.floor(o.y / T); r1 = Math.floor((o.y + o.h - 1) / T);
    for (r = r0; r <= r1; r++) {
        for (c = c0; c <= c1; c++) {
            if (!solidAt(c, r)) continue;
            var hz2 = hazardAt(c, r);
            if (hz2 && hazardKills(hz2, o)) o.deadlyHit = hz2;
            if (o.vy > 0) { o.y = r * T - o.h; o.vy = 0; grounded = true; touchDissolve(c, r); }
            else if (o.vy < 0) { o.y = (r + 1) * T; o.vy = 0; }
        }
    }
    // 貼地探測：解算會把腳「剛好」放在磚塊上緣，下一幀的檢查範圍是 y+h-1，
    // 正好差一像素碰不到磚塊，grounded 會每隔一幀閃一次（celeste_like 的血淚）
    if (!grounded && o.vy >= 0) {
        var pr = Math.floor((o.y + o.h + 1) / T);
        var pc0 = Math.floor(o.x / T), pc1 = Math.floor((o.x + o.w - 1) / T);
        for (c = pc0; c <= pc1; c++) {
            if (solidAt(c, pr)) { grounded = true; touchDissolve(c, pr); break; }
        }
    }
    o.grounded = grounded; o.wallDir = hitWallDir;
    return grounded;
}

// 貼牆判定：往前探 2px。探到溶解方塊時順便觸發它開始溶（牆也會被你貼壞）
function wallSide(o, dir) {
    var x = dir > 0 ? o.x + o.w + 2 : o.x - 2;
    var cx = Math.floor(x / T);
    var r0 = Math.floor((o.y + 2) / T), r1 = Math.floor((o.y + o.h - 3) / T);
    var found = false;
    for (var r = r0; r <= r1; r++) {
        if (solidAt(cx, r)) { found = true; touchDissolve(cx, r); }
    }
    return found;
}
function wallSpiked(o, dir) {
    var x = dir > 0 ? o.x + o.w + 2 : o.x - 2;
    var cx = Math.floor(x / T);
    var r0 = Math.floor((o.y + 2) / T), r1 = Math.floor((o.y + o.h - 3) / T);
    for (var r = r0; r <= r1; r++) if (hazardAt(cx, r)) return true;
    return false;
}

// ======================================================================
// 玩家
// ======================================================================
function updatePlayer(dt) {
    var p = s.p;
    if (p.dead > 0) {
        p.dead -= dt;
        if (p.dead <= 0) spawn();
        return;
    }

    var ax = RE.Input.axisX();
    if (p.lock > 0) { p.lock -= dt; ax = p.lockDir; }

    // ---------- 水平移動：暴力加速 + 微滑地面 ----------
    var accel = p.grounded ? PHYS.accel : PHYS.accelAir;
    var fric = p.grounded ? PHYS.friction : PHYS.frictionAir;
    if (ax !== 0) {
        p.vx += ax * accel * dt;
        if (Math.abs(p.vx) > PHYS.maxRun) p.vx = ax * PHYS.maxRun;
        p.face = ax > 0 ? 1 : -1;
    } else {
        if (p.vx > 0) p.vx = Math.max(0, p.vx - fric * dt);
        else if (p.vx < 0) p.vx = Math.min(0, p.vx + fric * dt);
    }

    // ---------- 貼牆下滑 ----------
    var onWall = 0;
    if (!p.grounded) {
        if (ax > 0 && wallSide(p, 1) && !wallSpiked(p, 1)) onWall = 1;
        else if (ax < 0 && wallSide(p, -1) && !wallSpiked(p, -1)) onWall = -1;
    }
    p.wall = onWall;

    // ---------- 重力 ----------
    var g = p.vy < 0 ? PHYS.gravity : PHYS.gravityFall;
    p.vy += g * dt;
    var maxFall = onWall ? PHYS.wallSlide : PHYS.maxFall;
    if (p.vy > maxFall) p.vy = maxFall;

    // ---------- 跳躍：土狼時間 + 輸入緩衝 + 可變高度；A、B 都是跳 ----------
    if (p.grounded) p.coyote = PHYS.coyote;
    else if (p.coyote > 0) p.coyote -= dt;

    var jumpBuffered = RE.Input.buffered('a', PHYS.buffer) || RE.Input.buffered('b', PHYS.buffer);
    if (jumpBuffered) {
        if (p.coyote > 0) {
            consumeJump();
            p.vy = PHYS.jumpVel; p.jumping = true; p.coyote = 0;
            p.squash = 0.12;
            RetroAudio.play('jump');
            P.burst(p.x + p.w / 2, p.y + p.h, 6, { angle: -Math.PI / 2, spread: 1.1,
                speedMin: 30, speedMax: 100, gravity: 300, colors: ['#ff8a9e', '#d94f63'], lifeMin: 0.15, lifeMax: 0.3 });
        } else if (onWall !== 0) {
            consumeJump();
            p.vy = PHYS.wallJumpY;
            p.vx = -onWall * PHYS.wallJumpX;
            p.lock = PHYS.wallLock; p.lockDir = -onWall;
            p.face = -onWall;
            p.jumping = true;
            p.squash = 0.12;
            RetroAudio.play('doubleJump');
            RE.juice.shake(0.07);
            P.burst(p.x + (onWall > 0 ? p.w : 0), p.y + p.h / 2, 8, {
                angle: onWall > 0 ? Math.PI : 0, spread: 0.8,
                speedMin: 50, speedMax: 150, gravity: 240,
                colors: ['#ff8a9e', '#ffd166'], lifeMin: 0.15, lifeMax: 0.32 });
        }
    }
    if (p.jumping && !RE.Input.down('a') && !RE.Input.down('b') && p.vy < 0) {
        p.vy *= PHYS.jumpCut; p.jumping = false;
    }
    if (p.vy >= 0) p.jumping = false;

    var wasAir = !p.grounded;
    moveAndCollide(p, dt);
    if (wasAir && p.grounded) {
        p.squash = 0.14;
        RetroAudio.play('step');
        P.burst(p.x + p.w / 2, p.y + p.h, 5, { angle: -Math.PI / 2, spread: 1.4,
            speedMin: 20, speedMax: 70, gravity: 320, colors: ['#d94f63'], lifeMin: 0.1, lifeMax: 0.25, sizeMin: 1.5, sizeMax: 3 });
    }
    afterMove(dt);
}

function consumeJump() {
    RE.Input.consumeBuffer('a');
    RE.Input.consumeBuffer('b');
}

function sawHitsPlayer(sx, sy) {
    var p = s.p;
    var cx = RE.clamp(sx, p.x, p.x + p.w);
    var cy = RE.clamp(sy, p.y, p.y + p.h);
    var dx = sx - cx, dy = sy - cy;
    return dx * dx + dy * dy < PHYS.sawR * PHYS.sawR;
}

function afterMove(dt) {
    var p = s.p;
    p.anim += dt;
    if (p.squash > 0) p.squash -= dt;

    if (p.deadlyHit) { die(); return; }
    if (p.y > VH + 40) { die(); return; }

    // 圓鋸（固定 + 移動）
    for (var i = 0; i < s.saws.length; i++) {
        if (sawHitsPlayer(s.saws[i].x, s.saws[i].y)) { die(); return; }
    }
    for (i = 0; i < s.movSaws.length; i++) {
        if (sawHitsPlayer(s.movSaws[i].x, s.movSaws[i].y)) { die(); return; }
    }

    // 方糖
    for (i = 0; i < s.sugars.length; i++) {
        var g = s.sugars[i];
        if (g.taken) continue;
        var gx = g.x * T + T / 2, gy = g.y * T + T / 2;
        if (Math.abs(p.x + p.w / 2 - gx) < 14 && Math.abs(p.y + p.h / 2 - gy) < 15) {
            g.taken = true;
            s.sugars_taken = (s.sugars_taken || 0) + 1;
            s.sugarCount = (s.sugarCount || 0) + 1;
            addScore(500);
            RetroAudio.play('coin');
            RE.juice.hitstop(0.05);
            RE.juice.punchZoom(0.05);
            FT.add(gx, gy - 8, '方糖 +500', { color: '#ffe9f0', size: 13 });
            P.burst(gx, gy, 14, { colors: ['#ffffff', '#ffd166', '#ffe9f0'],
                speedMin: 50, speedMax: 160, gravity: 160, lifeMin: 0.3, lifeMax: 0.55, glow: true });
        }
    }

    // 棉花糖妹妹（出口）
    if (s.door && s.clearT <= 0) {
        var dx2 = s.door.x * T, dy2 = s.door.y * T;
        if (p.x + p.w > dx2 + 2 && p.x < dx2 + T - 2 &&
            p.y + p.h > dy2 + 2 && p.y < dy2 + T + 2) clearRoom();
    }
}

function addScore(n) { s.score += n; G.setStat('score', s.score); }

// ======================================================================
// 死亡：0.25 秒重生 + 果凍漬永久留在房間圖層上
// ======================================================================
function die() {
    var p = s.p;
    if (p.dead > 0) return;
    p.dead = PHYS.respawn;
    s.deaths++; s.roomDeaths++;
    G.setStat('deaths', s.deaths);

    paintSplat(p.x + p.w / 2, p.y + p.h / 2);

    RetroAudio.play('splash');
    RE.juice.hitstop(0.06);
    RE.juice.shake(0.3);
    RE.juice.flash('rgba(255,80,110,0.25)', 0.1);
    P.burst(p.x + p.w / 2, p.y + p.h / 2, 26, {
        colors: ['#ff4d6d', '#d43354', '#ff8a9e'],
        speedMin: 60, speedMax: 230, gravity: 500, drag: 0.94,
        lifeMin: 0.3, lifeMax: 0.7, sizeMin: 2, sizeMax: 5
    });
}

/** 在房間的果凍漬圖層上永久畫一灘。同房重試不清除——死亡即地圖。 */
function paintSplat(x, y) {
    var c = splatCtx;
    c.save();
    c.globalAlpha = 0.5;
    var n = 5 + Math.floor(Math.random() * 4);
    for (var i = 0; i < n; i++) {
        var a = Math.random() * RE.TAU;
        var d = Math.random() * 9;
        var r = 2.5 + Math.random() * 5;
        c.fillStyle = Math.random() < 0.5 ? '#d43354' : '#a8244a';
        c.beginPath();
        c.arc(x + Math.cos(a) * d, y + Math.sin(a) * d, r, 0, RE.TAU);
        c.fill();
    }
    // 往下的滴痕
    c.globalAlpha = 0.35;
    for (i = 0; i < 2; i++) {
        var ox = (Math.random() - 0.5) * 14;
        c.fillStyle = '#a8244a';
        c.fillRect(x + ox, y, 2, 6 + Math.random() * 12);
    }
    c.restore();
}

// ======================================================================
// 過關 / 全破 / 放棄
// ======================================================================
function clearRoom() {
    s.clearT = 0.9;
    s.girlT = 0.9;
    RetroAudio.play('win');
    RE.juice.flash('rgba(255,255,255,0.35)', 0.14);
    RE.juice.punchZoom(0.07);
    addScore(300);
    var d = s.door;
    P.burst(d.x * T + T / 2, d.y * T + T / 2, 20, {
        colors: ['#fff3fa', '#ffd166', '#ff8fc8'],
        speedMin: 60, speedMax: 190, gravity: 90, lifeMin: 0.35, lifeMax: 0.7, glow: true
    });
    FT.add(d.x * T + T / 2, d.y * T - 12,
        s.ch === CHAPTERS.length - 1 && s.room === CHAPTERS[s.ch].rooms.length - 1 ? '救到了！' : '又被抓走了！',
        { color: '#ffd166', size: 13 });
}

function nextRoom() {
    var ch = s.ch, r = s.room;
    if (r < CHAPTERS[ch].rooms.length - 1) { loadRoom(ch, r + 1); return; }
    addScore(1000);
    if (ch < CHAPTERS.length - 1) {
        var n = ch + 1;
        G.stageCard(n + 1, CHAPTERS[n].name, CHAPTERS[n].hint, function () { loadRoom(n, 0); });
        return;
    }
    finish();
}

function finish() {
    var t = Math.floor(s.time);
    var bonus = Math.max(0, 5000 - t * 15);
    addScore(bonus);
    var mm = Math.floor(t / 60), ss = ('0' + (t % 60)).slice(-2);
    G.gameOver({
        win: true, score: s.score,
        body: '救到棉花糖妹妹了！全程 ' + mm + ':' + ss + '，爆漿 ' + s.deaths + ' 次，' +
              '帶回 ' + (s.sugarCount || 0) + ' 顆方糖。' +
              '注意到了嗎——爆漿 ' + s.deaths + ' 次，分數一分都沒扣。' +
              '<strong>當失敗便宜到不值一提，玩家就會一直試到成功為止。</strong>' +
              '這就是《Meat Boy》教給後來十年動作遊戲的一課；' +
              '十年後的《Celeste》（見 10s 頁）把它接了過去，再加上輔助模式。'
    });
}

function giveUp() {
    G.hideOverlay();
    G._state = 'playing';
    G.gameOver({
        win: false, score: s.score,
        body: '你在 ' + (s.ch + 1) + '-' + (s.room + 1) + ' 收手了，總共爆漿 ' + s.deaths + ' 次。' +
              '當年 Newgrounds 上的玩家全破平均要爆好幾百次——你這樣真的不算多。' +
              '房間裡的果凍漬都還記著你試過的路線，隨時回來接著畫完它。'
    });
}

// ======================================================================
// 暫停與標題
// ======================================================================
function openPause() {
    G._state = 'paused';
    RetroAudio.play('pause');
    G.showOverlay({
        title: '暫停中',
        body: '死了 ' + s.deaths + ' 次？《Super Meat Boy》的玩家平均全破要死幾百次。繼續。',
        buttons: [
            { label: '▶ 繼續', onClick: function () { G.resume(); } },
            { label: '↻ 重新開始', cls: 'ghost', onClick: function () { G.restart(); } },
            { label: '⚑ 放棄營救', cls: 'ghost', onClick: function () { giveUp(); } }
        ],
        press: '按 P 或 ESC 繼續'
    });
}
G.pause = openPause;

function showTitleScreen() {
    G._state = 'title';
    G.showOverlay({
        title: '果凍勇者',
        body: G.cfg.howto,
        buttons: [
            { label: '▶ 開始營救', onClick: function () { G.hideOverlay(); G._state = 'playing'; reset(); } }
        ],
        press: '按 空白鍵 或 Enter 開始'
    });
    var onKey = function (e) {
        if (G._state !== 'title') return;
        if (e.code === 'Space' || e.code === 'Enter') {
            e.preventDefault();
            window.removeEventListener('keydown', onKey);
            RetroAudio.play('confirm');
            G.hideOverlay(); G._state = 'playing'; reset();
        }
    };
    window.addEventListener('keydown', onKey);
}

// ======================================================================
// 主迴圈
// ======================================================================
function update(dt) {
    if (!s) return;
    P.update(dt); FT.update(dt);
    if (s.hintT > 0) s.hintT -= dt;
    s.time += dt;
    s.roomTime += dt;

    var shown = Math.floor(s.time);
    if (shown !== s.timeShown) {
        s.timeShown = shown;
        G.setStat('time', Math.floor(shown / 60) + ':' + ('0' + (shown % 60)).slice(-2));
    }

    var i;
    // 溶解方塊
    for (i = 0; i < s.dissolves.length; i++) {
        var d = s.dissolves[i];
        if (d.state === 1) {
            d.t += dt;
            if (d.t >= PHYS.dissolveShake) {
                d.state = 2; d.t = 0;
                P.burst(d.x * T + T / 2, d.y * T + T / 2, 8, {
                    colors: ['#8d6b46', '#b58b5e'], speedMin: 30, speedMax: 100,
                    gravity: 420, lifeMin: 0.25, lifeMax: 0.5 });
                RetroAudio.play('drop');
            }
        } else if (d.state === 2) {
            d.t += dt;
            if (d.t >= PHYS.dissolveBack) {
                var px = Math.floor((s.p.x + s.p.w / 2) / T), py = Math.floor((s.p.y + s.p.h / 2) / T);
                if (!(px === d.x && py === d.y)) { d.state = 0; d.t = 0; }
            }
        }
    }

    // 圓鋸
    for (i = 0; i < s.saws.length; i++) s.saws[i].spin += dt * 9;
    for (i = 0; i < s.movSaws.length; i++) {
        var m = s.movSaws[i];
        m.spin += dt * 9;
        m.pos += m.dir * PHYS.sawSpeed * dt;
        if (m.pos > m.max) { m.pos = m.max; m.dir = -1; }
        if (m.pos < m.min) { m.pos = m.min; m.dir = 1; }
        if (m.axis === 'H') m.x = m.pos; else m.y = m.pos;
    }

    for (i = 0; i < s.sugars.length; i++) s.sugars[i].t += dt;
    if (s.girlT > 0) s.girlT -= dt;

    if (s.clearT > 0) {
        s.clearT -= dt;
        if (s.clearT <= 0) { nextRoom(); return; }
        return;
    }
    updatePlayer(dt);
}

// ======================================================================
// 繪製
// ======================================================================
function render() {
    if (!s || !s.p) return;
    G.beginWorld();
    drawSky();
    drawTiles();
    ctx.drawImage(splatCv, 0, 0);       // 果凍漬圖層：畫在磚上、活動物件下
    drawDissolves();
    drawSugars();
    drawDoor();
    drawSaws();
    drawPlayer();
    P.draw(ctx);
    FT.draw(ctx);
    G.endWorld();
    drawHUD();
    G.postFX({ scanAlpha: 0.05, vignetteStrength: 0.42 });
}

function drawSky() {
    var g = ctx.createLinearGradient(0, 0, 0, VH);
    g.addColorStop(0, s.cfg.sky[0]);
    g.addColorStop(1, s.cfg.sky[1]);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, VW, VH);

    // 工廠背景：兩顆慢轉的大齒輪剪影 + 垂直管線
    drawGear(70, 84, 55, Date.now() * 0.00018);
    drawGear(400, 210, 74, -Date.now() * 0.00012);
    ctx.fillStyle = 'rgba(0,0,0,0.13)';
    ctx.fillRect(180, 0, 10, VH);
    ctx.fillRect(310, 0, 6, VH);
}

function drawGear(cx, cy, r, rot) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(rot);
    ctx.fillStyle = s.cfg.gear;
    ctx.globalAlpha = 0.4;
    for (var i = 0; i < 8; i++) {
        var a = i / 8 * RE.TAU;
        ctx.fillRect(Math.cos(a) * r - 6, Math.sin(a) * r - 6, 12, 12);
    }
    ctx.beginPath(); ctx.arc(0, 0, r * 0.92, 0, RE.TAU); ctx.fill();
    ctx.globalAlpha = 0.55;
    ctx.fillStyle = s.cfg.sky[1];
    ctx.beginPath(); ctx.arc(0, 0, r * 0.4, 0, RE.TAU); ctx.fill();
    ctx.restore();
}

function drawTiles() {
    for (var y = 0; y < ROWS; y++) {
        for (var x = 0; x < COLS; x++) {
            var k = x + ',' + y;
            if (!s.solid[k]) continue;
            var hz = s.hazard[k];
            if (hz) { drawSpike(x, y, hz); continue; }
            drawRock(x, y);
        }
    }
}

function drawRock(x, y) {
    var px = x * T, py = y * T;
    ctx.fillStyle = s.cfg.rock;
    ctx.fillRect(px, py, T, T);
    if (!solidStatic(x, y - 1)) { ctx.fillStyle = s.cfg.rockTop; ctx.fillRect(px, py, T, 4); }
    ctx.fillStyle = 'rgba(0,0,0,0.16)';
    ctx.fillRect(px, py + T - 3, T, 3);
    ctx.fillStyle = 'rgba(255,255,255,0.05)';
    ctx.fillRect(px + 3, py + 7, 5, 3);
    ctx.fillRect(px + 11, py + 12, 4, 2);
}

function drawSpike(x, y, dir) {
    var px = x * T, py = y * T;
    ctx.fillStyle = s.cfg.rock;
    ctx.fillRect(px, py, T, T);
    ctx.fillStyle = '#e7edf7';
    ctx.strokeStyle = 'rgba(0,0,0,0.35)';
    ctx.lineWidth = 1;
    for (var i = 0; i < 3; i++) {
        var o = i * (T / 3);
        ctx.beginPath();
        if (dir === '^') {
            ctx.moveTo(px + o, py + T); ctx.lineTo(px + o + T / 6, py + 2); ctx.lineTo(px + o + T / 3, py + T);
        } else if (dir === 'v') {
            ctx.moveTo(px + o, py); ctx.lineTo(px + o + T / 6, py + T - 2); ctx.lineTo(px + o + T / 3, py);
        } else if (dir === '>') {
            ctx.moveTo(px, py + o); ctx.lineTo(px + T - 2, py + o + T / 6); ctx.lineTo(px, py + o + T / 3);
        } else {
            ctx.moveTo(px + T, py + o); ctx.lineTo(px + 2, py + o + T / 6); ctx.lineTo(px + T, py + o + T / 3);
        }
        ctx.closePath(); ctx.fill(); ctx.stroke();
    }
}

function drawDissolves() {
    for (var i = 0; i < s.dissolves.length; i++) {
        var d = s.dissolves[i];
        if (d.state === 2) {
            ctx.strokeStyle = 'rgba(255,255,255,0.14)';
            ctx.lineWidth = 1;
            ctx.strokeRect(d.x * T + 2, d.y * T + 2, T - 4, T - 4);
            continue;
        }
        var sh = d.state === 1 ? Math.sin(d.t * 70) * 1.8 : 0;
        var px = d.x * T + sh, py = d.y * T;
        ctx.fillStyle = d.state === 1 ? '#c99a68' : '#9c7850';
        ctx.fillRect(px, py, T, T);
        ctx.fillStyle = 'rgba(255,255,255,0.2)';
        ctx.fillRect(px, py, T, 3);
        ctx.strokeStyle = 'rgba(0,0,0,0.35)'; ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(px + 5, py + 3); ctx.lineTo(px + 9, py + 10); ctx.lineTo(px + 6, py + T - 2);
        ctx.moveTo(px + 14, py + 2); ctx.lineTo(px + 12, py + 9); ctx.lineTo(px + 15, py + T - 3);
        ctx.stroke();
    }
}

function drawSaws() {
    var i, m;
    // 移動鋸先畫軌道，玩家第一眼就要能預判
    ctx.strokeStyle = 'rgba(255,255,255,0.13)';
    ctx.lineWidth = 2;
    ctx.setLineDash([4, 5]);
    for (i = 0; i < s.movSaws.length; i++) {
        m = s.movSaws[i];
        ctx.beginPath();
        if (m.axis === 'H') { ctx.moveTo(m.min, m.y); ctx.lineTo(m.max, m.y); }
        else { ctx.moveTo(m.x, m.min); ctx.lineTo(m.x, m.max); }
        ctx.stroke();
    }
    ctx.setLineDash([]);

    for (i = 0; i < s.saws.length; i++) drawSaw(s.saws[i].x, s.saws[i].y, s.saws[i].spin);
    for (i = 0; i < s.movSaws.length; i++) drawSaw(s.movSaws[i].x, s.movSaws[i].y, s.movSaws[i].spin);
}

function drawSaw(x, y, spin) {
    var r = PHYS.sawR;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(spin);
    ctx.fillStyle = '#c8ccd8';
    ctx.beginPath();
    for (var i = 0; i < 8; i++) {
        var a0 = i / 8 * RE.TAU, a1 = (i + 0.5) / 8 * RE.TAU;
        ctx.lineTo(Math.cos(a0) * (r + 3), Math.sin(a0) * (r + 3));
        ctx.lineTo(Math.cos(a1) * (r - 2), Math.sin(a1) * (r - 2));
    }
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#8a90a3';
    ctx.beginPath(); ctx.arc(0, 0, r - 4, 0, RE.TAU); ctx.fill();
    ctx.fillStyle = '#565b6b';
    ctx.beginPath(); ctx.arc(0, 0, 3, 0, RE.TAU); ctx.fill();
    ctx.restore();
}

function drawSugars() {
    for (var i = 0; i < s.sugars.length; i++) {
        var g = s.sugars[i];
        if (g.taken) continue;
        var gx = g.x * T + T / 2, gy = g.y * T + T / 2 + Math.sin(g.t * 2.6) * 3;
        ctx.save();
        ctx.translate(gx, gy);
        ctx.rotate(Math.sin(g.t * 1.8) * 0.2);
        ctx.shadowBlur = 8; ctx.shadowColor = '#ffffff';
        ctx.fillStyle = '#f4f6ff';
        ctx.fillRect(-5, -5, 10, 10);
        ctx.fillStyle = 'rgba(180,200,255,0.6)';
        ctx.fillRect(-5, 2, 10, 3);
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(-3, -3, 3, 3);
        ctx.restore();
    }
}

// 棉花糖妹妹：粉白小人，頭上蝴蝶結。過關瞬間被防腐博士的爪子吊走。
function drawDoor() {
    if (!s.door) return;
    var px = s.door.x * T, py = s.door.y * T;
    var t = Date.now() * 0.003;
    var bob = Math.sin(t) * 1.5;

    if (s.girlT > 0) {
        // 被抓走的演出：往上吊
        var k = 1 - s.girlT / 0.9;
        py -= k * 90;
        ctx.strokeStyle = '#3a3a44';
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(px + T / 2, py + 2); ctx.lineTo(px + T / 2, -4); ctx.stroke();
    }

    ctx.save();
    ctx.translate(px + T / 2, py + T / 2 + bob);
    ctx.shadowBlur = 10; ctx.shadowColor = 'rgba(255,143,200,0.8)';
    // 身體
    ctx.fillStyle = '#fff3fa';
    RE.Draw.roundRect(ctx, -6, -7, 12, 14, 4); ctx.fill();
    ctx.shadowBlur = 0;
    // 腮紅與眼睛
    ctx.fillStyle = '#ffb8d9';
    ctx.fillRect(-5, 0, 3, 2); ctx.fillRect(2, 0, 3, 2);
    ctx.fillStyle = '#4a2a3a';
    ctx.fillRect(-3, -3, 2, 3); ctx.fillRect(1, -3, 2, 3);
    // 蝴蝶結
    ctx.fillStyle = '#ff8fc8';
    ctx.beginPath();
    ctx.moveTo(0, -7); ctx.lineTo(-6, -11); ctx.lineTo(-2, -6); ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(0, -7); ctx.lineTo(6, -11); ctx.lineTo(2, -6); ctx.closePath(); ctx.fill();
    ctx.restore();
}

function drawPlayer() {
    var p = s.p;
    if (p.dead > 0) return;

    // 果凍的擠壓變形：跳伸長、落地與起跳壓扁、奔跑晃動
    var sx = 1, sy = 1;
    if (p.squash > 0) { sx = 1.25; sy = 0.72; }
    else if (!p.grounded && p.vy < -60) { sx = 0.82; sy = 1.2; }
    else if (!p.grounded && p.vy > 120) { sx = 0.9; sy = 1.1; }
    else if (p.grounded && Math.abs(p.vx) > 60) {
        sx = 1 + Math.sin(p.anim * 22) * 0.08;
        sy = 1 - Math.sin(p.anim * 22) * 0.08;
    }
    if (p.wall !== 0) { sx = 0.8; sy = 1.12; }

    ctx.save();
    ctx.translate(p.x + p.w / 2, p.y + p.h);
    ctx.scale(sx, sy);

    // 果凍身體：紅色圓角塊 + 半透明高光
    ctx.fillStyle = '#e8385c';
    RE.Draw.roundRect(ctx, -p.w / 2, -p.h, p.w, p.h, 4); ctx.fill();
    ctx.fillStyle = '#c22548';
    RE.Draw.roundRect(ctx, -p.w / 2, -5, p.w, 5, 3); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.fillRect(-p.w / 2 + 2, -p.h + 2, 4, 3);

    // 眼睛（大白眼珠是 Meat Boy 的招牌臉）
    var ex = p.face > 0 ? 1 : -4;
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(ex - 2, -p.h + 4, 4, 5);
    ctx.fillRect(ex + 3, -p.h + 4, 4, 5);
    ctx.fillStyle = '#1a1a24';
    ctx.fillRect(ex - 1 + p.face, -p.h + 6, 2, 2);
    ctx.fillRect(ex + 4 + p.face, -p.h + 6, 2, 2);
    ctx.restore();

    // 貼牆摩擦光
    if (p.wall !== 0) {
        ctx.fillStyle = 'rgba(255,255,255,0.35)';
        ctx.fillRect(p.wall > 0 ? p.x + p.w : p.x - 2, p.y + 2, 2, p.h - 4);
        if (Math.random() < 0.4) {
            P.burst(p.wall > 0 ? p.x + p.w : p.x, p.y + p.h - 2, 1, {
                colors: ['#ff8a9e'], speedMin: 10, speedMax: 40, gravity: -60,
                lifeMin: 0.2, lifeMax: 0.4, sizeMin: 1, sizeMax: 2 });
        }
    }

    // 高速奔跑殘影感：速度夠快時腳下冒粒子
    if (p.grounded && Math.abs(p.vx) > 170 && Math.random() < 0.3) {
        P.burst(p.x + p.w / 2 - p.face * 5, p.y + p.h - 1, 1, {
            colors: ['#d94f63'], speedMin: 10, speedMax: 50, gravity: 200,
            lifeMin: 0.15, lifeMax: 0.3, sizeMin: 1.5, sizeMax: 2.5 });
    }
}

function drawHUD() {
    if (s.hintT > 0) {
        var a = Math.min(1, s.hintT / 0.6);
        ctx.globalAlpha = a;
        RE.Draw.text(ctx, s.def.name, VW / 2, 14, { size: 15, align: 'center', color: '#ff8fc8' });
        RE.Draw.text(ctx, s.def.hint, VW / 2, 36, { size: 11, align: 'center', color: '#ffe9f0' });
        ctx.globalAlpha = 1;
    }
    if (s.roomDeaths >= 10) {
        RE.Draw.text(ctx, '這間爆漿 ' + s.roomDeaths + ' 次。原作玩家全破平均爆幾百次，繼續。',
            VW / 2, VH - 18, { size: 10, align: 'center', color: 'rgba(255,255,255,0.45)', stroke: false });
    }
}

// ======================================================================
G.on('restart', function () { reset(); });
reset();
G.run(update, render);
showTitleScreen();
</script>
</body>
</html>
