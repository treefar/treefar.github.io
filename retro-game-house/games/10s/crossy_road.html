<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>遊戲時光屋 ✦ 路口衝刺者</title>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Press+Start+2P&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../engine/retro-shell.css">
</head>
<body>
<script src="../../engine/retro-core.js"></script>
<script src="../../engine/retro-audio.js"></script>
<script src="../../engine/retro-shell.js"></script>
<script>
/* ==========================================================================
   路口衝刺者 — 致敬 Crossy Road (Hipster Whale, 2014)
   --------------------------------------------------------------------------
   復刻重點：
   1. **把 Frogger 的「一關一關」改成「一路往前」**。
      原版青蛙過河有明確的關卡與終點；這款拿掉終點，只留下「再往前一格」。
   2. **後方會追上來**。畫面下緣持續上推，落後太久就被抓走——
      Frogger 讓你可以待在安全島上慢慢等，這款不行。
      **它把「等待」從最佳策略變成會被懲罰的策略**，節奏因此完全不同。
   3. **角色收集是它的營運核心**：金幣抽角色，全部是外觀、不影響數值。
      在 2014 年的手遊環境裡，這是「不逼課、不擋關」的示範案例。
   4. 一次一格的跳躍，操作沒有任何模糊地帶——失敗永遠是自己按錯，不是手滑。
   ========================================================================== */

var G = RetroShell.boot({
    id: 'crossy_road',
    title: '路口衝刺者',
    tagline: '往前一格，再往前一格，別回頭',
    original: 'Crossy Road (Hipster Whale, 2014)',
    decade: '10s', year: 2014, platform: '手機', genre: '格狀動作',
    developer: 'Hipster Whale', bgm: '10s',
    width: 400, height: 520,
    hud: [
        { key: 'score', label: 'SCORE' },
        { key: 'row', label: '前進', init: 0 },
        { key: 'zone', label: '區域', init: '1/5' },
        { key: 'coin', label: '金幣', init: 0 }
    ],
    lives: 5,
    touch: 'dpad',
    controls: [
        { keys: ['↑'], desc: '往前跳一格' },
        { keys: ['←', '→', '↓'], desc: '左右與後退' }
    ],
    howto: '一次跳一格，避開車子、火車與河水。' +
           '<strong>不要停太久</strong>——畫面下緣會一直往上推，落後就被抓走。' +
           '河上的圓木可以站，但它會帶著你漂。' +
           '沿路的金幣可以解鎖新角色（純外觀，不影響能力）。',
    lesson: {
        verb: '每次只跳一格，讀懂車流、鐵軌、河木與追趕線的時間窗口，再決定「前進」或「先橫移」。',
        innovation: '把《Frogger》的固定終點改成沒有終點的短決策串，並用自動上推的追趕線消除原作可以停在安全島等待的漏洞；角色只換外觀，不改能力，讓技術與收藏分開。',
        mission: '依序通過五個區域，至少各記錄一次車流、火車、漂木與追趕線造成的死亡；比較「等空檔」與「硬跳前進」哪一種決策在夜路最可靠。',
        evolution: '《Frogger》把道路與河流切成有終點的關卡；《Crossy Road》把它改成無盡街機與可選角色；《Flappy Bird》與《Slither.io》再把同樣的短回合、立即重試與高分追逐推向單鍵或滑動控制。',
        reflection: '如果沒有後方追趕線，玩家是否會永遠等到完美空檔？這個「不能等待」的規則如何改變你對風險的判斷？'
    },
    design: '《Crossy Road》解決了「經典過馬路遊戲容易被安全島拆成等待題」的問題。它保留《Frogger》的道路、鐵軌與河流，卻把終點改成無盡前進，再用後方追趕線把停留也變成風險；玩家每一格都要同時讀距離與時間。一次一格的輸入讓失敗歸因清楚，立體像素則讓車流、漂木與角色在手機小螢幕上保持輪廓可辨。後來的《Flappy Bird》與《Slither.io》延續這種短回合、立即重試與高分追逐，但把空間決策換成垂直節奏或連續滑動。',
    history: 'Hipster Whale 的官方 Press Kit 記錄工作室由 Matt Hall 與 Andy Sum 於 2014 年 11 月成立，並以《Crossy Road》作為首發；GDC 2015 簡報則保存了六週原型延長為十二週、由《Flappy Bird》與《Frogger》交叉發想、以及「所有角色同能力」的設計取捨。這使本作不只是復古《Frogger》的換皮，而是 2014 年手機短回合、免費遊玩與可分享收藏系統的重新組合。',
    sources: [
        { label: 'Hipster Whale 官方 Press Kit', url: 'https://www.hipsterwhale.com/press-kit' },
        { label: 'GDC 2015：Crossy Road: A Whale of a Time', url: 'https://media.gdcvault.com/gdc2015/presentations/Hall_Matthew_Crossy_Road_Whale.pdf' },
        { label: 'Crossy Road 官方網站', url: 'https://www.crossyroad.com/' }
    ]
});

var ctx = G.ctx, W = G.width, H = G.height;
var P = new RE.Particles(400);
var FT = new RE.FloatText();

// ======================================================================
var COLS = 9;
var CW = Math.floor(W / COLS);        // 格寬
var RH = 46;                          // 每一排的高度
var BASE_Y = H - 90;                  // 玩家起始排在畫面上的位置

/* ----------------------------------------------------------------------
   五個區域。難度靠三個數字收緊：目標排數、危險排比例、車速。
   區域主題輪替（馬路→鐵軌→河流→雪地→夜路），
   因為這款的樂趣有一半來自「下一排是什麼」。

   排數是照「累積存活率」訂的：整趟要連過的排數 × 每排的失手機率
   決定了通關率。第一版是 30/36/42/48/54＝共 210 排配三條命，
   熟練機器人 10 場 0 通關——不是哪一區有問題，是旅程本身太長。
   ---------------------------------------------------------------------- */
var ZONES = [
    { name: '郊區公路', hint: '看好車距再跳，畫面會一直往上推',
      goal: 22, spd: [58, 92],  danger: 0.5, push: 7,  kinds: ['road'] },
    { name: '鐵道口', hint: '火車很快，但那一排的空檔也長',
      goal: 26, spd: [66, 104], danger: 0.52, push: 8,  kinds: ['road', 'rail'] },
    { name: '河灣', hint: '圓木會帶著你漂，別漂出畫面',
      goal: 30, spd: [62, 98],  danger: 0.56, push: 9,  kinds: ['road', 'river'] },
    { name: '雪原', hint: '路面滑，車也開得更快',
      goal: 34, spd: [78, 122], danger: 0.58, push: 10, kinds: ['road', 'river', 'rail'] },
    { name: '夜路', hint: '最後一段。看不遠，但規則沒變',
      goal: 38, spd: [86, 134], danger: 0.62, push: 12, kinds: ['road', 'rail', 'river'] }
];

var CHARS = [
    { name: '小雞', color: '#ffd166', unlock: 0 },
    { name: '花貓', color: '#ff9ec4', unlock: 12 },
    { name: '青蛙', color: '#7ee7c7', unlock: 30 },
    { name: '夜梟', color: '#c8a2ff', unlock: 60 }
];

var s = {};

// ======================================================================
function reset() {
    s = {
        zone: 0, mode: 'play',
        rows: {},                    // rowIndex -> { kind, items, spd, dir, tree[] }
        p: null,
        camRow: 0, pushRow: -6,      // pushRow：被追上的邊界，只進不退
        maxRow: 0, coins: 0, score: 0,
        lives: 5, char: 0, unlocked: [0],
        over: false, win: false, deathReason: '',
        resultT: 0, resultText: '',
        shakeT: 0
    };
    G.setStat('score', 0);
    G.setStat('coin', 0);
    G.setLives(5);
    loadZone(0);
}

function cfg() { return ZONES[Math.min(s.zone, ZONES.length - 1)]; }

function loadZone(n) {
    s.zone = n;
    s.mode = 'play';
    s.rows = {};
    s.camRow = 0; s.pushRow = -6;
    s.maxRow = 0;
    s.resultT = 0;
    s.p = { row: 0, col: 4, x: 4 * CW + CW / 2, y: 0, hopT: 0,
            fromX: 0, fromRow: 0, onLog: null, alive: true, face: 0, sq: 0 };
    for (var r = -6; r < 18; r++) makeRow(r);
    G.setStat('zone', (n + 1) + '/' + ZONES.length);
    G.setStat('row', 0);
}

/* 生成一排。安全排（草地）之間一定要留出可站的地方，
   否則玩家會遇到「連續四排都是河」這種必死組合。 */
function makeRow(idx) {
    if (s.rows[idx]) return s.rows[idx];
    var c = cfg();
    var row = { kind: 'grass', items: [], trees: [], spd: 0, dir: 1, warn: 0, coin: -1 };

    if (idx <= 0) { s.rows[idx] = row; return row; }        // 起點附近一律安全

    // 連續危險排不可超過三排：第四排強制給草地，這是可通過性的保證
    var prev = 0;
    for (var k = 1; k <= 3; k++) {
        var pr = s.rows[idx - k];
        if (pr && pr.kind !== 'grass') prev++;
        else break;
    }
    var forceSafe = prev >= 3;

    if (!forceSafe && Math.random() < c.danger) {
        row.kind = RE.pick(c.kinds);
        row.dir = Math.random() < 0.5 ? -1 : 1;
        row.spd = RE.rand(c.spd[0], c.spd[1]) * (row.kind === 'rail' ? 3.2 : 1);
        if (row.kind === 'river') row.spd *= 0.55;
        var n = row.kind === 'rail' ? 1 : (row.kind === 'river' ? 3 : 2 + Math.floor(Math.random() * 2));
        var gap = W / n;
        for (var i = 0; i < n; i++) {
            var w = row.kind === 'river' ? RE.rand(CW * 1.6, CW * 2.6)
                  : row.kind === 'rail' ? CW * 3.2
                  : RE.rand(CW * 0.9, CW * 1.5);
            row.items.push({ x: i * gap + RE.rand(0, gap * 0.4), w: w });
        }
        if (row.kind === 'rail') row.warn = 0;
    } else {
        // 草地：擺幾棵樹當障礙，但至少留三格可以走
        var blocked = {};
        var treeN = Math.floor(Math.random() * 3);
        for (var t = 0; t < treeN; t++) {
            var col = Math.floor(Math.random() * COLS);
            if (Object.keys(blocked).length >= COLS - 3) break;
            blocked[col] = 1;
            row.trees.push(col);
        }
        if (Math.random() < 0.22) {
            var cc = Math.floor(Math.random() * COLS);
            if (!blocked[cc]) row.coin = cc;
        }
    }
    s.rows[idx] = row;
    return row;
}

// ======================================================================
function update(dt) {
    P.update(dt); FT.update(dt);
    if (s.over) return;

    if (s.mode === 'result') {
        s.resultT -= dt;
        if (s.resultT <= 0) nextZone();
        return;
    }

    var c = cfg();
    var p = s.p;

    // ---- 輸入：一次一格 ----
    if (p.hopT <= 0) {
        if (RE.Input.pressed('up')) hop(0, 1);
        else if (RE.Input.pressed('down')) hop(0, -1);
        else if (RE.Input.pressed('left')) hop(-1, 0);
        else if (RE.Input.pressed('right')) hop(1, 0);
    } else {
        p.hopT -= dt;
        if (p.hopT <= 0) landHop();
    }

    // ---- 車輛與圓木 ----
    for (var key in s.rows) {
        var row = s.rows[key];
        if (!row.items.length) continue;
        /* 重生的間隔要依種類分開。
           火車寬 141px、時速是一般車的三倍多，用同一組間隔的話
           繞一圈只要兩秒——等於那一排永遠有車，玩家根本沒有空檔可以過。
           火車給長間隔（該排會有明顯的「空檔期」），一般車維持密集。 */
        var gapMin = row.kind === 'rail' ? 460 : 20;
        var gapMax = row.kind === 'rail' ? 900 : 120;
        for (var i = 0; i < row.items.length; i++) {
            var it = row.items[i];
            it.x += row.spd * row.dir * dt;
            if (row.dir > 0 && it.x > W + 40) it.x = -it.w - RE.rand(gapMin, gapMax);
            if (row.dir < 0 && it.x + it.w < -40) it.x = W + RE.rand(gapMin, gapMax);
        }
    }

    // ---- 站在圓木上會被帶著漂 ----
    var pr = s.rows[p.row];
    if (pr && pr.kind === 'river' && p.hopT <= 0) {
        if (p.onLog) {
            p.x += pr.spd * pr.dir * dt;
            if (p.x < -6 || p.x > W + 6) { die('漂出畫面'); return; }
            p.col = Math.round((p.x - CW / 2) / CW);
        } else {
            die('掉進水裡'); return;
        }
    }

    // ---- 撞擊判定 ----
    if (pr && (pr.kind === 'road' || pr.kind === 'rail') && p.hopT <= 0) {
        for (var j = 0; j < pr.items.length; j++) {
            var car = pr.items[j];
            if (p.x > car.x - 6 && p.x < car.x + car.w + 6) { die(pr.kind === 'rail' ? '被火車撞上' : '被車撞上'); return; }
        }
    }

    // ---- 畫面往前推：這一條就是本作與 Frogger 的分水嶺 ----
    s.pushRow += (c.push / 60) * dt;
    if (p.row < s.pushRow) { die('被抓走了'); return; }

    // 鏡頭：跟著玩家，但不會退回去
    var wantCam = Math.max(p.row, s.pushRow + 3);
    s.camRow += (wantCam - s.camRow) * (1 - Math.pow(0.002, dt));

    // 生成前方的排
    var far = Math.floor(s.camRow) + 16;
    for (var r = Math.floor(s.camRow) - 8; r < far; r++) makeRow(r);

    if (s.maxRow >= c.goal) zoneClear();
}

function hop(dx, dy) {
    var p = s.p;
    var nc = p.col + dx, nr = p.row + dy;
    if (nc < 0 || nc >= COLS) return;
    if (nr < Math.floor(s.pushRow)) return;
    var target = makeRow(nr);
    if (target.trees.indexOf(nc) >= 0) return;       // 樹擋住

    p.fromX = p.x; p.fromRow = p.row;
    p.col = nc; p.row = nr;
    p.hopT = 0.12;
    p.face = dx !== 0 ? dx : 0;
    p.onLog = null;
    RetroAudio.play('jump');
}

function landHop() {
    var p = s.p;
    p.x = p.col * CW + CW / 2;
    var row = s.rows[p.row];
    p.sq = 1;

    if (row.kind === 'river') {
        // 落在圓木上才算安全。判定要用圓木的實際範圍，不能只看排的種類
        for (var i = 0; i < row.items.length; i++) {
            var log = row.items[i];
            if (p.x > log.x && p.x < log.x + log.w) { p.onLog = log; break; }
        }
        if (!p.onLog) { die('掉進水裡'); return; }
        RetroAudio.play('step');
    } else {
        RetroAudio.play('step');
    }

    if (row.coin === p.col) {
        row.coin = -1;
        s.coins++;
        addScore(50);
        G.setStat('coin', s.coins);
        RetroAudio.play('coin');
        P.burst(p.x, rowY(p.row), 8, { colors: ['#ffd166', '#ffffff'], speedMin: 30, speedMax: 120,
            gravity: 240, lifeMin: 0.2, lifeMax: 0.5, sizeMax: 3, glow: true });
        checkUnlock();
    }

    if (p.row > s.maxRow) {
        s.maxRow = p.row;
        addScore(10);
        G.setStat('row', s.maxRow);
    }
}

function checkUnlock() {
    for (var i = 0; i < CHARS.length; i++) {
        if (s.unlocked.indexOf(i) < 0 && s.coins >= CHARS[i].unlock) {
            s.unlocked.push(i);
            s.char = i;                       // 解鎖就直接換上，讓玩家馬上看到差別
            FT.add(W / 2, 120, '解鎖 ' + CHARS[i].name + '！', { color: CHARS[i].color, size: 18, life: 1.8 });
            RetroAudio.play('powerup');
            RE.juice.flash('rgba(255,209,102,0.22)', 0.2);
        }
    }
}

function die(reason) {
    if (s.mode !== 'play') return;
    s.lives--;
    s.deathReason = reason;
    G.setLives(Math.max(0, s.lives));
    RE.juice.impact(3);
    RE.juice.flash('rgba(255,107,107,0.3)', 0.16);
    RetroAudio.play('hurt');
    P.burst(s.p.x, rowY(s.p.row), 16, { colors: [CHARS[s.char].color, '#ffffff'],
        speedMin: 50, speedMax: 200, gravity: 300, lifeMin: 0.2, lifeMax: 0.6, sizeMax: 4 });
    FT.add(W / 2, 160, reason, { color: '#ff6b6b', size: 17, life: 1.4 });

    if (s.lives <= 0) { finish(false); return; }
    // 還有命：退回最近的安全排重來，不重置整個區域——失敗成本要低
    var back = s.p.row;
    while (back > 0 && (!s.rows[back] || s.rows[back].kind !== 'grass')) back--;
    s.p.row = back; s.p.col = 4;
    s.p.x = 4 * CW + CW / 2;
    s.p.hopT = 0; s.p.onLog = null;
    s.pushRow = Math.min(s.pushRow, back - 4);
}

function zoneClear() {
    s.mode = 'result';
    s.resultT = 1.8;
    s.resultText = '通過！';
    addScore(600 + s.zone * 300);
    RetroAudio.play('win');
    RE.juice.flash('rgba(255,209,102,0.2)', 0.25);
}

function nextZone() {
    if (s.zone >= ZONES.length - 1) { finish(true); return; }
    loadZone(s.zone + 1);
    G.stageCard(s.zone + 1, cfg().name, cfg().hint);
}

function addScore(n) { s.score += n; G.setStat('score', s.score); }

function finish(win) {
    s.over = true; s.win = win;
    if (win) {
        addScore(2000 + s.coins * 20);
        G.gameOver({ score: s.score, win: true,
            body: '五個區域都過了，收集了 ' + s.coins + ' 枚金幣。' +
                  '注意到了嗎——金幣只換角色外觀，一次都沒有影響過你的能力。' +
                  '**要改變一個老玩法的體感，往往不必動核心規則，只要動「時間壓力」**：' +
                  '這款和《Frogger》的差別，就只是畫面會自己往前推而已。' });
    } else {
        G.gameOver({ score: s.score, win: false,
            body: '停在第 ' + (s.zone + 1) + ' 區「' + cfg().name + '」第 ' + s.maxRow + ' 排（' + s.deathReason + '）。' +
                  '在《Frogger》裡你可以站在安全島上等到完全安全再走，' +
                  '這款不行——**它把「等待」從最佳策略變成會被懲罰的策略**，' +
                  '那個「現在衝還是再等半拍」的猶豫，就是全部的樂趣。' });
    }
}

// ======================================================================
// 繪製
// ======================================================================
function rowY(r) { return BASE_Y - (r - s.camRow) * RH; }

function render() {
    var c = cfg();
    var night = s.zone === 4;
    G.clear(night ? '#0f1524' : '#8fd3ff');
    G.beginWorld();

    var r0 = Math.floor(s.camRow) - 3, r1 = Math.floor(s.camRow) + 13;
    var r, row, y;

    // 地面
    for (r = r1; r >= r0; r--) {
        row = s.rows[r];
        if (!row) continue;
        y = rowY(r);
        if (y < -RH || y > H + RH) continue;
        drawRowBase(row, r, y, night);
    }
    // 物件（車、圓木、樹、金幣）與玩家依排序畫，才有前後遮擋
    for (r = r0; r <= r1; r++) {
        row = s.rows[r];
        if (!row) continue;
        y = rowY(r);
        if (y < -RH || y > H + RH) continue;
        drawRowItems(row, r, y, night);
        if (r === s.p.row) drawPlayer();
    }

    drawPushLine();
    P.draw(ctx);
    FT.draw(ctx);
    drawHUD(c);
    if (s.mode === 'result') drawResult();

    G.endWorld();
    G.postFX({ scanAlpha: 0.04, vignetteStrength: night ? 0.7 : 0.35 });
}

function drawRowBase(row, r, y, night) {
    var col;
    if (row.kind === 'grass') col = (r % 2) ? (night ? '#1a2b1f' : '#6fbf73') : (night ? '#16251b' : '#63b268');
    else if (row.kind === 'road') col = night ? '#20222c' : '#4a4f5a';
    else if (row.kind === 'rail') col = night ? '#2a2118' : '#6b5a44';
    else col = night ? '#16324a' : '#3f8fd0';
    ctx.fillStyle = col;
    ctx.fillRect(0, y - RH + 6, W, RH);

    if (row.kind === 'road') {
        ctx.fillStyle = 'rgba(255,255,255,0.35)';
        for (var x = 6; x < W; x += 30) ctx.fillRect(x, y - RH / 2 + 4, 16, 3);
    } else if (row.kind === 'rail') {
        ctx.fillStyle = night ? '#4a4038' : '#8b7355';
        ctx.fillRect(0, y - RH / 2 - 4, W, 4);
        ctx.fillRect(0, y - RH / 2 + 8, W, 4);
    } else if (row.kind === 'river') {
        ctx.fillStyle = 'rgba(255,255,255,0.14)';
        for (var wx = 0; wx < W; wx += 26) {
            ctx.fillRect(wx + (r * 7 % 20), y - RH / 2 + Math.sin(wx * 0.1 + r) * 3, 14, 3);
        }
    }
}

function drawRowItems(row, r, y, night) {
    var i;
    // 金幣
    if (row.coin >= 0) {
        var cx = row.coin * CW + CW / 2;
        ctx.save();
        ctx.shadowBlur = 10; ctx.shadowColor = '#ffd166';
        ctx.fillStyle = '#ffd166';
        ctx.beginPath(); ctx.ellipse(cx, y - 14, 7, 9, 0, 0, RE.TAU); ctx.fill();
        ctx.restore();
    }
    // 樹
    for (i = 0; i < row.trees.length; i++) {
        var tx = row.trees[i] * CW + CW / 2;
        ctx.fillStyle = night ? '#2c2018' : '#6b4a2f';
        ctx.fillRect(tx - 4, y - 16, 8, 16);
        ctx.fillStyle = night ? '#1c3a28' : '#3f8f52';
        ctx.beginPath(); ctx.arc(tx, y - 26, 15, 0, RE.TAU); ctx.fill();
    }
    // 車輛 / 火車 / 圓木
    for (i = 0; i < row.items.length; i++) {
        var it = row.items[i];
        if (row.kind === 'river') {
            ctx.fillStyle = night ? '#4a3a26' : '#8b6b45';
            RE.Draw.roundRect(ctx, it.x, y - 30, it.w, 26, 6); ctx.fill();
            ctx.fillStyle = 'rgba(255,255,255,0.18)';
            RE.Draw.roundRect(ctx, it.x + 4, y - 27, it.w - 8, 6, 3); ctx.fill();
        } else if (row.kind === 'rail') {
            ctx.fillStyle = '#c94a4a';
            RE.Draw.roundRect(ctx, it.x, y - 34, it.w, 30, 5); ctx.fill();
            ctx.fillStyle = '#ffd166';
            ctx.fillRect(it.x + (row.dir > 0 ? it.w - 8 : 2), y - 26, 6, 8);
        } else {
            var carCol = ['#ff9ec4', '#7dd3fc', '#ffd166', '#c8a2ff', '#ff8f6b'][(row.dir > 0 ? i : i + 2) % 5];
            ctx.fillStyle = carCol;
            RE.Draw.roundRect(ctx, it.x, y - 30, it.w, 26, 5); ctx.fill();
            ctx.fillStyle = 'rgba(20,26,34,0.55)';
            RE.Draw.roundRect(ctx, it.x + it.w * 0.22, y - 26, it.w * 0.5, 10, 3); ctx.fill();
            // 夜路開頭燈，這是「看不遠」的補償
            if (night) {
                ctx.fillStyle = 'rgba(255,240,180,0.35)';
                var hx = row.dir > 0 ? it.x + it.w : it.x - 26;
                ctx.fillRect(hx, y - 22, 26, 10);
            }
        }
    }
}

function drawPlayer() {
    var p = s.p;
    var t = p.hopT > 0 ? 1 - p.hopT / 0.12 : 1;
    var x = p.hopT > 0 ? p.fromX + (p.col * CW + CW / 2 - p.fromX) * t : p.x;
    var yr = p.hopT > 0 ? p.fromRow + (p.row - p.fromRow) * t : p.row;
    var y = rowY(yr);
    var lift = p.hopT > 0 ? Math.sin(t * Math.PI) * 16 : 0;
    if (p.sq > 0) p.sq -= 0.08;

    var col = CHARS[s.char].color;
    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,0.28)';
    ctx.beginPath(); ctx.ellipse(x, y - 4, 12, 5, 0, 0, RE.TAU); ctx.fill();

    var sq = 1 + Math.max(0, p.sq) * 0.25;
    ctx.fillStyle = col;
    ctx.strokeStyle = 'rgba(20,26,34,0.8)'; ctx.lineWidth = 2;
    RE.Draw.roundRect(ctx, x - 11 * sq, y - 26 - lift, 22 * sq, 22 / sq, 6);
    ctx.fill(); ctx.stroke();
    // 眼睛與喙
    ctx.fillStyle = '#232a33';
    ctx.fillRect(x - 6, y - 20 - lift, 3, 3);
    ctx.fillRect(x + 3, y - 20 - lift, 3, 3);
    ctx.fillStyle = '#ff8f6b';
    ctx.fillRect(x - 2, y - 15 - lift, 5, 3);
    ctx.restore();
}

/** 被追上的邊界。要畫出來，否則玩家不知道自己為什麼死 */
function drawPushLine() {
    var y = rowY(s.pushRow);
    if (y < -20 || y > H + 20) return;
    var grad = ctx.createLinearGradient(0, y, 0, y + 90);
    grad.addColorStop(0, 'rgba(20,10,30,0.75)');
    grad.addColorStop(1, 'rgba(20,10,30,0)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, y, W, 90);
    ctx.strokeStyle = 'rgba(255,107,107,0.7)';
    ctx.lineWidth = 2;
    ctx.setLineDash([10, 6]);
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    ctx.setLineDash([]);
}

function drawHUD(c) {
    // 進度條：目前排數／目標
    var bw = W - 100, bx = 50;
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    RE.Draw.roundRect(ctx, bx, 12, bw, 8, 4); ctx.fill();
    ctx.fillStyle = '#7ee7c7';
    RE.Draw.roundRect(ctx, bx, 12, Math.max(3, bw * RE.clamp(s.maxRow / c.goal, 0, 1)), 8, 4); ctx.fill();
    RE.Draw.text(ctx, cfg().name + '　' + s.maxRow + ' / ' + c.goal, W / 2, 26,
        { size: 12, align: 'center', color: '#ffffff' });
    // 目前角色
    ctx.fillStyle = CHARS[s.char].color;
    RE.Draw.roundRect(ctx, 12, 12, 12, 12, 3); ctx.fill();
    RE.Draw.text(ctx, CHARS[s.char].name, 30, 14, { size: 11, color: '#ffffff', stroke: false });
}

function drawResult() {
    ctx.save();
    ctx.fillStyle = 'rgba(10,20,30,0.72)';
    ctx.fillRect(0, 0, W, H);
    RE.Draw.text(ctx, s.resultText, W / 2, H / 2 - 20, { size: 34, align: 'center', color: '#ffd166' });
    RE.Draw.text(ctx, s.zone >= ZONES.length - 1 ? '全部通過了' : '下一區：' + ZONES[s.zone + 1].name,
        W / 2, H / 2 + 20, { size: 14, align: 'center', color: '#cfe3f0' });
    ctx.restore();
}

// ======================================================================
G.on('restart', function () { reset(); });
reset();
G.run(update, render);
G.showTitle({
    body: '一次跳一格，避開車子、火車與河水。畫面下緣會一直往上推——' +
          '不要停太久。沿路的金幣可以解鎖新角色（純外觀，不影響能力）。',
    onStart: function () { reset(); }
});
</script>
</body>
</html>
