/* ==========================================================================
   街頭拳影 — 致敬 Street Fighter II (Capcom, 1991)
   --------------------------------------------------------------------------
   復刻重點（本作把「距離戰 × 幀資料 × 取消連段」當成第一優先）：

   1. 四名角色的差異全部落在可量化的參數上：移動速度、攻擊距離倍率、
      傷害倍率、體力。選誰不只是換皮，而是換一套「該站在哪裡」的問題。
   2. 每一招都有 startup / active / recovery 三段幀資料（本作以秒計）。
      出招前後都有硬直，這是格鬥遊戲「賭博感」的來源——
      按下按鍵那一刻，你就把接下來的 0.3 秒交出去了。
   3. 取消連段：輕攻擊「命中」後，recovery 可以被下一招取消。
      這在 SFII 原作裡是程式 bug，卻被玩家挖出來變成技術核心，
      Capcom 在續作決定保留它。本作忠實重現這個機制。
   4. 指令輸入：↓↘→ 氣功、→↓↘ 升龍、↓↙← 突進。
      指令有 0.55 秒的輸入窗，方向記錄採「變化時才寫入」的緩衝。
   5. 五名手工調參的對手，AI 參數（反應時間、進攻慾望、格擋率、
      對空率、連段率）全部寫在下方 OPPONENTS 陣列，難度是設計出來的。
   ========================================================================== */

function lerpPt(a, b, t) { return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t]; }
function lerpPose(a, b, t) {
    return {
        h: lerpPt(a.h, b.h, t), sh: lerpPt(a.sh, b.sh, t),
        fe: lerpPt(a.fe, b.fe, t), fh: lerpPt(a.fh, b.fh, t),
        be: lerpPt(a.be, b.be, t), bh: lerpPt(a.bh, b.bh, t),
        fk: lerpPt(a.fk, b.fk, t), ff: lerpPt(a.ff, b.ff, t),
        bk: lerpPt(a.bk, b.bk, t), bf: lerpPt(a.bf, b.bf, t),
        hip: lerpPt(a.hip, b.hip, t)
    };
}

// 招式 → 姿勢對應（起手 / 判定 / 收招沿用判定姿勢回彈）
var MOVE_POSE = {
    lp: ['lpS', 'lpA'], hp: ['hpS', 'hpA'], lk: ['lkS', 'lkA'], hk: ['hkS', 'hkA'],
    clp: ['crouch', 'clpA'], clk: ['crouch', 'clkA'],
    jp: ['jump', 'jpA'], jk: ['jump', 'jkA'],
    fire: ['fireS', 'fireA'], upper: ['lpS', 'upperA'], rush: ['hpS', 'rushA'],
    slide: ['crouch', 'slideA'], quake: ['hpS', 'quakeA'], grab: ['hpS', 'rushA']
};

// ======================================================================
// 遊戲狀態
// ======================================================================
var s = null;

function makeFighter(charIndex, x, face, isAI, hpMul) {
    var c = CHARS[charIndex];
    return {
        c: c, ci: charIndex,
        x: x, y: GY, vx: 0, vy: 0, face: face,
        maxHp: Math.round(c.hp * (hpMul || 1)), hp: Math.round(c.hp * (hpMul || 1)),
        state: 'idle',      // idle | walk | crouch | jump | atk | hit | block | down | win
        st: 0,              // 狀態計時
        move: null, mk: null, phase: '', hitDone: false, canCancel: false,
        cancelT: 0, inv: 0, hitstun: 0, blockstun: 0,
        holdBack: false, crouching: false, air: false,
        cmd: [], anim: 0, flash: 0, dizzyT: 0,
        ai: isAI ? { t: 0, intent: 'wait', intentT: 0, cfg: null, crouchBlock: false, turtle: 0 } : null,
        pushT: 0
    };
}

function reset() {
    s = {
        phase: 'select',    // select | ready | fight | roundEnd | matchEnd
        phaseT: 0, sel: 0, stage: 0,
        p: null, e: null,
        winP: 0, winE: 0, round: 1,
        time: ROUND_TIME, combo: 0, comboT: 0, comboDmg: 0, maxCombo: 0,
        shots: [], waves: [], banner: '', bannerT: 0, camX: 0,
        result: '', perfect: false
    };
    P.clear(); FT.clear();
    G.setStat('score', 0);
    G.setStat('stage', '1/5');
    G.setStat('combo', 0);
    G.setLives(2);
}

function startStage(i) {
    var op = OPPONENTS[i];
    var eIndex = op.charIndex < 0 ? s.sel : op.charIndex;
    s.stage = i;
    s.winP = 0; s.winE = 0; s.round = 1;
    s.p = makeFighter(s.sel, 300, 1, false, 1);
    s.e = makeFighter(eIndex, 600, -1, true, op.ai.hpMul);
    s.e.ai.cfg = op.ai;
    s.shots = []; s.waves = [];
    s.time = ROUND_TIME;
    s.phase = 'ready'; s.phaseT = 0;
    s.banner = 'ROUND 1'; s.bannerT = 0;
    G.setStat('stage', (i + 1) + '/5');
}

function startRound() {
    var op = OPPONENTS[s.stage];
    var eIndex = op.charIndex < 0 ? s.sel : op.charIndex;
    s.p = makeFighter(s.sel, 300, 1, false, 1);
    s.e = makeFighter(eIndex, 600, -1, true, op.ai.hpMul);
    s.e.ai.cfg = op.ai;
    s.shots = []; s.waves = [];
    s.time = ROUND_TIME;
    s.phase = 'ready'; s.phaseT = 0;
    s.banner = 'ROUND ' + s.round; s.bannerT = 0;
    P.clear();
}

// ======================================================================
// 招式啟動
// ======================================================================
function moveOf(f, key) {
    if (SPECIALS[key]) return SPECIALS[key];
    return MOVES[key];
}

function startMove(f, key) {
    var m = moveOf(f, key);
    if (!m) return;
    f.state = 'atk'; f.mk = key; f.move = m; f.st = 0;
    f.phase = 'startup'; f.hitDone = false; f.canCancel = false;
    f.crouching = !!m.crouch || !!m.low;
    if (m.inv) f.inv = m.inv;
    if (m.rise) { f.vy = m.rise; f.air = true; }
    if (m.dash) f.vx = m.dash * f.face;
    if (!m.air && !m.rise && !m.dash) f.vx = 0;
    RetroAudio.play(m.proj ? 'shoot' : (m.lvl >= 2 ? 'slash' : 'blip'));
}

/** 命中判定框：只有 active 期間存在 */
function hitbox(f) {
    if (f.state !== 'atk' || f.phase !== 'active' || f.hitDone) return null;
    var m = f.move;
    if (m.proj) return null;
    var reach = (m.reach || 36) * f.c.reach;
    var oy = m.oy || -44;
    var h = 26;
    return {
        x: f.face > 0 ? f.x + 10 : f.x - 10 - reach,
        y: f.y + oy - h / 2,
        w: reach, h: h
    };
}

function hurtbox(f) {
    if (f.state === 'down') return { x: f.x - 26, y: f.y - 18, w: 52, h: 18 };
    if (f.crouching || f.state === 'crouch') return { x: f.x - 17, y: f.y - 46, w: 34, h: 46 };
    if (f.air) return { x: f.x - 15, y: f.y - 56, w: 30, h: 56 };
    return { x: f.x - 15, y: f.y - 72, w: 30, h: 72 };
}

/** 是否處於「有效防禦」姿態 */
function isBlocking(f, m) {
    if (f.state === 'atk' || f.state === 'hit' || f.state === 'down' || f.air) return false;
    if (!f.holdBack) return false;
    if (m.unblockable) return false;
    if (m.h === 'low') return f.crouching;      // 下段：必須蹲擋
    if (m.h === 'over') return !f.crouching;    // 跳擊：必須站擋
    return true;
}

// ======================================================================
// 命中處理
// ======================================================================
function applyHit(att, def, m, srcX) {
    var blocked = isBlocking(def, m);
    // 真連段的定義：對手還在硬直中就又被打到，中間沒有還手的餘地。
    // 只用「兩次命中間隔很短」判定會把「他站起來又被打」也算成連段，那是灌水。
    var wasStunned = (def.state === 'hit' && def.hitstun > 0);
    var dmg = Math.round(m.dmg * att.c.dmg * (blocked ? 0.22 : 1));
    var px = (srcX === undefined ? att.x + 28 * att.face : srcX);
    var py = def.y - (def.crouching ? 30 : 44);

    if (blocked) {
        def.hp -= dmg;
        def.blockstun = m.blockstun;
        def.state = 'block'; def.st = 0;
        def.vx = m.push * 0.45 * att.face;
        RetroAudio.play('block');
        RE.juice.hitstop(0.03);
        RE.juice.shake(0.10);
        P.sparks(px, py, att.face > 0 ? -0.5 : Math.PI + 0.5, 7, '#bfe6ff');
        FT.add(px, py - 14, 'GUARD', { color: '#9fd6ff', size: 14, life: 0.6 });
        if (att === s.p) addScore(dmg);
        return 'block';
    }

    def.hp -= dmg;
    def.hitstun = m.hitstun;
    def.state = 'hit'; def.st = 0;
    def.flash = 0.12;
    def.vx = m.push * att.face;
    def.canCancel = false;
    def.move = null;
    if (m.knockdown || def.hp <= 0) {
        def.state = 'down'; def.st = 0; def.air = true;
        def.vy = -300; def.vx = m.push * 1.1 * att.face;
    }

    // 打擊感：頓幀 + 震動 + 粒子 + 音效，強度隨招式等級遞增
    RE.juice.impact(m.lvl || 1);
    RetroAudio.play(m.sfx || 'hit');
    P.sparks(px, py, att.face > 0 ? -0.5 : Math.PI + 0.5, 6 + (m.lvl || 1) * 4, '#fff0aa');
    P.burst(px, py, 4 + (m.lvl || 1) * 3, {
        colors: ['#ffd166', '#ff8a4c', '#fff0aa'], speedMin: 60, speedMax: 220,
        sizeMin: 2, sizeMax: 4.5, lifeMin: 0.2, lifeMax: 0.45, gravity: 300
    });
    if ((m.lvl || 1) >= 3) P.ring(px, py, '#fff0aa', 46);

    // 連段計數：對手仍在硬直中又被打到，才算連段
    if (att === s.p) {
        if (wasStunned && s.combo > 0) { s.combo++; } else { s.combo = 1; s.comboDmg = 0; }
        s.comboT = 0.9;
        s.comboDmg += dmg;
        if (s.combo > s.maxCombo) { s.maxCombo = s.combo; G.setStat('combo', s.maxCombo); }
        if (s.combo >= 2) {
            RetroAudio.play('combo', s.combo);
            FT.add(px, py - 26, s.combo + ' HIT', { color: '#ffd166', size: 15, life: 0.8 });
        }
        addScore(dmg * (1 + (s.combo - 1) * 0.5));
    } else {
        s.combo = 0; s.comboT = 0;
    }
    FT.add(px, py, String(dmg), { color: blocked ? '#9fd6ff' : '#ff9a6c', size: 14 });

    // 命中確認：輕攻擊可取消收招，這就是連段的入口
    if (m.cancel) { att.canCancel = true; att.cancelT = 0.34; }
    return 'hit';
}

function addScore(n) {
    G.setStat('score', (G.stats.score || 0) + Math.round(n));
}

// ======================================================================
// 玩家輸入
// ======================================================================
function readDir() {
    var x = RE.Input.axisX(), y = RE.Input.axisY();
    // numpad 記法：5 中立、6 前、4 後、2 下、8 上
    if (y > 0) return x > 0 ? 3 : (x < 0 ? 1 : 2);
    if (y < 0) return x > 0 ? 9 : (x < 0 ? 7 : 8);
    return x > 0 ? 6 : (x < 0 ? 4 : 5);
}

function pushCmd(f, d) {
    if (f.cmd.length && f.cmd[f.cmd.length - 1].d === d) return;
    f.cmd.push({ d: d, t: 0 });
    if (f.cmd.length > 12) f.cmd.shift();
}

function cmdMatch(f, seq) {
    var si = seq.length - 1;
    for (var i = f.cmd.length - 1; i >= 0; i--) {
        if (f.cmd[i].t > CMD_WINDOW) break;
        if (f.cmd[i].d === seq[si]) {
            si--;
            if (si < 0) return true;
        }
    }
    return false;
}

function clearCmd(f) { f.cmd.length = 0; }

function updatePlayer(f, dt) {
    var raw = readDir();
    // 面向對手時，「後」是相對的
    var d = raw;
    if (f.face < 0) {
        // 鏡像 numpad：6↔4、3↔1、9↔7
        var mir = { 1: 3, 2: 2, 3: 1, 4: 6, 5: 5, 6: 4, 7: 9, 8: 8, 9: 7 };
        d = mir[raw];
    }
    pushCmd(f, d);

    var back = (d === 4 || d === 1 || d === 7);
    var fwd = (d === 6 || d === 3 || d === 9);
    var down = (d === 1 || d === 2 || d === 3);
    var up = (d === 7 || d === 8 || d === 9);
    f.holdBack = back;

    if (f.state === 'atk' || f.state === 'hit' || f.state === 'down' || f.state === 'block') {
        // 取消連段：命中確認後，收招可以被下一招接管
        if (f.state === 'atk' && f.canCancel && f.phase !== 'startup') {
            var ck = pickCancel(f, down, fwd);
            if (ck) { startMove(f, ck); clearCmd(f); }
        }
        return;
    }

    // 空中
    if (f.air) {
        if (f.state !== 'atk' && (RE.Input.pressed('a') || RE.Input.pressed('b'))) {
            startMove(f, RE.Input.pressed('b') ? 'jk' : 'jp');
        }
        return;
    }

    // 起跳
    if (up) {
        f.air = true; f.vy = JUMP_V;
        f.vx = (fwd ? 1 : (back ? -1 : 0)) * f.c.jump * f.face;
        f.state = 'jump'; f.st = 0;
        RetroAudio.play('jump');
        return;
    }

    f.crouching = down;

    // 必殺技（優先於通常技）
    var A = RE.Input.pressed('a'), B = RE.Input.pressed('b');
    if (A || B) {
        var sp = trySpecial(f, A, B);
        if (sp) { startMove(f, sp); clearCmd(f); return; }
        startMove(f, normalOf(A, down, fwd));
        return;
    }

    // 移動
    if (down) {
        f.state = 'crouch'; f.vx = 0;
    } else if (fwd) {
        f.state = 'walk'; f.vx = f.c.speed * f.face;
    } else if (back) {
        f.state = 'walk'; f.vx = -f.c.speed * 0.78 * f.face;
    } else {
        f.state = 'idle'; f.vx = 0;
    }
}

/**
 * 通常技的選擇規則。
 * 只有拳／腳兩顆鍵，輕重由「當下的方向」決定：
 * 前進中出招 = 重招（傷害高、距離遠、收招長），中立或後退 = 輕招，蹲下 = 下段系。
 * 這讓手機的兩顆虛擬鍵也能打出完整招式表，同時把「往前踏一步」變成一個要付代價的決定。
 */
function normalOf(isPunch, down, fwd) {
    if (down) return isPunch ? 'clp' : 'clk';
    if (fwd) return isPunch ? 'hp' : 'hk';
    return isPunch ? 'lp' : 'lk';
}

/** 取消時可以接什麼：重攻擊或必殺技 */
function pickCancel(f, down, fwd) {
    var A = RE.Input.pressed('a'), B = RE.Input.pressed('b');
    if (!A && !B) return null;
    var sp = trySpecial(f, A, B);
    if (sp) return sp;
    // 取消一律接重招，輕招接輕招在原作也是不成立的
    if (down) return A ? 'clp' : 'clk';
    return A ? 'hp' : 'hk';
}

function trySpecial(f, A, B) {
    var sp = f.c.specials;
    if (A && cmdMatch(f, CMDS.dp)) return sp.dp;
    if (A && cmdMatch(f, CMDS.qcf)) return sp.qcf;
    if (B && cmdMatch(f, CMDS.qcb)) return sp.qcb;
    if (B && cmdMatch(f, CMDS.qcf)) return sp.qcf === 'fire' ? null : sp.qcf;
    return null;
}

// ======================================================================
// 對手 AI
// ----------------------------------------------------------------------
// 決策採「每次決策擲一次骰」，不是每幀重擲——
// 每幀重擲會讓隨機性被平均掉，AI 反而變成永不失誤的完美機器。
// ======================================================================
function updateAI(f, foe, dt) {
    var cfg = f.ai.cfg;
    var d = Math.abs(f.x - foe.x);
    f.face = foe.x >= f.x ? 1 : -1;

    if (f.state === 'atk' || f.state === 'hit' || f.state === 'down') { f.holdBack = false; return; }

    f.ai.t -= dt;
    f.ai.intentT -= dt;

    // 識破烏龜：累計對手「一直壓著防禦」的時間。
    // 蹲防能同時擋掉中段與下段，如果 AI 只會在地面出招，蹲著不動就是萬能解，
    // 整場對戰會退化成玩家單方面等收招。真正的破防手段有兩種：
    // 跳躍攻擊（必須站著擋）與不可防禦的擒抱。AI 必須自己找到它們。
    if (foe.holdBack && !foe.air) f.ai.turtle += dt;
    else f.ai.turtle = Math.max(0, f.ai.turtle - dt * 1.6);

    // 對空：對手在空中且逼近，用對空技迎擊
    if (foe.air && foe.y < GY - 40 && d < 90 && f.ai.t <= 0 && !f.air) {
        f.ai.t = cfg.react * 0.6;
        if (Math.random() < cfg.antiAir) {
            startMove(f, d < 60 ? f.c.specials.dp : 'hp');
            return;
        }
    }

    // 偵測對手出招 → 決定要不要防禦
    var foeThreat = (foe.state === 'atk' && foe.phase !== 'recovery' && d < 96) ||
                    (s.shots.length > 0 && d > 60);
    if (foeThreat && f.ai.t <= 0) {
        f.ai.t = cfg.react * 0.5;
        if (Math.random() < cfg.blockRate) {
            f.ai.intent = 'block';
            f.ai.intentT = 0.42;
            // 蹲防或站防在「決定防禦的那一刻」擲一次骰。
            // 若每幀重擲，AI 會在兩種防禦間高速抖動，等於同時擋住上下段——變成完美機器。
            f.ai.crouchBlock = Math.random() < 0.5;
        }
    }

    // 破防決策：對手龜了超過 1 秒就換手段。近距離用擒抱（不可防禦），
    // 中距離跳進去（跳擊必須站著擋，蹲防吃滿）。
    if (f.ai.turtle > 1.0 && f.ai.t <= 0 && !f.air && d < 150) {
        f.ai.t = cfg.react;
        if (Math.random() < 0.55 + cfg.aggr * 0.3) {
            f.ai.turtle = 0;
            if (f.c.specials.qcb === 'grab' && d < 58) { startMove(f, 'grab'); return; }
            if (d < 46 && Math.random() < 0.4) { startMove(f, 'clk'); return; }   // 近身改掃腿逼對手蹲
            f.air = true; f.vy = JUMP_V; f.vx = f.c.jump * f.face;
            f.state = 'jump'; f.ai.intent = 'divekick';
            RetroAudio.play('jump');
            return;
        }
    }

    if (f.ai.t <= 0) {
        f.ai.t = cfg.react;
        var r = Math.random();
        if (d > 150) {
            f.ai.intent = r < cfg.aggr + 0.25 ? 'approach' : (r < 0.9 ? 'wait' : 'jump');
            if (r > 0.94 && cfg.spRate > 0.2) f.ai.intent = 'special';
        } else if (d > 78) {
            f.ai.intent = r < cfg.aggr ? 'approach' : (r < cfg.aggr + 0.18 ? 'special' : (r < cfg.aggr + 0.3 ? 'jump' : 'wait'));
        } else {
            if (r < cfg.aggr) f.ai.intent = 'attack';
            else if (r < cfg.aggr + 0.22) f.ai.intent = 'block';
            else if (r < cfg.aggr + 0.34) f.ai.intent = 'retreat';
            else f.ai.intent = 'wait';
        }
        f.ai.intentT = cfg.react * 1.2;
    }

    if (f.ai.intentT <= 0) f.ai.intent = 'wait';

    // 執行意圖。
    // 地面意圖一律不在空中執行——否則 default 分支會把跳躍的水平速度歸零，
    // AI 會在半空中停下來直直落回原地。
    f.holdBack = false;
    f.crouching = false;
    var sp = f.c.specials;
    if (f.air) { aiAirAttack(f, d); return; }
    switch (f.ai.intent) {
        case 'approach':
            f.state = 'walk'; f.vx = f.c.speed * f.face;
            if (d < 70 && Math.random() < 0.4) { f.ai.intent = 'attack'; }
            break;
        case 'retreat':
            f.state = 'walk'; f.vx = -f.c.speed * 0.8 * f.face;
            f.holdBack = true;
            break;
        case 'block':
            f.state = 'idle'; f.vx = 0; f.holdBack = true;
            f.crouching = !!f.ai.crouchBlock;
            break;
        case 'jump':
            if (!f.air) {
                f.air = true; f.vy = JUMP_V; f.vx = f.c.jump * f.face;
                f.state = 'jump'; RetroAudio.play('jump');
                f.ai.intent = 'wait';
            }
            break;
        case 'special':
            if (!f.air) {
                startMove(f, Math.random() < 0.5 ? sp.qcf : (d < 70 ? sp.qcb : sp.qcf));
                f.ai.intent = 'wait';
            }
            break;
        case 'attack':
            if (!f.air) {
                var rr = Math.random();
                if (rr < cfg.spRate) startMove(f, d < 60 ? sp.dp : sp.qcb);
                else if (rr < cfg.spRate + 0.28) startMove(f, 'clk');
                else if (rr < cfg.spRate + 0.6) startMove(f, Math.random() < 0.5 ? 'lp' : 'lk');
                else startMove(f, Math.random() < 0.5 ? 'hp' : 'hk');
                f.ai.intent = 'wait';
            }
            break;
        default:
            f.state = 'idle'; f.vx = 0;
            if (d < 60 && Math.random() < 0.02) f.holdBack = true;
    }

}

/**
 * 空中攻擊：下落段接近對手時出腳。
 * 跳到頭上卻不出招，等於白跳一次，還把自己送進對方的對空範圍。
 */
function aiAirAttack(f, d) {
    if (f.state === 'atk') return;
    if (f.vy > -160 && d < 96) {
        if (f.ai.intent === 'divekick' || Math.random() < 0.2) {
            startMove(f, Math.random() < 0.6 ? 'jk' : 'jp');
            f.ai.intent = 'wait';
        }
    }
}

/** AI 命中後嘗試取消連段 */
function aiCancel(f) {
    if (!f.ai || !f.canCancel || f.phase === 'startup') return;
    if (Math.random() > f.ai.cfg.comboRate) { f.canCancel = false; return; }
    var sp = f.c.specials;
    startMove(f, Math.random() < 0.5 ? 'hp' : sp.qcf);
}

// ======================================================================
// 角色物理與狀態推進
// ======================================================================
function stepFighter(f, foe, dt) {
    f.anim += dt;
    if (f.inv > 0) f.inv -= dt;
    if (f.flash > 0) f.flash -= dt;
    for (var i = 0; i < f.cmd.length; i++) f.cmd[i].t += dt;
    if (f.cancelT > 0) { f.cancelT -= dt; if (f.cancelT <= 0) f.canCancel = false; }

    f.st += dt;

    // 攻擊狀態機
    if (f.state === 'atk') {
        var m = f.move;
        if (f.phase === 'startup' && f.st >= m.startup) {
            f.phase = 'active'; f.st = 0;
            if (m.proj) spawnShot(f);
            if (m.shockwave) spawnWave(f);
        } else if (f.phase === 'active' && f.st >= m.active) {
            f.phase = 'recovery'; f.st = 0;
            if (f.ai) aiCancel(f);
            if (m.dash) f.vx *= 0.3;
        } else if (f.phase === 'recovery' && f.st >= m.rec) {
            f.state = f.air ? 'jump' : 'idle'; f.st = 0; f.move = null; f.canCancel = false;
        }
    } else if (f.state === 'hit') {
        f.hitstun -= dt;
        if (f.hitstun <= 0) { f.state = f.air ? 'jump' : 'idle'; f.st = 0; }
    } else if (f.state === 'block') {
        f.blockstun -= dt;
        if (f.blockstun <= 0) { f.state = 'idle'; f.st = 0; }
    } else if (f.state === 'down') {
        if (!f.air && f.st > 0.9 && f.hp > 0) { f.state = 'idle'; f.st = 0; f.inv = 0.4; }
    }

    // 物理
    if (f.air) {
        f.vy += GRAVITY * dt;
        f.y += f.vy * dt;
        if (f.y >= GY) {
            f.y = GY; f.vy = 0; f.air = false;
            if (f.state === 'jump' || (f.state === 'atk' && f.move && f.move.air)) {
                f.state = 'idle'; f.move = null; f.st = 0;
                RetroAudio.play('land');
                P.burst(f.x, GY, 5, { colors: ['#c9b18a', '#8a7358'], speedMin: 30, speedMax: 90, gravity: 300, lifeMin: 0.15, lifeMax: 0.3, sizeMin: 1.5, sizeMax: 3 });
            } else if (f.state === 'down') {
                f.st = 0;
                RE.juice.shake(0.2);
                P.burst(f.x, GY, 10, { colors: ['#c9b18a', '#8a7358'], speedMin: 40, speedMax: 150, gravity: 320, lifeMin: 0.2, lifeMax: 0.45, sizeMin: 2, sizeMax: 4 });
            }
        }
    }

    f.x += f.vx * dt;
    // 地面摩擦：被擊退與突進都會逐漸停下
    if (!f.air && (f.state === 'hit' || f.state === 'block' || f.state === 'down' ||
                   (f.state === 'atk' && f.move && f.move.dash))) {
        f.vx = RE.approach(f.vx, 0, 900 * dt);
    }

    // 舞台邊界
    var pad = 24;
    if (f.x < pad) { f.x = pad; if (f.vx < 0) f.vx = 0; }
    if (f.x > STAGE_W - pad) { f.x = STAGE_W - pad; if (f.vx > 0) f.vx = 0; }

    // 兩人互推，避免重疊
    var dx = foe.x - f.x;
    var minD = 30;
    if (Math.abs(dx) < minD && !f.air && !foe.air) {
        var push = (minD - Math.abs(dx)) / 2;
        var dir = dx >= 0 ? -1 : 1;
        f.x += push * dir;
        foe.x -= push * dir;
    }

    // 非攻擊狀態自動面向對手
    if (f.state !== 'atk' && f.state !== 'hit' && f.state !== 'down' && !f.air) {
        f.face = foe.x >= f.x ? 1 : -1;
    }
}

// ======================================================================
// 飛行道具與震波
// ======================================================================
function spawnShot(f) {
    s.shots.push({
        x: f.x + 26 * f.face, y: f.y - 44, vx: 300 * f.face, face: f.face,
        owner: f, t: 0, dmg: f.move.dmg, m: f.move, color: f.c.trim
    });
    RetroAudio.play('laser');
    RE.juice.shake(0.08);
}

function spawnWave(f) {
    s.waves.push({ x: f.x + 30 * f.face, y: GY, vx: 260 * f.face, owner: f, t: 0, m: f.move, hitDone: false });
    RE.juice.shake(0.35);
    RE.juice.hitstop(0.05);
    P.burst(f.x + 24 * f.face, GY, 14, {
        colors: ['#f0d060', '#c98a3a', '#8a6030'], speedMin: 60, speedMax: 220,
        gravity: 420, sizeMin: 2, sizeMax: 5, lifeMin: 0.25, lifeMax: 0.5
    });
}

function updateProjectiles(dt) {
    var i, sh, foe;
    for (i = s.shots.length - 1; i >= 0; i--) {
        sh = s.shots[i];
        sh.t += dt;
        sh.x += sh.vx * dt;
        if (sh.t > 0.06 && Math.random() < 0.5) {
            P.spawn({ x: sh.x, y: sh.y, vx: -sh.vx * 0.1, vy: RE.rand(-20, 20), size: 4, sizeEnd: 0,
                      color: sh.color, life: 0.25, shape: 'circle', glow: true, gravity: 0 });
        }
        if (sh.x < -20 || sh.x > STAGE_W + 20 || sh.t > 4) { s.shots.splice(i, 1); continue; }
        foe = sh.owner === s.p ? s.e : s.p;
        var hb = hurtbox(foe);
        if (foe.inv <= 0 && sh.x > hb.x && sh.x < hb.x + hb.w && sh.y > hb.y && sh.y < hb.y + hb.h) {
            applyHit(sh.owner, foe, sh.m, sh.x);
            P.ring(sh.x, sh.y, sh.color, 40);
            s.shots.splice(i, 1);
        }
    }

    for (i = s.waves.length - 1; i >= 0; i--) {
        var w = s.waves[i];
        w.t += dt;
        w.x += w.vx * dt;
        P.spawn({ x: w.x, y: GY - RE.rand(0, 14), vx: RE.rand(-30, 30), vy: RE.rand(-120, -40),
                  size: RE.rand(2, 5), sizeEnd: 0, color: '#d8a850', life: 0.3, gravity: 300 });
        if (w.x < -20 || w.x > STAGE_W + 20 || w.t > 2) { s.waves.splice(i, 1); continue; }
        foe = w.owner === s.p ? s.e : s.p;
        if (!w.hitDone && foe.inv <= 0 && !foe.air && Math.abs(foe.x - w.x) < 24) {
            applyHit(w.owner, foe, w.m, w.x);
            w.hitDone = true;
            s.waves.splice(i, 1);
        }
    }
}

// ======================================================================
// 主更新
// ======================================================================
function update(dt) {
    P.update(dt); FT.update(dt);
    if (s.comboT > 0) { s.comboT -= dt; if (s.comboT <= 0) s.combo = 0; }
    if (s.bannerT > 0) s.bannerT -= dt;

    if (s.phase === 'select') { updateSelect(dt); return; }
    if (!s.p || !s.e) return;

    s.phaseT += dt;

    if (s.phase === 'ready') {
        // 開場靜止 1.2 秒：READY → FIGHT
        stepIdleAnim(dt);
        if (s.phaseT > 1.2) {
            s.phase = 'fight'; s.phaseT = 0;
            s.banner = 'FIGHT!'; s.bannerT = 0.9;
            RetroAudio.play('levelUp');
        }
        updateCam();
        return;
    }

    if (s.phase === 'fight') {
        s.time -= dt;
        updatePlayer(s.p, dt);
        updateAI(s.e, s.p, dt);
        stepFighter(s.p, s.e, dt);
        stepFighter(s.e, s.p, dt);
        checkHits();
        updateProjectiles(dt);
        updateCam();

        if (s.p.hp <= 0 || s.e.hp <= 0 || s.time <= 0) endRound();
        return;
    }

    if (s.phase === 'roundEnd') {
        stepFighter(s.p, s.e, dt);
        stepFighter(s.e, s.p, dt);
        updateProjectiles(dt);
        updateCam();
        if (s.phaseT > 2.2) resolveRound();
        return;
    }
}

function stepIdleAnim(dt) {
    s.p.anim += dt; s.e.anim += dt;
}

function updateCam() {
    var mid = (s.p.x + s.e.x) / 2;
    s.camX = RE.clamp(mid - VW / 2, 0, STAGE_W - VW);
}

function checkHits() {
    var pairs = [[s.p, s.e], [s.e, s.p]];
    for (var i = 0; i < 2; i++) {
        var att = pairs[i][0], def = pairs[i][1];
        var hb = hitbox(att);
        if (!hb) continue;
        if (def.inv > 0) continue;
        if (RE.aabb(hb, hurtbox(def))) {
            att.hitDone = true;
            applyHit(att, def, att.move, hb.x + (att.face > 0 ? hb.w : 0));
        }
    }
}

function endRound() {
    s.phase = 'roundEnd'; s.phaseT = 0;
    var pWin;
    if (s.p.hp <= 0 && s.e.hp <= 0) pWin = null;
    else if (s.e.hp <= 0) pWin = true;
    else if (s.p.hp <= 0) pWin = false;
    else pWin = s.p.hp > s.e.hp ? true : (s.p.hp < s.e.hp ? false : null);

    s.roundWin = pWin;
    if (pWin === true) {
        s.winP++;
        s.banner = s.p.hp >= s.p.maxHp ? 'PERFECT!' : 'K.O.';
        if (s.p.hp >= s.p.maxHp) addScore(500);
        addScore(s.p.hp * 8);
        s.e.state = 'down'; s.e.air = true; s.e.vy = -260; s.e.vx = -160 * s.p.face;
        RE.juice.slowmo(0.25, 1.0);
        RE.juice.flash('rgba(255,255,255,0.6)', 0.12);
        RE.juice.shake(0.6);
        RetroAudio.play('bigExplosion');
    } else if (pWin === false) {
        s.winE++;
        s.banner = 'K.O.';
        s.p.state = 'down'; s.p.air = true; s.p.vy = -260; s.p.vx = -160 * s.e.face;
        RE.juice.slowmo(0.3, 1.0);
        RE.juice.shake(0.5);
        RetroAudio.play('explosion');
    } else {
        s.banner = 'DRAW';
        RetroAudio.play('error');
    }
    s.bannerT = 2.2;
}

function resolveRound() {
    if (s.winP >= WIN_ROUNDS) { winStage(); return; }
    if (s.winE >= WIN_ROUNDS) { loseStage(); return; }
    s.round++;
    if (s.round > 3) {
        // 三回合打完仍未分勝負：以總勝場判定
        if (s.winP > s.winE) winStage(); else loseStage();
        return;
    }
    startRound();
}

function winStage() {
    addScore(1200 + Math.round(s.time) * 20);
    s.p.state = 'win';
    if (s.stage >= OPPONENTS.length - 1) {
        G.gameOver({
            win: true,
            body: '五名對手全部倒下。你不是靠按得比較快贏的——' +
                  '你贏在知道什麼時候該站在哪裡。最高連段 ' + s.maxCombo + ' 段。'
        });
        return;
    }
    var next = s.stage + 1;
    var op = OPPONENTS[next];
    G.stageCard(next + 1, op.name + '　' + op.subtitle, op.hint, function () { startStage(next); });
}

function loseStage() {
    G.setLives(G.lives - 1);
    if (G.lives <= 0) {
        G.gameOver({
            win: false,
            body: '在第 ' + (s.stage + 1) + ' 戰倒下。' +
                  '回想一下：你是被打中的，還是自己走進對方的射程？最高連段 ' + s.maxCombo + ' 段。'
        });
        return;
    }
    var op = OPPONENTS[s.stage];
    G.stageCard(s.stage + 1, '再戰 · ' + op.name, '續關。這次先看清楚他的收招時間。', function () {
        var i = s.stage; startStage(i);
    });
}

// ======================================================================
// 選角畫面
// ======================================================================
function updateSelect(dt) {
    if (RE.Input.pressed('left')) { s.sel = (s.sel + CHARS.length - 1) % CHARS.length; RetroAudio.play('select'); }
    if (RE.Input.pressed('right')) { s.sel = (s.sel + 1) % CHARS.length; RetroAudio.play('select'); }
    if (RE.Input.pressed('a') || RE.Input.pressed('b') || RE.Input.pressed('start')) {
        RetroAudio.play('confirm');
        var op = OPPONENTS[0];
        G.stageCard(1, op.name + '　' + op.subtitle, op.hint, function () { startStage(0); });
    }
}

// ======================================================================
// 繪圖
// ======================================================================
function currentPose(f) {
    var t;
    if (f.state === 'down') return POSE.down;
    if (f.state === 'win') return POSE.win;
    if (f.state === 'hit') return f.crouching ? POSE.hitLow : POSE.hit;
    if (f.state === 'block') return f.crouching ? POSE.blockLow : POSE.block;
    if (f.state === 'atk' && f.move) {
        var mp = MOVE_POSE[f.mk] || ['lpS', 'lpA'];
        var a = POSE[mp[0]], b = POSE[mp[1]];
        if (f.phase === 'startup') {
            t = RE.clamp(f.st / Math.max(0.01, f.move.startup), 0, 1);
            return lerpPose(f.air ? POSE.jump : POSE.idle, a, t);
        }
        if (f.phase === 'active') {
            t = RE.clamp(f.st / 0.05, 0, 1);
            return lerpPose(a, b, t);
        }
        t = RE.clamp(f.st / Math.max(0.01, f.move.rec), 0, 1);
        return lerpPose(b, f.crouching ? POSE.crouch : (f.air ? POSE.jump : POSE.idle), RE.ease.outQuad(t));
    }
    if (f.air) return POSE.jump;
    if (f.crouching || f.state === 'crouch') return POSE.crouch;
    if (f.state === 'walk') {
        var fwd = (f.vx * f.face) > 0;
        t = (Math.sin(f.anim * 9) + 1) / 2;
        return lerpPose(POSE.idle, fwd ? POSE.walkF : POSE.walkB, t);
    }
    t = (Math.sin(f.anim * 3.4) + 1) / 2;
    return lerpPose(POSE.idle, POSE.idle2, t);
}

function limb(x1, y1, x2, y2, w, color) {
    ctx.strokeStyle = color;
    ctx.lineWidth = w;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();
}

function drawFighter(f, isPlayer) {
    var po = currentPose(f);
    var c = f.c;
    var fx = f.face;
    function px(p) { return f.x + p[0] * fx; }
    function py(p) { return f.y + p[1]; }

    ctx.save();
    if (f.flash > 0 && Math.floor(f.flash * 40) % 2 === 0) ctx.globalAlpha = 0.85;
    if (f.inv > 0 && f.state !== 'atk' && Math.floor(f.inv * 20) % 2 === 0) ctx.globalAlpha = 0.55;

    // 影子
    ctx.fillStyle = 'rgba(0,0,0,0.32)';
    ctx.beginPath();
    var shy = GY + 2, sw = 20 * RE.clamp(1 - (GY - f.y) / 200, 0.35, 1);
    ctx.ellipse(f.x, shy, sw, 4.5, 0, 0, RE.TAU);
    ctx.fill();

    var dark = shade(c.gi, -0.34);
    // 後側肢體（暗一階，做出前後層次）
    limb(px(po.hip), py(po.hip), px(po.bk), py(po.bk), 9, dark);
    limb(px(po.bk), py(po.bk), px(po.bf), py(po.bf), 7.5, dark);
    limb(px(po.sh), py(po.sh), px(po.be), py(po.be), 7, shade(c.skin, -0.3));
    limb(px(po.be), py(po.be), px(po.bh), py(po.bh), 6, shade(c.skin, -0.3));

    // 軀幹
    ctx.strokeStyle = c.gi;
    ctx.lineWidth = 17;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(px(po.sh), py(po.sh));
    ctx.lineTo(px(po.hip), py(po.hip));
    ctx.stroke();
    // 腰帶
    limb(px(po.hip), py(po.hip) - 1, px(po.hip) + 1 * fx, py(po.hip) + 1, 6, c.trim);

    // 前腿
    limb(px(po.hip), py(po.hip), px(po.fk), py(po.fk), 9.5, c.gi);
    limb(px(po.fk), py(po.fk), px(po.ff), py(po.ff), 8, c.gi);
    ctx.fillStyle = shade(c.gi, -0.5);
    ctx.beginPath(); ctx.arc(px(po.ff), py(po.ff), 4.6, 0, RE.TAU); ctx.fill();

    // 前臂
    limb(px(po.sh), py(po.sh), px(po.fe), py(po.fe), 7.5, c.skin);
    limb(px(po.fe), py(po.fe), px(po.fh), py(po.fh), 6.5, c.skin);
    // 拳套／腳的判定端點在攻擊時發光，讓玩家看得見「哪裡有判定」
    var glow = (f.state === 'atk' && f.phase === 'active');
    ctx.fillStyle = glow ? '#fff0aa' : c.trim;
    if (glow) { ctx.shadowBlur = 10; ctx.shadowColor = '#ffd166'; }
    ctx.beginPath(); ctx.arc(px(po.fh), py(po.fh), 5.2, 0, RE.TAU); ctx.fill();
    if (glow && f.move && !f.move.crouch) {
        ctx.beginPath(); ctx.arc(px(po.ff), py(po.ff), 5.6, 0, RE.TAU); ctx.fill();
    }
    ctx.shadowBlur = 0;

    // 頭
    var hx = px(po.h), hy = py(po.h);
    ctx.fillStyle = c.skin;
    ctx.beginPath(); ctx.arc(hx, hy, 8.4, 0, RE.TAU); ctx.fill();
    // 頭髮
    ctx.fillStyle = c.hair;
    ctx.beginPath();
    ctx.arc(hx, hy - 1.6, 8.4, Math.PI * (fx > 0 ? 0.95 : 0.05), Math.PI * (fx > 0 ? 2.1 : 1.2), fx < 0);
    ctx.fill();
    // 頭帶
    ctx.strokeStyle = c.band; ctx.lineWidth = 2.6;
    ctx.beginPath(); ctx.arc(hx, hy - 1, 8.4, Math.PI * 0.86, Math.PI * 2.14); ctx.stroke();
    ctx.fillStyle = c.band;
    ctx.fillRect(hx - (fx > 0 ? 13 : 4), hy - 5, 9, 2.4);
    // 眼睛（朝向面向）
    ctx.fillStyle = '#20140c';
    ctx.fillRect(hx + (fx > 0 ? 2.5 : -5.5), hy - 1, 3, 2.2);

    // 玩家標記
    if (isPlayer) {
        ctx.fillStyle = '#70e4b5';
        ctx.beginPath();
        var ay = f.y - 86;
        ctx.moveTo(f.x, ay + 8); ctx.lineTo(f.x - 5, ay); ctx.lineTo(f.x + 5, ay);
        ctx.fill();
    }
    ctx.restore();
}

function shade(hex, amt) {
    var n = parseInt(hex.slice(1), 16);
    var r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    if (amt < 0) { r *= (1 + amt); g *= (1 + amt); b *= (1 + amt); }
    else { r += (255 - r) * amt; g += (255 - g) * amt; b += (255 - b) * amt; }
    return 'rgb(' + Math.round(r) + ',' + Math.round(g) + ',' + Math.round(b) + ')';
}

function drawStage() {
    var st = (OPPONENTS[s.stage] || OPPONENTS[0]).stage;
    // 天空
    var g = ctx.createLinearGradient(0, 0, 0, GY);
    g.addColorStop(0, st.sky[0]);
    g.addColorStop(1, st.sky[1]);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, VW, VH);

    ctx.save();
    // 遠景（視差 0.25）
    ctx.translate(-s.camX * 0.25, 0);
    ctx.fillStyle = st.far;
    for (var i = 0; i < 14; i++) {
        var bw = 46 + (i * 37 % 40), bh = 60 + (i * 53 % 90);
        ctx.fillRect(i * 78 - 40, GY - bh, bw, bh);
    }
    ctx.restore();

    ctx.save();
    // 近景（視差 0.55）
    ctx.translate(-s.camX * 0.55, 0);
    ctx.fillStyle = st.near;
    for (var j = 0; j < 12; j++) {
        var w2 = 70 + (j * 29 % 50), h2 = 34 + (j * 41 % 46);
        ctx.fillRect(j * 96 - 30, GY - h2, w2, h2);
        ctx.fillStyle = st.accent;
        ctx.globalAlpha = 0.5;
        ctx.fillRect(j * 96 - 22, GY - h2 + 8, 6, 6);
        ctx.globalAlpha = 1;
        ctx.fillStyle = st.near;
    }
    ctx.restore();

    // 地板
    ctx.save();
    ctx.translate(-s.camX, 0);
    ctx.fillStyle = st.floor;
    ctx.fillRect(0, GY, STAGE_W, VH - GY);
    ctx.fillStyle = shade(st.floor, -0.3);
    for (var k = 0; k < STAGE_W / 32; k++) {
        ctx.fillRect(k * 32, GY, 2, VH - GY);
    }
    ctx.fillStyle = shade(st.floor, 0.25);
    ctx.fillRect(0, GY, STAGE_W, 2);
    ctx.restore();
}

function drawShots() {
    var i, sh;
    for (i = 0; i < s.shots.length; i++) {
        sh = s.shots[i];
        ctx.save();
        ctx.shadowBlur = 14; ctx.shadowColor = sh.color;
        ctx.fillStyle = sh.color;
        ctx.beginPath();
        ctx.ellipse(sh.x, sh.y, 13 + Math.sin(sh.t * 30) * 2, 9, 0, 0, RE.TAU);
        ctx.fill();
        ctx.fillStyle = '#fff8e7';
        ctx.beginPath();
        ctx.ellipse(sh.x - sh.face * 2, sh.y, 6, 4.5, 0, 0, RE.TAU);
        ctx.fill();
        ctx.restore();
    }
    for (i = 0; i < s.waves.length; i++) {
        var w = s.waves[i];
        ctx.save();
        ctx.strokeStyle = '#f0d060';
        ctx.lineWidth = 3;
        ctx.globalAlpha = 0.85;
        ctx.beginPath();
        ctx.moveTo(w.x - 16, GY);
        ctx.lineTo(w.x, GY - 26 - Math.sin(w.t * 20) * 4);
        ctx.lineTo(w.x + 16, GY);
        ctx.stroke();
        ctx.restore();
    }
}

function bar(x, y, w, h, pct, color, right) {
    ctx.fillStyle = '#2a1a10';
    ctx.fillRect(x - 2, y - 2, w + 4, h + 4);
    ctx.fillStyle = '#4a1f14';
    ctx.fillRect(x, y, w, h);
    var bw = Math.max(0, w * pct);
    var g = ctx.createLinearGradient(0, y, 0, y + h);
    g.addColorStop(0, shade(color, 0.35));
    g.addColorStop(1, color);
    ctx.fillStyle = g;
    ctx.fillRect(right ? x + w - bw : x, y, bw, h);
    ctx.strokeStyle = 'rgba(255,248,231,0.35)';
    ctx.lineWidth = 1;
    ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
}

function drawHUD() {
    if (!s.p || !s.e) return;
    var op = OPPONENTS[s.stage];
    bar(16, 16, 190, 13, s.p.hp / s.p.maxHp, s.p.hp / s.p.maxHp < 0.28 ? '#e0453e' : '#70e4b5', false);
    bar(VW - 206, 16, 190, 13, s.e.hp / s.e.maxHp, s.e.hp / s.e.maxHp < 0.28 ? '#e0453e' : '#e8a33e', true);

    RE.Draw.text(ctx, s.p.c.name, 16, 33, { size: 14, color: '#fff8e7' });
    RE.Draw.text(ctx, s.e.c.name + (op.charIndex < 0 ? '（影）' : ''), VW - 16, 33, { size: 14, color: '#fff8e7', align: 'right' });

    // 回合勝點
    var i;
    for (i = 0; i < WIN_ROUNDS; i++) {
        ctx.fillStyle = i < s.winP ? '#ffd166' : 'rgba(255,248,231,0.22)';
        ctx.beginPath(); ctx.arc(24 + i * 14, 43, 4.5, 0, RE.TAU); ctx.fill();
        ctx.fillStyle = i < s.winE ? '#ffd166' : 'rgba(255,248,231,0.22)';
        ctx.beginPath(); ctx.arc(VW - 24 - i * 14, 43, 4.5, 0, RE.TAU); ctx.fill();
    }

    // 計時器
    var t = Math.max(0, Math.ceil(s.time));
    RE.Draw.text(ctx, t < 10 ? '0' + t : String(t), VW / 2, 14,
        { size: 26, align: 'center', color: t <= 10 ? '#ff6b6b' : '#fff8e7', strokeWidth: 5 });

    // 連段顯示
    if (s.combo >= 2 && s.comboT > 0) {
        RE.Draw.text(ctx, s.combo + ' HIT COMBO', 16, 56, { size: 14, color: '#ffd166' });
        RE.Draw.text(ctx, s.comboDmg + ' DMG', 16, 74, { size: 14, color: '#ffb066' });
    }

    // 大字報
    if (s.bannerT > 0 && s.banner) {
        var a = RE.clamp(s.bannerT / 0.5, 0, 1);
        ctx.save();
        ctx.globalAlpha = a;
        var sc = s.bannerT > 1.9 ? RE.ease.outBack(RE.clamp((2.2 - s.bannerT) / 0.3, 0, 1)) : 1;
        ctx.translate(VW / 2, VH / 2 - 26);
        ctx.scale(sc, sc);
        RE.Draw.text(ctx, s.banner, 0, 0, { size: 38, align: 'center', baseline: 'middle', color: '#ffd166', strokeWidth: 7 });
        ctx.restore();
    }

    // 指令提示（前兩關才顯示，之後讓玩家自己記）
    if (s.stage < 2 && s.phase === 'fight') {
        ctx.save();
        ctx.globalAlpha = 0.55;
        RE.Draw.text(ctx, '↓→+拳 氣功　→↓→+拳 昇龍　↓←+腳 突進', VW / 2, VH - 16,
            { size: 14, align: 'center', color: '#cfe6dc', strokeWidth: 3 });
        ctx.restore();
    }
}

function drawSelect() {
    ctx.fillStyle = '#0d1512';
    ctx.fillRect(0, 0, VW, VH);
    // 背景斜紋
    ctx.save();
    ctx.globalAlpha = 0.14;
    ctx.strokeStyle = '#70e4b5';
    ctx.lineWidth = 8;
    for (var i = -8; i < 20; i++) {
        ctx.beginPath();
        ctx.moveTo(i * 34, 0); ctx.lineTo(i * 34 + 90, VH);
        ctx.stroke();
    }
    ctx.restore();

    RE.Draw.text(ctx, '選擇你的拳', VW / 2, 16, { size: 20, align: 'center', color: '#ffd166' });
    RE.Draw.text(ctx, '← → 選擇　拳／腳 確認', VW / 2, 42, { size: 14, align: 'center', color: '#cfe6dc' });

    var slotW = 108, x0 = (VW - slotW * CHARS.length) / 2;
    for (var j = 0; j < CHARS.length; j++) {
        var c = CHARS[j], sx = x0 + j * slotW, on = (j === s.sel);
        ctx.save();
        ctx.fillStyle = on ? 'rgba(255,209,102,0.16)' : 'rgba(255,255,255,0.05)';
        RE.Draw.roundRect(ctx, sx + 4, 60, slotW - 8, 180, 8);
        ctx.fill();
        if (on) {
            ctx.strokeStyle = '#ffd166'; ctx.lineWidth = 2;
            RE.Draw.roundRect(ctx, sx + 4, 60, slotW - 8, 180, 8);
            ctx.stroke();
        }
        ctx.restore();

        // 以真正的角色繪圖畫縮圖，選角看到的就是打起來的樣子
        var ghost = {
            c: c, x: sx + slotW / 2, y: 156, face: 1, state: on ? 'idle' : 'idle',
            anim: performance.now() / 1000 + j, crouching: false, air: false,
            flash: 0, inv: 0, move: null, phase: '', vx: 0
        };
        drawFighter(ghost, false);

        RE.Draw.text(ctx, c.name, sx + slotW / 2, 166, { size: 17, align: 'center', color: on ? '#ffd166' : '#fff8e7' });
        var titleParts = c.title.split('·');
        RE.Draw.text(ctx, titleParts[0].trim(), sx + slotW / 2, 186, { size: 14, align: 'center', color: '#9fb8ac' });
        RE.Draw.text(ctx, titleParts[1].trim(), sx + slotW / 2, 203, { size: 14, align: 'center', color: '#9fb8ac' });

        // 14px 手機可讀字級放不進原本 11px 行距，改成三格橫排小條。
        var stats = [['力', c.dmg / 1.4], ['速', c.speed / 160], ['距', c.reach / 1.2]];
        for (var k = 0; k < 3; k++) {
            var statX = sx + 18 + k * 34;
            RE.Draw.text(ctx, stats[k][0], statX, 217, { size: 14, align: 'center', color: '#9fb8ac', strokeWidth: 3 });
            ctx.fillStyle = 'rgba(255,255,255,0.12)';
            ctx.fillRect(statX - 12, 231, 24, 5);
            ctx.fillStyle = on ? '#ffd166' : '#5f9e86';
            ctx.fillRect(statX - 12, 231, 24 * RE.clamp(stats[k][1], 0.1, 1), 5);
        }
    }

    var note = CHARS[s.sel].note;
    RE.Draw.text(ctx, note.slice(0, 22), VW / 2, 250,
        { size: 14, align: 'center', color: '#cfe6dc', strokeWidth: 3 });
    RE.Draw.text(ctx, note.slice(22), VW / 2, 268,
        { size: 14, align: 'center', color: '#cfe6dc', strokeWidth: 3 });
}

function render() {
    if (!s) return;
    if (s.phase === 'select') {
        drawSelect();
        G.postFX({ scanAlpha: 0.10, vignetteStrength: 0.45 });
        return;
    }
    if (!s.p || !s.e) { G.clear('#0d1512'); return; }

    G.beginWorld();
    drawStage();

    ctx.save();
    ctx.translate(-s.camX, 0);
    // 後方角色先畫，前方（血較少的那位不影響）以 x 排序保持遮擋正確
    if (s.p.x <= s.e.x) { drawFighter(s.e, false); drawFighter(s.p, true); }
    else { drawFighter(s.p, true); drawFighter(s.e, false); }
    drawShots();
    P.draw(ctx);
    FT.draw(ctx);
    ctx.restore();

    G.endWorld();

    drawHUD();
    G.postFX({ scanAlpha: 0.09, vignetteStrength: 0.42 });
}

// ======================================================================
G.on('restart', function () { reset(); });
reset();
G.run(update, render);
G.showTitle({
    body: '方向鍵走位；A／B 攻防連段。三回合兩勝。',
    onStart: function () { reset(); }
});
</script>
</body>
