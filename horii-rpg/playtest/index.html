<style>
/* 灰盒試玩：左邊是遊戲畫面（canvas），右邊是隊伍與旗標；對話與戰鬥用 RPG 指令視窗。單一深色世界，刻意不跟系統主題 */
:root{--bg:#0b0f1c;--panel:#141b2e;--ink:#eef1fa;--muted:#9aa5c3;--line:#2b3656;--gold:#e8c66a;--hp:#6fd08c;--mp:#7fb0ff;--bad:#ff7a7a;
  --f:"DotGothic16","Noto Sans TC",monospace;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.6;margin:0}
.wrap{max-width:1100px;margin:0 auto;padding-inline:16px;padding-block:18px 40px;display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:16px}
header{grid-column:1/-1;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:6px 16px}
h1{margin:0;font-size:1.4rem;font-weight:400}
.tag{font-size:.78rem;color:var(--gold);border:1px solid var(--gold);border-radius:4px;padding:1px 8px}
.stage{position:relative;min-width:0}
canvas{width:100%;height:auto;display:block;background:#05070d;border-radius:8px;image-rendering:pixelated;outline:3px double var(--ink);outline-offset:-6px}
.win{position:absolute;left:3%;right:3%;bottom:4%;background:rgba(5,8,18,.94);border:2px solid var(--ink);outline:2px solid #05070d;border-radius:8px;padding:12px 16px;min-height:96px}
.win .who{color:var(--gold);font-size:.85rem;margin-bottom:4px}
.win .txt{white-space:pre-wrap;font-size:1.05rem}
.win .hint{position:absolute;right:12px;bottom:6px;font-size:.75rem;color:var(--muted)}
.menu{display:flex;flex-direction:column;gap:2px;margin-top:6px}
.menu div{padding:2px 6px;border-radius:4px}
.menu div.on{background:#24304f}
.menu div.on::before{content:"▶ ";color:var(--gold)}
.menu div.off{color:#5c6687}
aside{display:flex;flex-direction:column;gap:12px;min-width:0}
.box{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.box h2{margin:0 0 6px;font-size:.85rem;color:var(--gold);font-weight:400;letter-spacing:.08em}
.mem{display:grid;grid-template-columns:1fr auto;gap:2px 8px;font-size:.88rem;margin-bottom:6px}
.bar{grid-column:1/-1;height:5px;background:#26304a;border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%}
.flags{font-size:.78rem;color:var(--muted);display:grid;grid-template-columns:1fr auto;gap:0 8px;font-variant-numeric:tabular-nums}
.flags b{color:var(--ink);font-weight:400}
.log{font-size:.8rem;color:var(--muted);max-height:160px;overflow:auto}
.pad{display:none;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px);gap:6px;justify-content:center;margin-top:12px;user-select:none}
.pad button,.abtn{font:inherit;font-size:1.2rem;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:10px;touch-action:manipulation}
.abtn{width:72px;height:72px;border-radius:50%;font-size:1rem}
.ctrl{display:none;justify-content:center;align-items:center;gap:28px}
.keys{font-size:.78rem;color:var(--muted)}
@media (max-width:820px){.wrap{grid-template-columns:minmax(0,1fr)}.ctrl{display:flex}.pad{display:grid}}
@media (pointer:coarse){.ctrl{display:flex}.pad{display:grid}}
</style>
</head>

<script>
// rules.js — RPG 規則層參考實作（零 DOM 依賴、零外部依賴、可在 Node vm 裡直接跑）。
// 這一檔就是「規格 → 可執行」的橋：所有數學只在這裡算一次，畫面層只讀 state 不算數。
// 三引擎對齊的契約是 SPEC.formulas.*.tests 的黃金向量；Godot／Unity 手寫 C# 時拿同一組向量驗。
// 載入順序：spec.js → rules.js → 其他。全域腳本風格，可用 file:// 直接開，不需 build。
/* global SPEC */
const Rules = (() => {
  const FUNCS = { max: Math.max, min: Math.min, floor: Math.floor, ceil: Math.ceil, round: Math.round,
    clamp: (v, lo, hi) => Math.min(hi, Math.max(lo, v)) };

  // ---- 公式 ----
  const compiled = {};
  function formula(name, vars) {
    const f = SPEC.formulas[name];
    if (!f) throw new Error('未知公式 ' + name);
    if (!compiled[name]) {
      const names = f.inputs.concat(Object.keys(FUNCS));
      compiled[name] = new Function(...names, '"use strict"; return (' + f.expr + ');');
    }
    return compiled[name](...f.inputs.map((k) => vars[k]), ...Object.values(FUNCS));
  }

  // ---- 屬性 ----
  function elementMult(attackEl, defenseEl) {
    const a = attackEl || 'none', d = defenseEl || 'none';
    const pair = (SPEC.elements.pairs || []).find((p) => p.attack === a && p.defense === d);
    return pair ? pair.mult : 1;
  }

  // ---- 戰鬥單位 ----
  function makeCombatant(def, isPlayer, level) {
    const s = isPlayer ? def.base : def.stats;
    const lv = level || 1;
    const grow = (k) => (isPlayer && def.growth && def.growth[k] ? def.growth[k] * (lv - 1) : 0);
    const c = {
      id: def.id, name: def.name, isPlayer: !!isPlayer, isBoss: !!def.isBoss, level: lv, exp: 0,
      maxHp: s.maxHp + grow('maxHp'), atk: s.atk + grow('atk'), def: s.def + grow('def'),
      spd: s.spd + grow('spd'), luk: s.luk + grow('luk'), maxMp: (s.maxMp || 0) + grow('maxMp'),
      defending: false, statuses: {}, stacks: {},
      attackElement: def.attackElement || 'none', defenseElement: def.defenseElement || 'none',
      ai: def.ai || null, phases: def.phases || [], phaseDone: {}, atkBonusPercent: 0,
    };
    c.hp = c.maxHp; c.mp = c.maxMp;
    return c;
  }
  const isDead = (c) => c.hp <= 0;
  const effectiveAtk = (c) => Math.floor(c.atk * (1 + (c.atkBonusPercent || 0) / 100));

  // ---- 傷害：deterministic 版，rng 由呼叫端給（測試用向量、正式用 rollDamage） ----
  function damage(attacker, defender, opts) {
    const o = opts || {};
    if (o.dodged) return { dmg: 0, dodged: true, crit: false };
    const dmg = formula('damage', {
      atk: o.atk != null ? o.atk : effectiveAtk(attacker),
      def: o.def != null ? o.def : defender.def,
      defending: o.defending != null ? o.defending : !!defender.defending,
      variance: o.variance != null ? o.variance : 1,
      crit: !!o.crit,
      element: o.element != null ? o.element : elementMult(o.attackElement || attacker.attackElement, defender.defenseElement),
    });
    return { dmg, dodged: false, crit: !!o.crit };
  }
  function rollDamage(attacker, defender, rng, extra) {
    const r = rng || Math.random;
    const dodged = r() < formula('dodgeChance', { luk: defender.luk });
    if (dodged) return { dmg: 0, dodged: true, crit: false };
    const variance = 0.9 + r() * 0.2;
    const crit = r() < formula('critChance', { luk: attacker.luk });
    return damage(attacker, defender, Object.assign({ variance, crit }, extra || {}));
  }
  function applyDamage(target, dmg) { target.hp = Math.max(0, target.hp - dmg); return target.hp; }

  // ---- 回合順序：每輪重排，敵我混排依 SPD 降冪；或我方先敵方後 ----
  function turnOrder(party, enemies) {
    const alive = (list) => list.filter((c) => !isDead(c));
    if (SPEC.battle.turnOrder === 'partyThenEnemies') return alive(party).concat(alive(enemies));
    return alive(party).concat(alive(enemies)).sort((a, b) => b.spd - a.spd);
  }

  // ---- 狀態：回合開始結算，回傳 { skip, damage }。重置式與續行式不要混在同一函式（Godot 踩雷 32） ----
  // dot 的每回合傷害、buff/debuff 的量可由來源覆寫（override），規格裡 null 就代表「依來源」。
  function tickStatusAtTurnStart(c) {
    let skip = false, dmg = 0;
    for (const id of Object.keys(c.statuses)) {
      const st = SPEC.statusEffects.find((s) => s.id === id);
      const inst = c.statuses[id];
      if (!st) continue;
      if (st.kind === 'dot') { const d = inst.damagePerTurn || 0; dmg += d; applyDamage(c, d); }
      if (st.kind === 'skipTurn') skip = true;
      inst.turns -= 1;
      if (inst.turns <= 0) {
        if ((st.kind === 'buff' || st.kind === 'debuff') && inst.stat) c[inst.stat] -= inst.amount;  // 到期還原
        delete c.statuses[id];
      }
    }
    c.defending = false;
    return { skip, damage: dmg };
  }
  function addStatus(c, id, override) {
    const st = SPEC.statusEffects.find((s) => s.id === id);
    if (!st) throw new Error('未知狀態 ' + id);
    const o = override || {};
    if (st.kind === 'stack') {
      c.stacks[id] = (c.stacks[id] || 0) + (o.amount || 1);
      if (c.stacks[id] >= st.threshold) {
        const on = st.onThreshold;
        let extra = 0;
        if (on.type === 'damagePercentMaxHp') { extra = Math.floor(c.maxHp * on.value); applyDamage(c, extra); }
        if (on.resetStacks) c.stacks[id] = 0;
        return { triggered: true, extra };
      }
      return { triggered: false, extra: 0 };
    }
    const turns = o.turns != null ? o.turns : (st.turns != null ? st.turns : 1);
    if (st.kind === 'buff' || st.kind === 'debuff') {
      const stat = o.stat || st.stat, amount = o.amount != null ? o.amount : (st.amount || 0);
      const prev = c.statuses[id];
      if (prev && prev.stat) c[prev.stat] -= prev.amount;   // 同名狀態重疊：先還原再套新值（原版 armor_break 直接覆寫）
      c[stat] += amount;
      c.statuses[id] = { turns: prev ? Math.max(prev.turns, turns) : turns, stat, amount };
      return { triggered: false, extra: 0 };
    }
    c.statuses[id] = { turns, damagePerTurn: o.damagePerTurn != null ? o.damagePerTurn : st.damagePerTurn };
    return { triggered: false, extra: 0 };
  }
  function checkBossPhase(c) {
    for (let i = 0; i < c.phases.length; i++) {
      const p = c.phases[i];
      if (c.phaseDone[i]) continue;
      if (c.hp * 100 <= c.maxHp * p.atHpPercent) {
        c.phaseDone[i] = true;
        c.atkBonusPercent += p.atkBonusPercent || 0;
        return p;
      }
    }
    return null;
  }

  // ---- 地圖 ----
  function parseMap(map) {
    const ground = map.layers.find((l) => l.name === 'ground');
    const w = map.size.w, h = map.size.h;
    const solid = new Array(w * h).fill(false);
    const tiles = new Array(w * h).fill(null);
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const ch = ground.rows[y][x];
      const cell = map.legend[ch];
      solid[y * w + x] = !!(cell && cell.solid);
      tiles[y * w + x] = cell ? cell.tile : null;
    }
    return { id: map.id, w, h, solid, tiles, cellSize: SPEC.meta.cellSize };
  }
  const isWalkable = (pm, x, y) => x >= 0 && y >= 0 && x < pm.w && y < pm.h && !pm.solid[y * pm.w + x];
  const inArea = (a, x, y) => x >= a.x && x < a.x + a.w && y >= a.y && y < a.y + a.h;
  function findAt(map, x, y) {
    return {
      exit: (map.exits || []).find((e) => e.x === x && e.y === y) || null,
      npc: (map.npcs || []).find((n) => n.x === x && n.y === y) || null,
      chest: (map.chests || []).find((c) => c.x === x && c.y === y) || null,
      encounter: (map.encounters || []).find((z) => inArea(z.area, x, y)) || null,
      battle: (map.battles || []).find((b) => inArea(b.area, x, y)) || null,   // 一次性固定戰鬥／Boss
    };
  }
  function pickEncounterGroup(zone, rng) {
    const roll = (rng || Math.random)() * 100;
    let acc = 0;
    for (const g of zone.groups) { acc += g.weight; if (roll < acc) return g; }
    return zone.groups[zone.groups.length - 1];
  }

  // ---- 旗標與條件 ----
  function newFlags() {
    const f = {};
    for (const d of SPEC.flags) f[d.id] = d.initial;
    return f;
  }
  // 條件：requireFlag / requireFlags[] 全真、notFlag 為假、MainStage 介於 minStage..maxStage
  function conditionOk(cond, flags) {
    if (!cond) return true;
    if (cond.requireFlag && !flags[cond.requireFlag]) return false;
    for (const f of cond.requireFlags || []) if (!flags[f]) return false;
    if (cond.notFlag && flags[cond.notFlag]) return false;
    const stage = flags.MainStage || 0;
    if (cond.minStage != null && stage < cond.minStage) return false;
    if (cond.maxStage != null && stage > cond.maxStage) return false;
    return true;
  }
  // NPC 的 dialogue 可以是字串或候選陣列：依序取第一個條件成立的
  function pickDialogue(dialogueRef, flags) {
    const ids = Array.isArray(dialogueRef) ? dialogueRef : [dialogueRef];
    for (const id of ids) {
      const d = SPEC.dialogues.find((x) => x.id === id);
      if (d && conditionOk(d.condition, flags)) return d;
    }
    return null;
  }
  function exitBlocked(exit, flags) {
    if (exit.requireFlag && !flags[exit.requireFlag]) return exit.blockedHint || '';
    if (exit.minStage != null && (flags.MainStage || 0) < exit.minStage) return exit.blockedHint || '';
    return null;
  }

  // ---- 存檔：serialize 只挑 SPEC.save.fields；deserialize 用 Object.assign(blank) 補新欄位 ----
  function newGameState() {
    const party = SPEC.actors.filter((a) => a.inParty).map((a) => makeCombatant(a, true, 1));
    const equipment = {};
    for (const a of SPEC.actors) equipment[a.id] = Object.assign({}, a.startEquip || {});
    const first = SPEC.maps[0];
    return { v: SPEC.save.version, party, reserve: SPEC.actors.filter((a) => !a.inParty).map((a) => a.id),
      inventory: {}, equipment, gold: 0, flags: newFlags(), map: first.id,
      position: Object.assign({}, first.spawns[0]), playtime: 0 };
  }
  function serializeSave(state) {
    const out = { v: SPEC.save.version, savedAt: Date.now() };
    for (const k of SPEC.save.fields) out[k] = state[k];
    if (SPEC.save.fields.includes('party')) out.reserve = state.reserve;
    return JSON.stringify(out);
  }
  function deserializeSave(raw) {
    const d = JSON.parse(raw);
    if (!d || d.v !== SPEC.save.version) return null;   // 版本不符：交給呼叫端決定遷移或放棄
    const blank = newGameState();
    const state = Object.assign(blank, d);
    state.flags = Object.assign(newFlags(), d.flags || {});  // 舊存檔沒有的新旗標補預設
    return state;
  }
  function shouldAutosave(mode) { return !(SPEC.save.autosave.excludeWhen || []).includes(mode); }

  return { formula, elementMult, makeCombatant, isDead, effectiveAtk, damage, rollDamage, applyDamage, turnOrder,
    tickStatusAtTurnStart, addStatus, checkBossPhase, parseMap, isWalkable, findAt, pickEncounterGroup,
    newFlags, conditionOk, pickDialogue, exitBlocked, newGameState, serializeSave, deserializeSave, shouldAutosave };
})();

</script>
<script>
// ---- 遊戲狀態 ----
const cv = document.getElementById('cv'), g = cv.getContext('2d');
const $ = (id) => document.getElementById(id);
const S = { party: [], reserve: [], inv: {}, gold: 0, flags: Rules.newFlags(), map: null, pm: null, x: 0, y: 0, face: [0, 1],
  mode: 'walk', steps: 0, dlg: null, battle: null, over: false };
const mapById = (id) => SPEC.maps.find((m) => m.id === id);
const actorDef = (id) => SPEC.actors.find((a) => a.id === id);
const enemyDef = (id) => SPEC.enemies.find((e) => e.id === id);
const itemDef = (id) => SPEC.items.find((i) => i.id === id);
const skillDef = (id) => SPEC.skills.find((s) => s.id === id);
const speakerName = (id) => (SPEC.speakers.find((s) => s.id === id) || {}).name || '';
const rand = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
function log(t) { const el = $('log'); el.insertAdjacentHTML('afterbegin', `<div>${t.replace(/</g, '&lt;')}</div>`); }

function joinActor(id) {
  if (S.party.some((c) => c.id === id)) return;
  const c = Rules.makeCombatant(actorDef(id), true, S.party[0] ? S.party[0].level : 1);
  S.party.push(c); log(`${c.name} 加入隊伍`);
}
function atkWithEquip(c) {
  const eq = Object.values(actorDef(c.id).startEquip || {}).map(itemDef).filter(Boolean);
  return eq.reduce((s, it) => s + (it.atk || 0), 0) + (c.bonusAtk || 0);
}
function enterMap(id, spawnId) {
  const m = mapById(id); S.map = m; S.pm = Rules.parseMap(m);
  const sp = (m.spawns || []).find((s) => s.id === spawnId) || m.spawns[0];
  S.x = sp.x; S.y = sp.y; S.steps = 0;
  log(`來到「${m.name}」`);
  if (m.onEnter && m.onEnter.dialogue) startDialogue(SPEC.dialogues.find((d) => d.id === m.onEnter.dialogue));
}

// ---- 繪圖（灰盒） ----
const PALETTE = { wall: '#3a3f55', stone: '#5b5f6e', sea: '#1d3b66', gate: '#c9a24a', cliff: '#4a4034', sand: '#b8a57a', rock: '#57524a',
  path: '#c9a24a', cave_floor: '#3d3a42', cave_mouth: '#c9a24a', floor: '#6b6458', grass: '#4f7a45', tree: '#2f5130', water: '#1d3b66', door: '#c9a24a' };
const hashColor = (s) => { let h = 0; for (const ch of s) h = (h * 31 + ch.charCodeAt(0)) % 360; return `hsl(${h},25%,40%)`; };
function draw() {
  const m = S.map, pm = S.pm, cs = Math.floor(Math.min(cv.width / pm.w, cv.height / pm.h));
  const ox = Math.floor((cv.width - cs * pm.w) / 2), oy = Math.floor((cv.height - cs * pm.h) / 2);
  g.fillStyle = '#05070d'; g.fillRect(0, 0, cv.width, cv.height);
  for (let y = 0; y < pm.h; y++) for (let x = 0; x < pm.w; x++) {
    const t = pm.tiles[y * pm.w + x] || '';
    g.fillStyle = PALETTE[t] || hashColor(t); g.fillRect(ox + x * cs, oy + y * cs, cs, cs);
    g.strokeStyle = 'rgba(0,0,0,.18)'; g.strokeRect(ox + x * cs + .5, oy + y * cs + .5, cs - 1, cs - 1);
  }
  for (const z of m.encounters || []) { g.fillStyle = 'rgba(255,90,90,.07)'; g.fillRect(ox + z.area.x * cs, oy + z.area.y * cs, z.area.w * cs, z.area.h * cs); }
  for (const b of m.battles || []) if (!S.flags[b.flag]) { g.fillStyle = 'rgba(160,60,200,.22)'; g.fillRect(ox + b.area.x * cs, oy + b.area.y * cs, b.area.w * cs, b.area.h * cs); }
  const label = (x, y, txt, bg, fg) => {
    const cx = ox + x * cs + cs / 2, cy = oy + y * cs + cs / 2;
    g.fillStyle = bg; g.beginPath(); g.arc(cx, cy, cs * .42, 0, Math.PI * 2); g.fill();
    g.fillStyle = fg; g.font = `${Math.floor(cs * .5)}px DotGothic16, monospace`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(txt, cx, cy + 1);
  };
  for (const c of m.chests || []) {
    const open = S.flags[c.flag]; g.fillStyle = open ? '#555' : '#d9a441';
    g.fillRect(ox + c.x * cs + cs * .18, oy + c.y * cs + cs * .3, cs * .64, cs * .45);
  }
  for (const n of m.npcs || []) label(n.x, n.y, speakerName(n.speaker).slice(0, 1) || '?', '#e8e2d0', '#1a1a1a');
  label(S.x, S.y, (S.party[0] || { name: '我' }).name.slice(0, 1), '#e8c66a', '#1a1a1a');
}

// ---- 側欄 ----
function panel() {
  $('party').innerHTML = S.party.map((c) => `<div class="mem"><span>${c.name} Lv${c.level}</span><span>HP ${c.hp}/${c.maxHp}</span>
    <div class="bar"><i style="width:${100 * c.hp / c.maxHp}%;background:var(--hp)"></i></div>
    <span></span><span>MP ${c.mp}/${c.maxMp}</span></div>`).join('');
  $('gold').textContent = S.gold;
  $('flags').innerHTML = SPEC.flags.map((f) => `<span>${f.id}</span><b>${S.flags[f.id]}</b>`).join('');
}

// ---- 對話 ----
function startDialogue(d) {
  if (!d) return;
  S.mode = 'dialogue'; S.dlg = { d, node: d.nodes[0], line: 0, sel: 0 }; showLine();
}
function showLine() {
  const { node, line } = S.dlg; $('win').hidden = false;
  $('who').textContent = node.speaker ? speakerName(node.speaker) : '';
  $('txt').textContent = node.lines[line] || '';
  const last = line >= node.lines.length - 1;
  if (node.type === 'choice' && last) {
    $('menu').innerHTML = node.choices.map((c, i) => `<div class="${i === S.dlg.sel ? 'on' : ''}">${c.label}</div>`).join(''); $('hint').hidden = true;
  } else { $('menu').innerHTML = ''; $('hint').hidden = false; }
}
function applyEffects(h) {
  for (const [k, v] of Object.entries(h.setFlags || {})) S.flags[k] = v;
  for (const a of h.join || []) joinActor(a);
  for (const [it, n] of Object.entries(h.give || {})) { S.inv[it] = (S.inv[it] || 0) + n; log(`得到 ${itemDef(it).name} ×${n}`); }
  if (h.gold) { S.gold += h.gold; log(`得到 ${h.gold} 金幣`); }
  if (h.fullHeal) S.party.forEach((c) => { c.hp = c.maxHp; c.mp = c.maxMp; });
}
function dialogueNext() {
  const D = S.dlg, node = D.node;
  if (D.line < node.lines.length - 1) { D.line++; return showLine(); }
  let nextId = node.next, holder = node;
  if (node.type === 'choice') { holder = node.choices[D.sel]; nextId = holder.next; }
  applyEffects(node); if (holder !== node) applyEffects(holder);
  const after = node.battle || node.gotoMap || node.end ? node : null;
  if (nextId != null) { D.node = D.d.nodes.find((n) => n.id === nextId); D.line = 0; D.sel = 0; return showLine(); }
  closeDialogue();
  if (after && after.end) return ending();
  if (after && after.gotoMap) enterMap(after.gotoMap.map, after.gotoMap.spawn);
  if (after && after.battle) startBattle(after.battle.enemies, after.battle);
  if (S.pendingBattle) { const pb = S.pendingBattle; S.pendingBattle = null; startBattle(pb.enemies, pb); }
}
function closeDialogue() { $('win').hidden = true; S.dlg = null; if (S.mode === 'dialogue') S.mode = 'walk'; panel(); }
function message(lines, who) { startDialogue({ id: '_msg', nodes: [{ id: 'm', speaker: null, lines, next: null }] }); if (who) $('who').textContent = who; }

// ---- 移動與互動 ----
function tryMove(dx, dy) {
  S.face = [dx, dy];
  const nx = S.x + dx, ny = S.y + dy, m = S.map;
  const at = Rules.findAt(m, nx, ny);
  if (at.npc || (at.chest && !at.chest.walkOver)) return;
  if (!Rules.isWalkable(S.pm, nx, ny)) return;
  if (at.exit) {
    const blocked = Rules.exitBlocked(at.exit, S.flags);
    if (blocked != null) return message([blocked || '現在還不能過去。']);
    return enterMap(at.exit.targetMap, at.exit.targetSpawn);
  }
  S.x = nx; S.y = ny;
  const b = (m.battles || []).find((bt) => bt.area && nx >= bt.area.x && nx < bt.area.x + bt.area.w && ny >= bt.area.y && ny < bt.area.y + bt.area.h);
  if (b && !S.flags[b.flag] && Rules.conditionOk({ requireFlag: b.requireFlag }, S.flags)) {
    S.flags[b.flag] = true;
    if (b.introDialogue) { S.pendingBattle = b; return startDialogue(SPEC.dialogues.find((d) => d.id === b.introDialogue)); }
    return startBattle(b.enemies, b);
  }
  if (at.encounter) {
    if (S.steps <= 0) S.steps = rand(at.encounter.stepsMin, at.encounter.stepsMax);
    if (--S.steps <= 0) { const grp = Rules.pickEncounterGroup(at.encounter); startBattle(grp.enemies, { canEscape: at.encounter.canEscape }); }
  }
}
function interact() {
  const tx = S.x + S.face[0], ty = S.y + S.face[1], at = Rules.findAt(S.map, tx, ty);
  if (at.npc) return startDialogue(Rules.pickDialogue(at.npc.dialogue, S.flags));
  if (at.chest) {
    const c = at.chest;
    if (S.flags[c.flag]) return message(['空的。']);
    S.flags[c.flag] = true;
    const items = c.item ? { [c.item]: 1 } : (c.items || {});
    const got = Object.entries(items).map(([it, n]) => { S.inv[it] = (S.inv[it] || 0) + n; return `${itemDef(it).name}${n > 1 ? ' ×' + n : ''}`; });
    if (c.gold) { S.gold += c.gold; got.push(`${c.gold} 金幣`); }
    log('寶箱：' + got.join('、')); return message([`打開寶箱，得到 ${got.join('、')}！`]);
  }
}

// ---- 戰鬥 ----
function startBattle(ids, opt) {
  const en = ids.map((id, i) => Object.assign(Rules.makeCombatant(enemyDef(id), false), { tag: ids.length > 1 ? String.fromCharCode(65 + i) : '', focus: null, def0: enemyDef(id) }));
  S.mode = 'battle'; S.battle = { en, opt: opt || {}, actor: 0, menu: 'cmd', sel: 0, queue: [], text: '' };
  battleText(`${en.map((e) => e.name + e.tag).join('、')} 出現了！`); nextActor(true);
}
function alive(list) { return list.filter((c) => !Rules.isDead(c)); }
function battleText(t) { S.battle.text = t; renderBattle(); }
function cmdList(c) {
  const B = S.battle;
  if (B.menu === 'cmd') return SPEC.battle.commands.map((k) => ({ k, label: { attack: '攻擊', skill: '技能', defend: '防禦', item: '道具', escape: '逃跑' }[k], off: k === 'escape' && B.opt.canEscape === false }));
  if (B.menu === 'skill') return (actorDef(c.id).skills || []).filter((s) => s.level <= c.level).map((s) => { const sk = skillDef(s.skill); return { k: sk.id, label: `${sk.name}（MP ${sk.mpCost}）`, off: c.mp < sk.mpCost }; });
  if (B.menu === 'item') return Object.entries(S.inv).filter(([id, n]) => n > 0 && itemDef(id).kind === 'consumable').map(([id, n]) => ({ k: id, label: `${itemDef(id).name} ×${n}` }));
  if (B.menu === 'target') return B.targets.map((t, i) => ({ k: i, label: `${t.name}${t.tag || ''}  HP ${t.hp}` }));
  return [];
}
function renderBattle() {
  const B = S.battle; draw();
  // 敵人畫在畫面上方
  const n = B.en.length, w = cv.width / (n + 1);
  B.en.forEach((e, i) => {
    if (Rules.isDead(e)) return;
    const cx = w * (i + 1), cy = cv.height * .32, r = e.isBoss ? 70 : 42;
    g.fillStyle = 'rgba(0,0,0,.55)'; g.fillRect(0, 0, cv.width, cv.height * .62);
    g.fillStyle = e.isBoss ? '#7a3fa0' : '#a04a4a'; g.beginPath(); g.arc(cx, cy, r, 0, Math.PI * 2); g.fill();
    g.fillStyle = '#fff'; g.font = '20px DotGothic16, monospace'; g.textAlign = 'center'; g.fillText(e.name + e.tag, cx, cy + r + 24);
    g.fillStyle = '#26304a'; g.fillRect(cx - 40, cy + r + 34, 80, 6); g.fillStyle = '#ff7a7a'; g.fillRect(cx - 40, cy + r + 34, 80 * e.hp / e.maxHp, 6);
  });
  B.en.forEach((e, i) => { if (!Rules.isDead(e)) { /* 重畫一次避免遮罩蓋住先畫的敵人 */ const cx = w * (i + 1), cy = cv.height * .32, r = e.isBoss ? 70 : 42;
    g.fillStyle = e.isBoss ? '#7a3fa0' : '#a04a4a'; g.beginPath(); g.arc(cx, cy, r, 0, Math.PI * 2); g.fill();
    g.fillStyle = '#fff'; g.font = '20px DotGothic16, monospace'; g.textAlign = 'center'; g.fillText(e.name + e.tag, cx, cy + r + 24);
    g.fillStyle = '#26304a'; g.fillRect(cx - 40, cy + r + 34, 80, 6); g.fillStyle = '#ff7a7a'; g.fillRect(cx - 40, cy + r + 34, 80 * e.hp / e.maxHp, 6); } });
  $('win').hidden = false; $('who').textContent = B.waiting ? '' : (alive(S.party)[B.actor] || {}).name || '';
  $('txt').textContent = B.text;
  if (B.waiting) { $('menu').innerHTML = ''; $('hint').hidden = false; }
  else { const c = alive(S.party)[B.actor]; const list = cmdList(c); B.sel = Math.min(B.sel, Math.max(0, list.length - 1));
    $('menu').innerHTML = list.map((it, i) => `<div class="${i === B.sel ? 'on' : ''} ${it.off ? 'off' : ''}">${it.label}</div>`).join('') || '<div class="off">（沒有可用的）</div>'; $('hint').hidden = true; }
  panel();
}
function nextActor(first) {
  const B = S.battle; if (!first) B.actor++;
  B.menu = 'cmd'; B.sel = 0; B.waiting = false;
  if (B.actor >= alive(S.party).length) return runRound();
  renderBattle();
}
function choose() {
  const B = S.battle, c = alive(S.party)[B.actor], list = cmdList(c), it = list[B.sel];
  if (B.waiting) return advanceQueue();
  if (!it || it.off) return;
  if (B.menu === 'cmd') {
    if (it.k === 'attack') { B.pending = { type: 'attack' }; B.targets = alive(B.en); B.menu = 'target'; B.sel = 0; return renderBattle(); }
    if (it.k === 'skill') { B.menu = 'skill'; B.sel = 0; return renderBattle(); }
    if (it.k === 'item') { B.menu = 'item'; B.sel = 0; return renderBattle(); }
    if (it.k === 'defend') { B.queue.push({ c, type: 'defend' }); return nextActor(); }
    if (it.k === 'escape') { B.queue.push({ c, type: 'escape' }); return runRound(); }
  }
  if (B.menu === 'skill') { const sk = skillDef(it.k); B.pending = { type: 'skill', sk };
    if (sk.target === 'enemy_single') { B.targets = alive(B.en); B.menu = 'target'; B.sel = 0; return renderBattle(); }
    if (sk.target === 'ally_single') { B.targets = alive(S.party); B.menu = 'target'; B.sel = 0; return renderBattle(); }
    B.queue.push({ c, type: 'skill', sk }); return nextActor(); }
  if (B.menu === 'item') { B.pending = { type: 'item', id: it.k }; B.targets = alive(S.party); B.menu = 'target'; B.sel = 0; return renderBattle(); }
  if (B.menu === 'target') { B.queue.push(Object.assign({ c, target: B.targets[it.k] }, B.pending)); return nextActor(); }
}
function cancel() { const B = S.battle; if (!B || B.waiting) return; if (B.menu === 'target' || B.menu === 'skill' || B.menu === 'item') { B.menu = 'cmd'; B.sel = 0; renderBattle(); } }
function runRound() {
  const B = S.battle, order = Rules.turnOrder(S.party, B.en), acts = [];
  for (const u of order) {
    if (u.isPlayer) { const q = B.queue.find((x) => x.c === u); if (q) acts.push(q); }
    else acts.push({ c: u, type: 'enemy' });
  }
  const esc = B.queue.find((q) => q.type === 'escape');
  B.queue = []; B.steps = [];
  if (esc) { if (Math.random() < SPEC.battle.escape.chance) { B.steps.push('成功逃走了！'); B.result = 'escape'; } else B.steps.push('逃不掉！'); }
  if (!B.result) for (const a of acts) {
    if (Rules.isDead(a.c)) continue;
    const st = Rules.tickStatusAtTurnStart(a.c); if (st.skip) { B.steps.push(`${a.c.name} 動彈不得！`); continue; }
    B.steps.push(...doAction(a).filter(Boolean));
    if (!alive(B.en).length) { B.result = 'win'; break; }
    if (!alive(S.party).length) { B.result = 'lose'; break; }
  }
  B.waiting = true; advanceQueue();
}
function doAction(a) {
  const B = S.battle, c = a.c, out = [];
  if (a.type === 'defend') { c.defending = true; return [`${c.name} 防禦著。`]; }
  if (a.type === 'escape') return [];
  if (a.type === 'item') { const it = itemDef(a.id); S.inv[a.id]--; const t = Rules.isDead(a.target) ? c : a.target; t.hp = Math.min(t.maxHp, t.hp + (it.use.amount || 0)); return [`${c.name} 使用了${it.name}，${t.name} 回復了。`]; }
  if (a.type === 'enemy') {
    const targets = alive(S.party); if (!targets.length) return [];
    let t = targets[Math.floor(Math.random() * targets.length)];
    if (c.def0.focusAttack) { if (!c.focus || Rules.isDead(c.focus)) c.focus = t; t = c.focus; }   // H-069 集中攻擊
    const r = Rules.rollDamage(c, t); if (r.dodged) return [`${c.name}${c.tag} 的攻擊！${t.name} 閃開了。`];
    Rules.applyDamage(t, r.dmg); out.push(`${c.name}${c.tag} 的攻擊！${r.crit ? '會心一擊！' : ''}${t.name} 受到 ${r.dmg} 點傷害。`);
    if (Rules.isDead(t)) out.push(`${t.name} 倒下了……`);
    return out;
  }
  const target = a.target && !Rules.isDead(a.target) ? a.target : (a.type === 'attack' || (a.sk && a.sk.target === 'enemy_single') ? alive(B.en)[0] : a.target);
  if (a.type === 'attack') {
    const r = Rules.rollDamage(Object.assign({}, c, { atk: c.atk + atkWithEquip(c) }), target);
    if (r.dodged) return [`${c.name} 的攻擊！${target.name} 閃開了。`];
    Rules.applyDamage(target, r.dmg); out.push(`${c.name} 的攻擊！${r.crit ? '會心一擊！' : ''}${target.name}${target.tag || ''} 受到 ${r.dmg} 點傷害。`);
  }
  if (a.type === 'skill') {
    const sk = a.sk; if (c.mp < sk.mpCost) return [`${c.name} 的 MP 不夠。`]; c.mp -= sk.mpCost;
    out.push(`${c.name} 使出${sk.name}！`);
    const tgts = sk.target === 'enemy_all' ? alive(B.en) : sk.target === 'ally_all' ? alive(S.party) : [target || c];
    for (const t of tgts) {
      if (sk.multiplier > 0) { const r = Rules.rollDamage(c, t, null, { atk: Math.floor((c.atk + atkWithEquip(c)) * sk.multiplier), attackElement: sk.element || 'none' });
        if (!r.dodged) { Rules.applyDamage(t, r.dmg); out.push(`${t.name}${t.tag || ''} 受到 ${r.dmg} 點傷害。`); } else out.push(`${t.name} 閃開了。`); }
      for (const e of sk.effects || []) {
        if (e.type === 'heal') { t.hp = Math.min(t.maxHp, t.hp + e.amount); out.push(`${t.name} 回復了 ${e.amount} 點 HP。`); }
        if (e.type === 'applyStatus' && !Rules.isDead(t)) { Rules.addStatus(t, e.status, e); out.push(`${t.name}${t.tag || ''} 被${(SPEC.statusEffects.find((s) => s.id === e.status) || {}).name}了！`); }
      }
    }
  }
  for (const e of B.en) if (!Rules.isDead(e)) { const p = Rules.checkBossPhase(e); if (p) out.push(`${e.name} 的怒氣上升了！`); }
  for (const e of B.en) if (Rules.isDead(e) && !e.dyingSaid) { e.dyingSaid = true; out.push(`${e.name}${e.tag} 被打倒了！`); }
  return out;
}
function advanceQueue() {
  const B = S.battle;
  if (B.steps.length) return battleText(B.steps.shift());
  if (B.result) return endBattle(B.result);
  B.queue = []; B.actor = -1; B.waiting = false; nextActor();
}
function endBattle(result) {
  const B = S.battle, opt = B.opt;
  if (result === 'win') {
    const exp = B.en.reduce((s, e) => s + (e.def0.expReward || 0), 0), gold = B.en.reduce((s, e) => s + (e.def0.goldReward || 0), 0);
    S.gold += gold; const lines = [`獲得 ${exp} 經驗值、${gold} 金幣。`];
    for (const c of alive(S.party)) {
      c.exp += exp;
      while (c.exp >= Rules.formula('expToNext', { level: c.level })) {
        c.exp -= Rules.formula('expToNext', { level: c.level }); c.level++;
        const gr = actorDef(c.id).growth || {}; for (const k of ['maxHp', 'atk', 'def', 'spd', 'luk', 'maxMp']) c[k] += gr[k] || 0;
        c.hp = c.maxHp; c.mp = c.maxMp; lines.push(`${c.name} 升到 ${c.level} 級！`);
      }
    }
    for (const e of B.en) for (const d of e.def0.drops || []) if (Math.random() * 100 < d.chance) { S.inv[d.item] = (S.inv[d.item] || 0) + 1; lines.push(`得到 ${itemDef(d.item).name}。`); }
    for (const [k, v] of Object.entries(opt.setFlagsOnWin || {})) S.flags[k] = v;
    S.party.forEach((c) => { if (Rules.isDead(c)) c.hp = 1; c.defending = false; });
    S.battle = null; S.mode = 'walk'; log(lines.join(' ')); message(lines);
    if (opt.onWinMap) enterMap(opt.onWinMap, opt.onWinSpawn);
  } else if (result === 'lose') {
    // H-105 失敗也會變強：不 Game Over，金幣減半、經驗值保留，回到起點
    S.gold = Math.floor(S.gold / 2); S.party.forEach((c) => { c.hp = c.maxHp; c.mp = c.maxMp; c.statuses = {}; });
    if (opt.flag) S.flags[opt.flag] = false;
    S.battle = null; S.mode = 'walk'; enterMap(SPEC.maps[0].id);
    message(['眼前一黑……', '醒來時，你回到了港口。金幣少了一半，但經驗留了下來。']);
  } else { S.battle = null; S.mode = 'walk'; closeDialogue(); }
  draw(); panel();
}
function ending() {
  S.mode = 'end'; draw();
  g.fillStyle = 'rgba(5,7,13,.85)'; g.fillRect(0, 0, cv.width, cv.height);
  g.fillStyle = '#e8c66a'; g.font = '34px DotGothic16, monospace'; g.textAlign = 'center';
  g.fillText('鐘聲響起，霧散了。', cv.width / 2, cv.height / 2 - 10);
  g.fillStyle = '#eef1fa'; g.font = '18px DotGothic16, monospace'; g.fillText('— 示範切片結束 —　重新整理可再玩一次', cv.width / 2, cv.height / 2 + 30);
  log('結局：鐘聲響起');
}

// ---- 輸入 ----
function key(k) {
  if (S.mode === 'end') return;
  if (S.mode === 'dialogue') {
    const node = S.dlg.node, last = S.dlg.line >= node.lines.length - 1;
    if (node.type === 'choice' && last && (k === 'ArrowUp' || k === 'ArrowDown')) { S.dlg.sel = (S.dlg.sel + (k === 'ArrowUp' ? -1 : 1) + node.choices.length) % node.choices.length; return showLine(); }
    if (k === 'Enter') dialogueNext();
    return;
  }
  if (S.mode === 'battle') {
    const B = S.battle;
    if (k === 'Enter') return choose();
    if (k === 'Escape') return cancel();
    if (!B.waiting && (k === 'ArrowUp' || k === 'ArrowDown')) { const n = cmdList(alive(S.party)[B.actor]).length || 1; B.sel = (B.sel + (k === 'ArrowUp' ? -1 : 1) + n) % n; renderBattle(); }
    return;
  }
  const dir = { ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0] }[k];
  if (dir) tryMove(...dir); else if (k === 'Enter') interact();
  if (S.mode === 'walk') { draw(); panel(); }
}
const MAP = { w: 'ArrowUp', s: 'ArrowDown', a: 'ArrowLeft', d: 'ArrowRight', W: 'ArrowUp', S: 'ArrowDown', A: 'ArrowLeft', D: 'ArrowRight', ' ': 'Enter', Escape: 'Escape' };
addEventListener('keydown', (e) => { const k = MAP[e.key] || e.key; if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Enter', 'Escape'].includes(k)) { e.preventDefault(); key(k); } });
document.querySelectorAll('[data-k]').forEach((b) => b.addEventListener('click', () => key(b.dataset.k)));

// ---- 開始 ----
S.party = SPEC.actors.filter((a) => a.inParty).map((a) => Rules.makeCombatant(a, true, 1));
enterMap(SPEC.maps[0].id); draw(); panel();
message(['（灰盒試玩）面對 NPC 按 Enter 對話。', '先去找左上角的老守燈人。']);
</script>
