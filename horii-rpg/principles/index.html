  <p class="note">原則是改寫過的摘要，不是原文翻譯；數字（例如 66%、30 步）是《勇者鬥惡龍》的做法，不是通用公式。來源：堀井雄二・塩崎剛三，Square Enix，2026。</p>

<script>
const DATA = {"items":[{"id":"H-001","title":"從魔王開始設計","cat":"企劃","rule":"做新作時先決定魔王：他想做什麼、為什麼、用什麼手段與步驟。主角要做的事，會隨魔王的故事而改變。","why":"「打倒魔王」這個絕對目的固定了，過程反而能做出各種變化、複雜劇情和意外性。初代只要單純的魔王就夠，續作從魔王設定切入比較好想。","ex":"《III》佐瑪有「毀滅即我的喜悅」這樣的動機，主角該做的事就由此決定。","ask":"我的魔王想支配還是毀滅世界？動機是什麼？是一人還是多人？據點在哪？打倒他需要什麼？","page":"p.14–15"},{"id":"H-002","title":"主角不一定是勇者","cat":"企劃","rule":"主角當勇者最簡單好懂，但不是必要條件。換一個主角的立場，就是一條新故事。","why":"主角可以是勇者的父親、幫助另一位勇者的人、平凡市民、尋找勇者的使者；如果魔王想復活某物，搶先找到並阻止它，也是主角的任務。","ex":"《V》主角是勇者的父親。《XI》被說是勇者，去見國王卻被關進牢裡，在牢中遇到夥伴卡繆。","ask":"主角和魔王的關係有沒有別種可能？夥伴怎麼跟主角相遇，能不能出乎玩家意料？","page":"p.15–16"},{"id":"H-003","title":"遊戲讓人體驗另一種人生","cat":"心法","rule":"設計角色與事件時，目標是讓玩家能「成為」主角。","why":"人生只有一次，人都想體驗另一種人生。小說、電影也能帶人代入主角，但遊戲由玩家親手操作主角，代入感應該比電影或書更強。","ex":"作者把這點當作整套 RPG 設計的出發點。","ask":"這個事件，是玩家「在看」主角，還是玩家「就是」主角？","page":"p.16–17"},{"id":"H-004","title":"冒險目的的三種原型","cat":"企劃","rule":"除了魔王之外，冒險最好另有目的，故事會更深。常用的目的有三類：打倒某物、尋找某物、拯救某人。","why":"目的的設計直接決定故事的厚重度，所以作者會在這裡花時間慢慢做。三類可以組合，「取回失去的東西」也是常用變形。","ex":"《I》從救蘿拉公主走向打倒龍王，三類目的都用上了；尋找銀豎琴、雨之杖、太陽之石等道具。手塚治虫《多羅羅》是取回被奪走的身體。","ask":"我的冒險除了「打倒魔王」，還有什麼要找、要救、要取回？","page":"p.17–18"},{"id":"H-005","title":"世界設定要和魔王、主角一起想","cat":"企劃","rule":"決定魔王和主角時，同時決定時代與世界。再寫好幾個版本，挑出讓玩家「喔！」的那個。","why":"時代一定，敵人和主角的身分就跟著定了。以平安時代為例，敵人自然是鬼；主角可以是貴族、武士或町人，作者覺得「町人其實是貴族落胤」更有說服力。老套橋段也能翻轉：公主被鬼抓走，趕去救時她卻獨自一人在那裡，她在做什麼？","ex":"《IV》用章節把四散的夥伴集合起來；《V》是親子三代加結婚；《VI》是尋找自我；《VII》是各式各樣的人間劇。","ask":"我的世界設定，有沒有一個讓玩家「喔！」的切入點？","page":"p.19–20"},{"id":"H-006","title":"放到地圖上才知道點子行不行","cat":"心法","rule":"點子很容易浮現，但真的畫成地圖、配置人物、寫進台詞時，常會發現「咦？不是這樣」。這時要一直往「更有趣」修。","why":"太輕、沒氣氛、結局太「預定調和」（照預期收尾），都要再扭一下。有時也可以先不管後面，只想「接下來發生什麼最有趣」，把故事推下去，前後矛盾之後再補。","ex":"《IV》第二章艾莉娜回到城裡，城裡的人全消失了，就是先想「怎樣最有趣」再回頭圓。","ask":"這段劇情太輕嗎？結局太好猜嗎？接下來發生什麼會最有趣？","page":"p.20–21"},{"id":"H-007","title":"先畫世界地圖","cat":"企劃","rule":"世界與時代決定後，先實際畫出世界地圖，再想城鎮。","why":"從地圖切入很重要：要先想清楚在什麼世界冒險、遊戲裡的日常是什麼樣子；有哪些城、鎮、村，之後再想。","ex":"作者的固定做法。","ask":"我有沒有先畫出整張世界地圖，而不是先做零散的城鎮？","page":"p.21"},{"id":"H-008","title":"地圖從真實地形取材，再自由修改","cat":"企劃","rule":"畫世界地圖時參考真實的世界地圖，切下喜歡的一塊地形、把小半島放大成大陸，先做出海陸白地圖。","why":"比起從零開始，看著白地圖想像會更豐富。之後再決定城、鎮、洞窟放哪；開始寫故事後，移動城鎮、加島都可以。要注意畫出來要「像世界地圖」：下方是海比較安定，上方是海會讓人不安；他試過把大陸多放在南半球，怎麼看都不像世界地圖，只好改掉。","ex":"作者每次做地圖的方法。","ask":"我的地圖看起來像一個可信的世界嗎？","page":"p.22"},{"id":"H-009","title":"世界不做成球體，但積極用多層地圖","cat":"系統","rule":"《勇者鬥惡龍》的世界刻意不做成球體，上下、左右各自相連；穿過南極就從北極出來。另一方面，要積極使用兩、三層的多層地圖。","why":"做成真正的球體，地圖反面的地形會反著出現，玩家腦袋會混亂。兩、三層的結構玩家比較好掌握，夢境、過去、海底都可以當另一層。","ex":"《III》有上下兩個世界；HD-2D 版《I&II》有海上與海底兩種地圖。","ask":"我的地圖結構，玩家能不能在腦中掌握？","page":"p.23"},{"id":"H-010","title":"地圖的目標是讓玩家想去","cat":"企劃","rule":"做地圖最重要的是讓玩家覺得「喔，好想去那裡！」。","why":"「這個島好像有什麼」這種看起來有東西的地點放得越多，走在地圖上就越興奮。只要好玩什麼都可以，這就是《勇者鬥惡龍》。季節變化後去得了原本去不了的地方、時段與天氣改變出現的怪物，都是好例子。","ex":"季節、時段、天氣的變化。","ask":"玩家看著我的地圖，會不會指著某個地方說「那裡一定有東西」？","page":"p.23–24"},{"id":"H-011","title":"城鎮從地形和「困擾」長出事件","cat":"事件","rule":"先決定要出現什麼樣的城鎮，再想這個城鎮有什麼困擾、怎麼解決，把每個城鎮做成像連續劇的一集。","why":"玩家第一次到城鎮時，村民多半正在困擾；困擾的內容每個城鎮都不同。火山城鎮自然是跟火山有關的困擾；滅亡的城鎮就要想為什麼滅亡。也可以先從地形決定：看書、地圖、旅遊書、社群、影片，覺得「這地形有趣」「這建築很美」就拿來用。現在畫面很漂亮，瀑布、雪山、海底都做得出來，就要想怎麼利用這些表現來設計機關。","ex":"火山城鎮、滅亡的城鎮、沙漠城鎮、海邊城鎮。","ask":"這個城鎮的人在困擾什麼？為什麼？要做什麼才能解決？中間有什麼阻礙？","page":"p.24–25"},{"id":"H-012","title":"小故事累積成大故事","cat":"企劃","rule":"把各城鎮的小故事組合起來，再把主線好好地蓋上去、緊密連結。","why":"只要骨架做得紮實，支線和小插曲就能盡情擴展。","ex":"作者的組故事方式。","ask":"我的支線彼此之間、和主線之間，有沒有被串起來？","page":"p.26"},{"id":"H-013","title":"先定夥伴的加入方針，故事就看得見全貌","cat":"角色","rule":"夥伴怎麼湊齊、在故事裡擔任什麼角色，非常重要。先決定基本方針：一開始幾個人、隨劇情增加，還是讓玩家自由招募，或兩者混合。","why":"做法取決於故事，也牽涉系統。方針定了，配合方針寫故事，全貌大致就出來了。","ex":"《II》夥伴都是洛特勇者的子孫，故事從集合他們開始；為了讓相遇有變化下了很多工夫，例如找他找得半死，他卻說「哎呀，我找你找好久了」。《III》可在路易達酒場自由組隊；《IV》用章節，全部夥伴都在劇本裡；《XI》也是。","ask":"我的夥伴是劇本給的、玩家選的，還是混合？跟主角的相遇有沒有記憶點？","page":"p.26–27"},{"id":"H-014","title":"事件是讓玩家沒入故事的關鍵","cat":"事件","rule":"先想意外性，但不要太意外；比玩家預期「稍微斜上方一點」剛好。","why":"太出人意料，玩家只會覺得「什麼啊」。作者喜歡惡作劇，例如在旅店睡一晚，早上醒來城裡的人全不見了，他習慣從這種方向發展。事件是讓玩家投入故事的重要部分，絕對不能馬虎。","ex":"旅店醒來全鎮的人消失。","ask":"這個事件會讓玩家吃驚嗎？會不會吃驚過頭變成莫名其妙？","page":"p.28"},{"id":"H-015","title":"「尋找」是故事主軸，但不能讓人覺得是跑腿","cat":"事件","rule":"《勇者鬥惡龍》的故事大部分是用「尋找」構成的。找什麼很重要，要讓玩家心甘情願主動去找。","why":"玩家不主動，就只是在「跑腿」。系列裡跑腿要素其實很多，但他刻意寫成不讓人覺得是跑腿；只要不覺得是跑腿，玩家就會入戲，故事就能順暢推進。給資訊的方式也要動腦：與其說「去那裡」，不如說「不管發生什麼都別去那裡」，被禁止反而更想去。","ex":"「別去那裡」式的提示。","ask":"這個任務，玩家會想去，還是只是被叫去？","page":"p.28–29"},{"id":"H-016","title":"開發前半發散，後半收斂","cat":"心法","rule":"開發初期到一半左右，想到什麼就盡量展開；過了那段時間，就專心把點子收斂、做成形。","why":"先擴大可能性，再把各種事件做出來。","ex":"作者的開發節奏。","ask":"我現在在發散期還是收斂期？是不是該停止加新點子了？","page":"p.29"},{"id":"H-017","title":"系統先定大方向，細節之後再決定","cat":"系統","rule":"先列出遊戲系統的大方向就好，不必一開始決定所有細節。","why":"作者列出「勇者鬥惡龍式 RPG」的骨架：①有紮實的劇本，玩家走在它的軌道上；②主地圖是 2D 或 3D 的類地球地圖；③回合制、指令式戰鬥，幾乎沒有動作要素，隊伍作戰；④城鎮、洞窟、塔、城等多種地圖；⑤可步行，也有船、飛行物、潛水物；⑥選擇對象來對話；⑦收集武器、防具、道具，有寶箱、壺；⑧事件與戰鬥可用動畫、3D 演出。","ex":"系列採用隨機遇敵或明雷遇敵的指令式 RPG。","ask":"我能不能用八條以內寫出自己遊戲的系統骨架？","page":"p.30–31"},{"id":"H-018","title":"城鎮人物配置：連第二次來都要想好","cat":"企劃","rule":"先以一個代表性城鎮做一個小故事的骨架，再決定登場人物；如果這個城鎮中後期會再來，第二次以後的人物也要配置好，誰會不見也要想。","why":"配置不只是初始位置，還有面向哪邊、走動路線、被撞到時的反應；城裡發生事件或怪物戰時的反應也要設定。城鎮若有 30 個，就要對 30 個都有明確印象，寫下來，一開始不用完美。每個小故事的方向要先決定；沒有存在意義的城鎮不需要，各個小故事最好彼此埋伏筆、互相連動。","ex":"沙漠、雪原、森林中這種外觀鮮明的城鎮。","ask":"我每個城鎮都有存在的理由嗎？城鎮之間有沒有互相埋伏筆？","page":"p.32–33"},{"id":"H-019","title":"台詞就是劇本，路人台詞最難寫","cat":"台詞","rule":"《勇者鬥惡龍》幾乎不用旁白，劇本只由人物的台詞構成，所以每一句台詞都極其重要。最花心力的是沒什麼身分的路人台詞。","why":"寫法是先放城鎮、放人，預想玩家的移動路線和對話順序，再寫台詞；意料外的順序也要顧到。村長這種有任務的人，台詞內容早就定了，反而不難；普通村民要講什麼，他每次都很煩惱，因為想寫出真的住在那個村子的人會講的話，也想加點笑點。在這裡偷懶，那個村子的真實感就沒了，城和鎮也一樣。","ex":"作者常覺得不安，會請人試玩，聽到「好玩」才安心。","ask":"把這個城鎮的路人台詞全部刪掉，玩家會不會覺得這裡沒人住？","page":"p.33–34"},{"id":"H-020","title":"怪物從世界觀出發，草圖故意畫粗","cat":"系統","rule":"世界觀就是一切，怪物要從世界觀出發；先定怪物方向再畫粗略草圖。交給畫家的草圖只當提示，故意畫得像小孩塗鴉。","why":"表現怪物的是鳥山明，作者不想妨礙他。草圖畫太完整，鳥山會覺得改了不好意思，就照著畫。看到鳥山的完成圖，世界觀會更清楚，也能再挖出怪物周邊的點子；來回幾次，怪物形狀越來越具體。事先決定出現場所、強度、出現頻率、重要度，之後設參數時就少煩惱；正式命名和強弱，要等收到完成圖後才決定。","ex":"他會把怪物由弱到強排在牆上，看著調整「這隻要再右邊一點，放在奇美拉和狼人之間」。","ask":"我的怪物設計是從世界觀長出來的，還是隨便湊的？給美術的指示有沒有留空間？","page":"p.35–37"},{"id":"H-021","title":"怪物 AI 決定怪物的個性","cat":"系統","rule":"每種怪物外觀不同、是不同種族的生物，要做出有個性的怪物，就要把牠的「思考」做紮實。","why":"系列從《I》起怪物就用 AI 行動；怪物的性格用 50 個以上的數值欄位來表現。之後歷代一直修正，但基本方向沒變。","ex":"本書第三部公開了這些參數表。","ask":"我的每種怪物，除了數值強弱，有沒有不同的「想法」？","page":"p.37–38"},{"id":"H-022","title":"夥伴 AI 故意不選最佳解","cat":"系統","rule":"電腦要不犯錯很簡單，但要刻意不那麼做，才會有人味。","why":"《IV》的主題之一是「夥伴也有自己的人生」，所以讓夥伴完全由 AI 行動、不能下指令，不照玩家意思反而真實。初期 AI 演算法不夠聰明，下一作就加入作戰指令，讓玩家享受當指揮官的樂趣。夥伴有 8 人就要 8 種個性，有個性角色才會活起來；怎麼給 AI 個性，是本書的核心之一。只要 AI 知道敵人參數就能打出最有效的攻擊，但故意讓它唱不太有效的咒文，才像人；這是平衡的問題。","ex":"《IV》的夥伴 AI、之後的作戰指令。","ask":"我的 AI 夥伴會不會太完美而像機器？它的「失誤」有沒有個性？","page":"p.39–40"},{"id":"H-023","title":"道具從劇情需要出發，全部都要設定","cat":"系統","rule":"先想這個世界有什麼道具、在哪裡拿到；劇情需要的關鍵道具要決定藏在哪、誰守著。其他戰鬥用的武器、防具、魔法道具也要準備。","why":"取得方式分四種：在店裡買賣；藏在地城或塔裡、當獎品；自己鍛造；怪物掉落或偷來。全部都要設定參數、效果、價格、配方，加起來輕鬆超過 100 種；用一次就消失還是能重複用、能不能賣、能不能丟、誰能裝備、會不會被詛咒、世界上只有一個嗎、在哪裡，都要細細指定。","ex":"要渡過海峽需要彩虹橋，就得做出對應的新道具。到《VII》為止，劇本寫完後的怪物、道具、商店、寶箱資料都由作者一人做，光資料就花兩個月。","ask":"我的關鍵道具，玩家是怎麼拿到的？誰守著它？","page":"p.40–42"},{"id":"H-024","title":"職業與屬性也給怪物","cat":"系統","rule":"主角和夥伴的職業決定 HP、MP、能用的武器、咒文與特技；同樣的屬性概念也套到怪物身上。","why":"給怪物職業或屬性，玩家馬上能理解敵人的攻擊和特性，做參數時也非常好用。能用的咒文、角色定位、特技、HP、技能點分配、轉職條件，要在某個階段確實決定。","ex":"《III》起加入戰士、僧侶、魔法使、賢者等職業。","ask":"玩家看到一隻怪，能不能從外觀猜出牠大概會做什麼？","page":"p.42–43"},{"id":"H-025","title":"特技是為了讓物理職業有變化","cat":"系統","rule":"咒文和特技大多綁職業。戰士、武鬥家只靠直接攻擊也能玩，但戰術太窄，所以加入「特技」給他們，等於物理職業的咒文。","why":"《VI》起加入特技，《VIII》再加入技能，把成長方向交給玩家，攻擊變化大增。起初他以為特技不耗 MP，但那樣會無限使用、破壞戰鬥平衡，所以一部分特技耗 MP，耗不耗憑感覺決定；後來幾乎全部特技都耗 MP。","ex":"怪物的特技從《I》就有，主角與夥伴的特技從《VI》開始。","ask":"我的物理職業，除了「攻擊」以外還有什麼選擇？","page":"p.43–44"},{"id":"H-026","title":"寶物的等級要和劇情進度一起管","cat":"平衡","rule":"寶物由怪物守著，就要設定適合那個場所的冒險等級。等級管理就是故事進度的管理。","why":"主角要找的東西大多藏在遊戲裡；藏在寶箱、怪物身上還是地城，看劇本。寶物和任務是連動的，邊想連動邊做小故事、編故事，兩者都重要。他也會刻意把劇情等級和任務等級拉開，讓玩家練功後再挑戰。","ex":"寶物除了寶箱，也會在壺、衣櫃、書架裡。最初的城裡，牢房門的另一頭放寶箱，拿到「最後之鑰」前都拿不到，讓玩家有一天想回來拿。","ask":"玩家第一次看到卻拿不到的東西，我放了幾個？","page":"p.44–45"},{"id":"H-027","title":"目的要分層，而且要給獎賞","cat":"企劃","rule":"遊戲中準備什麼目的，決定故事和劇本的大框架。最終目標最好在中盤以後就清楚可見；達成時要有相應的獎賞；達成後也可以繼續故事。","why":"近年系列會準備多個目的，讓玩家一路往深處走：第 1 目標這樣、第 2 目標那樣、第 3 目標試試這個。想這些、包含通關後的內容，是作者最開心的事；不過開發中沒有餘裕，通常要到中盤以後。","ex":"近年《勇者鬥惡龍》的多段目的。","ask":"玩家在中盤時，知道最終要做什麼嗎？通關後還有什麼？","page":"p.46"},{"id":"H-028","title":"先定概念與廣告詞","cat":"企劃","rule":"概念和廣告詞要早點定。定下來之後，劇本會一路順暢。","why":"概念和廣告詞紮實，遊戲的世界觀就會自然成形。","ex":"概念：《V》親子三代打倒魔王、有結婚事件；《VI》尋找自我；《VII》收集地圖。廣告詞：《VII》「人，可以成為某個人」；《VIII》「放眼所及皆是世界」。","ask":"我能用一句話說出這個遊戲的概念嗎？它能幫我判斷哪些功能不該做嗎？","page":"p.47"},{"id":"H-029","title":"命名重親近感，勝過合理性","cat":"台詞","rule":"咒文、道具這類名字，選一聽就能感覺意思、讓人覺得親近的詞，而不是聽起來很像奇幻、卻沒人懂的詞。","why":"作者說日本人對「意思不太懂的詞」不如對「一聽就有感覺的擬聲詞」有感。當年奇幻 RPG 的咒文多是「Healing」「Tiltowait」這種名稱，他改用「ホイミ」「メラ」「ギラ」這種擬聲感的片假名，再用三段變化（ホイミ→ベホイミ→ベホマ）表示強度。「ラリホー」聽起來想睡、「ルーラ」聽起來會飛。開發初期被大力反對，他說用用看就會習慣，結果真的如此。咒文總數少，只要記一次就夠，所以有趣比較重要。","ex":"遊戲標題「勇者鬥惡龍」當初也評價不佳，他把當時大家熟悉的「Dragon」和還不熟的「Quest」接在一起。","ask":"玩家第一次看到這個名字，能不能猜到它是做什麼的？念起來有趣嗎？","page":"p.48–50（對談①）"},{"id":"H-030","title":"名字開頭要錯開，一眼分得出來","cat":"台詞","rule":"主要角色的名字避免用同一個字開頭；咒文、怪物名也盡量換開頭。","why":"這樣玩家馬上分得出差別。","ex":"作者也說明「咒文」和「魔法」的差別：魔法是名稱，咒文是說出口、唸出來的話；所以喊出「ホイミ！」的是咒文。","ask":"我的角色名、技能名，有沒有容易搞混的？","page":"p.51–52（對談①）"},{"id":"H-031","title":"化身每一個角色寫台詞，連路人也一樣","cat":"台詞","rule":"寫劇本最重要的一件事，是「化身成登場人物來寫台詞」：站在那個角色的立場和心情寫，讓他動起來。","why":"不管是撐起主線的重要人物，還是只講一句話的路人，都要有符合那個人的行動和台詞；做不到，故事就會變薄。登場人物變多不要當成負擔，要讓滿城的人都活起來。絕對不能為了推進劇情，讓角色說出他當下不可能知道的事，真實感會一下子消失。也不能覺得「反正是路人」就隨便寫，一寫成這樣，遊戲馬上變薄，玩家也會冷掉。","ex":"委託任務的村長台詞反而好寫，普通村民的台詞他曾花兩個多小時才寫出兩行。《VI》雷德克城裡國王房前的士兵，他化身那個士兵寫出一段心情台詞，被人說「這不是普通寫得出來的」。","ask":"這句台詞，是這個人會說的話，還是我需要他說的話？他知不知道這件事？","page":"p.57–60"},{"id":"H-032","title":"「困擾」要寫出原因、情景與心情","cat":"台詞","rule":"要表現某件事，不能只丟一句「好困擾啊」，要讓不同的人說出「我們因為這樣那樣在困擾」。","why":"寫出具體原因，玩家腦中才會有情景、對策和情緒，才能沒入故事。再扭一下，例如安排一個為這個困擾高興的人，故事就更豐富。對同一件事，不只正反兩面，可以安排三、四種方向的看法，把每個人的理由、不滿、情緒寫細，城鎮就會有深度，故事也有寬度。","ex":"某個村子非常困擾時的寫法。","ask":"這個城鎮的人對同一件事，有沒有三種以上不同的看法？","page":"p.60"},{"id":"H-033","title":"角色會自己走，劇本是副產物的集合","cat":"角色","rule":"化身成角色去寫，角色會慢慢自己行動，長出原本沒想到的台詞和故事；把這些副產物收集起來，就是最後的劇本。","why":"作者認為角色自己走起來的過程，正是故事變有趣的過程。","ex":"《V》的亨利王子原本只設定成任性囂張的小鬼，一見面就叫主角「當我的小弟」。寫著寫著，他的性格被磨出來，說出作者完全沒想到的話；和主角一起當了十年奴隸的過程中，人性的一面露出來，最後成了朋友。","ask":"我的角色有沒有讓我寫出「沒想到他會這樣說」的時候？","page":"p.61–63"},{"id":"H-034","title":"催淚事件從一個「必要的畫面」出發","cat":"事件","rule":"先找出一個非有不可的畫面，再從它把故事往外擴。","why":"《III》奧特加的戰鬥是作者非常重視的場面。玩家事先從鎮民口中聽說奧特加已墜海身亡，所以實際看到他在戰鬥，會驚呼「他還活著！要和孩子重逢了！」。奧特加和王者多頭蛇一對一戰敗，到斷氣都沒發現看著他的是自己的孩子，作者刻意做出這種揪心的安排。他也可以讓奧特加多活一下、和孩子說話，但他沒有這樣做，因為「奧特加輸了，而孩子在旁邊看著」這個畫面是先決定的。海外紅白機版甚至在開場加了描寫奧特加死鬥的前日談。","ex":"《III》奧特加與王者多頭蛇。","ask":"我想讓玩家哭的那一幕，畫面是什麼？其他劇情有沒有在為它鋪路？","page":"p.64–66"},{"id":"H-035","title":"大故事玩家早知道，意外的小事件才重要","cat":"事件","rule":"從故事切入時，作者的想法容易跑在前面，所以要刻意先重視角色和事件。","why":"「打倒魔王」這個大故事已經定了，玩家也早就知道；打倒魔王之前發生什麼意外，才更重要。事件是調味料，但照實寫出來太平淡，怎麼炒熱、怎麼料理，是寫劇本的人的本事。要多看電影、連續劇、漫畫，體會轉折，在故事中途放高潮、改變發展；需要轉折時，就大方地加新事件。","ex":"《III》當一天國王；在旅店睡一晚，醒來全村沒人（晝夜狀態改變的機關）。","ask":"玩家已經知道結局，那途中有什麼讓他意外的事？","page":"p.66–67"},{"id":"H-036","title":"要寫進角色的心裡，否則讀者會起疑","cat":"角色","rule":"寫故事時最重要的，是化身成角色的心情去寫。","why":"不這樣做，作者的意圖就會跑在前面，讀者會覺得不對勁。小心地把讀者拉進來，是讓人入迷的關鍵；好好寫出那個角色怎麼想，玩家就會自然被吸引，路人也一樣。","ex":"作者對自己所有劇本的要求。","ask":"這段劇情的發展，是角色的心情推出來的，還是我需要它這樣發展？","page":"p.68"},{"id":"H-037","title":"先把角色立起來，讓他自己引發事件","cat":"角色","rule":"與其先想事件，不如先想角色，再對那個角色丟出各種困難；角色立得好，放著他也會自己動、自己引發事件。","why":"作者認為角色就是一切；連續劇、電影、小說、漫畫都一樣，角色描寫得好，故事會被角色創造出來。他從小故事和角色都愛，事後回想或許更偏角色。","ex":"《XI》貝洛妮卡被迪達一味擄走、身體變成幼女，仍努力完成引導妹妹與勇者的使命，最後為了救其他七人犧牲，是系列首位死亡離隊的夥伴。作者猶豫過，也可以讓八人無傷打倒魔王，或讓別的夥伴受重創，但覺得是貝洛妮卡才最自然，彷彿她自己動了起來。妹妹賽妮亞擦掉眼淚、剪掉和姊姊一樣的長髮，從不起眼的女孩變成人氣角色。他說後半的故事是姊妹倆創造的，自己只是搭上軌道。","ask":"我是先有事件再找角色去演，還是先有角色再讓事件發生？","page":"p.68–71"},{"id":"H-038","title":"玩家會忘記劇情，但記得角色","cat":"角色","rule":"角色立起來，玩家就算忘了故事，也會記得角色。","why":"細小的事件會被忘掉，但它們累積成整體；角色讓事件活起來，也會自己引發下一個事件。怎麼把角色的魅力引出來，就是寫故事、寫劇本。","ex":"《小拳王》只要有主角在故事就一直走；《IV》的艾莉娜、米涅亞、瑪妮亞、托魯內可，玩家到現在都記得。","ask":"玩完一年後，玩家還會記得我遊戲裡的誰？","page":"p.72"},{"id":"H-039","title":"重複登場會累積親近感","cat":"角色","rule":"讓同一個角色在不同地方、不同作品一再登場，玩家會越來越覺得親近，角色也會自己走起來。","why":"人的親近感來自「出現的次數」，偶像、藝人都一樣，遊戲角色也一樣。出現多次，大家就會用親近的心情看他，覺得他不是外人。","ex":"《III》的大盜坎達塔：在香帕尼塔被打敗時求饒「拜託，原諒我吧」，之後又因綁架塔尼婭再次被打倒、再次求饒。作者看到這兩次厚臉皮的求饒深植玩家記憶，覺得他會成長為有個性的角色，之後讓他在《V》的試煉洞窟、DS 版、《XI》、《X Online》外傳以及 HD-2D 版《I・II》一再登場；《X Online》外傳裡他甚至暫時成為夥伴。","ask":"我的遊戲裡，有沒有一個玩家會「又遇到他了！」的角色？","page":"p.73–75"},{"id":"H-040","title":"讓玩家想知道「這傢伙接下來要幹嘛」","cat":"角色","rule":"給角色一個讓人「這傢伙是誰？」的登場，讓玩家想看他之後怎麼做；這樣一來，他加入隊伍時就已經有感情了。","why":"作者覺得只要玩家想看後續，就等於已經是夥伴了。重要的過去不一定要寫明，只「暗示」到某個程度，反而會引起好奇，讓玩家自己往好的方向補完。","ex":"《VI》泰瑞：輕鬆打倒阿克波特城的布拉斯特、在旅人洞窟壓勝巴特雷克斯、想橫刀搶走「拉米亞斯之劍」，都是讓人留下印象的登場。泰瑞是米蕾優的弟弟，這是作者一開始就決定的；但鳥山明畫出的泰瑞設計作為主角有點太有個性，作者便改讓他擔任別的角色。甘迪諾的過去只用「被欺負過」帶過，不寫細節，反而讓兩人活了起來。","ask":"我的重要角色登場時，玩家會不會好奇他是誰、想做什麼？背景是不是講得太白了？","page":"p.76–78"},{"id":"H-041","title":"帥氣與強度是兩回事","cat":"角色","rule":"角色的人氣不一定來自強度。外型、氣質都有可能讓角色走紅。","why":"泰瑞刻意不做得太強，開發團隊反應也不好，所以重製版讓他稍微變強，但仍然不如同時期的強敵。作者以為大家會選比較強的夥伴德蘭哥，結果泰瑞反而比較受歡迎，他認為是帥哥設定的關係。泰瑞也可能是系列第一個詳細描寫外貌的角色。角色一旦受歡迎，就會越來越自己走。","ex":"《VI》泰瑞與德蘭哥。","ask":"我的角色除了能力，還有什麼讓人喜歡的地方？","page":"p.78"},{"id":"H-042","title":"生成式 AI 可以組合，但突發奇想仍屬於人","cat":"心法","rule":"作者認為生成式 AI 能把既有的故事組合出相當程度的作品；但「突發奇想」這種從無到有的發想，目前還是人類的事。","why":"開放世界的世界是開放的，但故事終究需要一條軌道；所謂「多重結局」大多也只是幾條平行世界，彼此不交錯。他也說，故事的模式其實大概已經出盡，連續劇、電影都是在換個味道重新調味；生成式 AI 要讓 NPC 自由說話不難，難的是對話何時停、怎麼依玩家行動改變故事。他最後補一句：AI 再進步，或許也能學會才能。","ex":"對談②中對 AI 與開放世界的看法。","ask":"我的遊戲哪一部分要靠「突發奇想」？那部分不能交給工具。","page":"p.80–84（對談②）"},{"id":"H-043","title":"魔王要有背景與苦衷","cat":"角色","rule":"魔王不能只定數值，還要想清楚他做了什麼壞事、為什麼。這個設定決定他是存在感強烈的魔王，還是薄弱、記不住的魔王。","why":"主角是勇者，但強大的魔王做什麼，主角的應對就跟著變，所以要先想敵人的盤算。作者認為敵人也可以成為英雄；有苦衷的魔王，會把故事越挖越深。","ex":"失敗例是《V》的米爾德拉斯：台詞準備了，但前面試煉和事件太多，個性不夠鮮明、存在感薄；反而殺了主角父親的部下蓋馬角色更立體，重製版又讓蓋馬更壞。成功例是《III》佐瑪，是很有特色的惡人頭目。《IV》的德斯皮薩羅：戀人羅莎莉被貪圖「紅寶石之淚」的人類害死，他知道後發誓復仇，用進化祕法變得越來越凶暴，是作者第一次替頭目寫這麼多背景。","ask":"我的魔王做壞事的理由是什麼？玩家打倒他時，會不會有一點複雜的心情？","page":"p.85–87"},{"id":"H-044","title":"同情反派時，勇者不能變成壞人","cat":"角色","rule":"替反派寫苦衷時，要小心不能讓勇者那一方變成壞人。","why":"從魔王那邊看，人類往往才是壞人。黑暗面的故事寫得太深，會讓人受傷，所以作者有意識地避免。替頭目加人性時，有人批評「打倒他後覺得不舒服」；作者也刻意不讓德斯皮薩羅的壞形象太重：原版是德斯皮薩羅親自襲擊主角的村子，後來改成部下擅自行動，免得他成為殺死青梅竹馬希霞的仇人，重製版才能讓他成為夥伴。","ex":"《IV》重製版的德斯皮薩羅；作者也提到《鋼彈》的夏亞，敵方角色開始被當成重要角色處理的潮流。","ask":"我讓反派值得同情時，有沒有反過來把主角寫成加害者？","page":"p.87–89"},{"id":"H-045","title":"魔王要強得離譜，也不能自滅","cat":"平衡","rule":"魔王必須是強得離譜的角色，同時要想辦法讓「勇者還沒變強前不會被魔王殺掉」說得通；而且魔王一定要由玩家自己打倒。","why":"他征服世界，能一瞬間把反抗軍變成石頭或動物；這麼強的魔王，卻放著弱小的勇者不管，在故事上講不通，所以每次都要花很多心思想理由。小說或連續劇可以讓魔王自己毀滅、皆大歡喜，但遊戲不行，否則之前的辛苦全白費，這是禁招。他很重視這點，所以王道很重要。","ex":"《VI》以尋找自我為主軸，作者煩惱德斯塔姆亞要做成什麼魔王，最後把四個魔王配置成部下，讓玩家慢慢知道他是強大的大魔王。","ask":"我的魔王為什麼沒有一開始就殺掉主角？最後是玩家親手打倒他嗎？","page":"p.90–91"},{"id":"H-046","title":"誤導魔王身分，是常用手法","cat":"事件","rule":"先讓玩家以為某人是魔王，之後才揭露真正的魔王，這種誤導是作者常用、也是寫故事必備的手法。","why":"他本來就喜歡翻轉，喜歡出其不意。這種手法在電影、兩小時連續劇裡也常用，做遊戲的靈感就藏在這些地方。","ex":"《II》從哈貢到希德；《III》從巴拉莫斯到佐瑪，《III》是他最有意識使用的一次。《VI》最初的穆多戰，以為是夢境，其實是現實。","ask":"我的最終頭目，玩家一開始就知道嗎？有沒有更好的揭露時機？","page":"p.91"},{"id":"H-047","title":"新系統要配一個最能活用它的角色","cat":"角色","rule":"做出新系統時，要有一個角色能把它發揮到最好。","why":"《VII》第一次把「和夥伴對話」做成系統，作者想讓玩家享受和夥伴的各種對話，覺得普通女生很無聊，被罵一頓反而有趣，於是做出毒舌青梅竹馬瑪莉貝爾（當時還沒有「傲嬌」這個詞）。這個需求和他自己「想跟這種女生聊天」的心情融合，角色就立起來了。","ex":"瑪莉貝爾一句「陪我玩，謝謝。但是很無聊。」就把角色立住。如果在「謝謝」和「很無聊」之間加上「但是」，台詞就普通了，不再是瑪莉貝爾；作者連一個連接詞都會斟酌。","ask":"我的新系統，有沒有一個角色讓它變得好玩？","page":"p.92–93"},{"id":"H-048","title":"辛苦得到的夥伴才會珍惜","cat":"角色","rule":"要讓玩家覺得「好不容易才找到的夥伴」，就要設計讓人吃一點苦的相遇。","why":"太輕易就加入，像現實中告白對方馬上說「好啊」，一點也不開心。辛苦得到的，才會珍惜，回憶和感情也跟著來。","ex":"《II》的薩瑪托利亞王子一直擦身而過，很難碰面，作者故意讓玩家找得很辛苦，但同樣手法不想用第二次。摩恩柏克公主被變成狗，在摩恩佩塔鎮對狗說話，狗會跟著你，「咦？這是什麼？」，這個點子和公主的設定幾乎同時想到。他對公主特別有感情，原本準備了更多讓人成為她粉絲的劇情，但《II》容量不足只好割捨；她成了《IV》以後「被詛咒變形、背負悲傷過去」這類夥伴的原型。","ask":"玩家得到這個夥伴的過程，會留下回憶嗎？","page":"p.93–94"},{"id":"H-049","title":"流行角色會兩極，但評價可以等","cat":"角色","rule":"把時代流行放進角色，一開始可能被批評，但只要給角色重要的功能，評價可能會隨時間改變。","why":"作者看了手機小說，覺得流行的小惡魔辣妹很有趣，想當夥伴，於是做出《IX》的桑迪，起初被罵「為什麼要放這種角色」。他讓桑迪負責解說系統、給攻略提示，放在重要位置；《IX》是考慮到 DS 掌機做的，應該會有第一次玩的玩家、年齡層也更年輕，他希望桑迪把玩家帶往好方向。《IX》主線偏沉重，也需要一個開朗的角色。他認為十個人都說好的事幾乎不存在，作品有馬上被肯定的「速效型」，也有慢慢被肯定的「成熟型」，兩種都好；瑪莉貝爾和桑迪都屬後者，十多年後他對這兩個角色非常滿意。","ex":"《VII》瑪莉貝爾、《IX》桑迪。","ask":"我的角色被測試玩家討厭時，是角色有問題，還是需要時間？","page":"p.94–96"},{"id":"H-050","title":"選擇沒有唯一正解，每條路都是那位玩家的主線","cat":"事件","rule":"設計選擇時，要站在各種玩家的心情去寫。選 A 的玩家就讓他在 A 的舞台自由演出，選 B、選 C 的也一樣；每一條劇本都不能偷懶。","why":"對玩的人來說，他走的那一條就是唯一的主線。","ex":"《V》的結婚：作者原本以為大家都會娶青梅竹馬碧安卡，但覺得不會每個人都選同樣的人生，所以讓芙蘿拉（和 DS 版加入的德波拉）也能自然地被選。問卷結果芙蘿拉比想像中受女性歡迎；他推測女性玩家對「仗著青梅竹馬身分」的碧安卡有反感。他刻意加了碧安卡夜裡吹風的場景，稍微偏袒她，反被女性玩家說「太會算計」。重製版加德波拉，是因為結婚對象加一人只要追加台詞，成本最低。","ask":"我的每一個選項，都準備了一樣用心的劇本嗎？","page":"p.97–99"},{"id":"H-051","title":"要的是「一起煩惱」，不是對錯","cat":"事件","rule":"把難以抉擇的選擇放進故事，重點是讓玩家和作者一起煩惱，而不是讓故事大幅分歧。","why":"作者認為《勇者鬥惡龍》與其說是寫劇本，不如說是「一起煩惱看看」，這是他今後也想延續的方向。他也想用好的方式辜負玩家的期待，甚至被自己創造的角色辜負；就像漫才捉弄觀眾，旁觀者突然被拉上台、被迫選擇。","ex":"《XI》人魚羅蜜亞：她的戀人五十年前就死了，要不要說出真相？說謊，她會繼續等下去；說真話，她會捨棄尾鰭去確認，然後化成泡沫消失。不管選哪個，對劇情進行都沒有大影響，完全交給玩家的價值觀。","ask":"我的選擇題，玩家會認真煩惱，還是一看就知道哪個是對的？","page":"p.100"},{"id":"H-052","title":"不可挽回的選擇，讓人認真煩惱","cat":"事件","rule":"在故事中放進「選了就回不去」的分歧，讓玩家認真思考；真正的煩惱會直接連到作品的深度。","why":"作者想表現「世上有些事無法挽回」。真實人生就是一連串的分岔，每天都在迷惘；重大決定的那一刻，遊戲也能稍微表現。不論選哪一邊，玩家都會認真想過，和作者共享這段劇本，這就是深度。不過這種不可挽回的分歧，剛推出時頗受批評。","ex":"《VII》奇比：牠被席布爾飼養，因外型像沙德沃姆，鎮民要求退治。退治奇比，鎮子會滅亡；不退治，奇比會犧牲自己保護鎮子，鎮民才醒悟並把牠當英雄傳頌。《VII》雷布雷薩克：很多人都相信了謊言，只有孩子們是光，作者想透過孩子寫犧牲與竄改歷史的不合理，《VII Reimagined》則加入了救贖。《VI》阿莫斯：要不要告訴他變身成魔物的真相？說了他會離開、再也不見；不說他會留下，但心裡不舒坦。","ask":"我的遊戲有沒有一個讓玩家通關後還會想「當時這樣選對嗎」的選擇？","page":"p.102–105"},{"id":"H-053","title":"沉重之後要有明亮","cat":"事件","rule":"一直沉重，玩的人心情也會變沉；所以要穿插明亮的小故事。","why":"反過來說，有明亮的場面，悲傷的場面才會更突出。連續劇也一樣，大喜之後一路跌落，這種落差才是故事。","ex":"作者處理不可挽回事件時的做法。","ask":"我的劇情曲線，有沒有讓玩家喘口氣的地方？","page":"p.105"},{"id":"H-054","title":"重製不只是移植，要補回當年做不到的","cat":"心法","rule":"重製舊作時，可以大膽修改，把當年因限制做不到的事件、台詞、角色補回來；但大綱要沿用原作。","why":"《I》當年只有 64KB，只好拿掉很多要素，改成一個人的旅程、一對一戰鬥，但仍留住 RPG 有趣的精華；這份單純在當時對多數沒玩過 RPG 的人來說，反而比較好懂。HD-2D 版《I&II》如果照原樣移植，會和濃厚的《III》落差太大，所以大量增加事件與場所，幾乎像新作。地點和劇情有時是先有地點再補故事，有時是為了劇情需要才加地點，兩種都有；收集要素變多，也需要更多放道具的地方。","ex":"重製版加入了蘿拉公主被抓的事件、摩恩柏克陷落的場面；新增的悲傷死亡也讓故事更深。也讓玩家可以從《I》或《II》任選一邊開始。","ask":"我在重做舊作品時，是在原樣搬家，還是在補完當年的遺憾？","page":"p.106–112（對談③）"},{"id":"H-055","title":"劇本需要一個「狂言回し」","cat":"角色","rule":"劇本裡有一個「狂言回し」（負責推進劇情、說明狀況的角色）會好寫很多。他在關鍵時刻出現說明狀況，或替玩家說出心聲，等於取代旁白，專心當推進者。","why":"有了狂言回し，劇本會更好懂。這是非常好用的位置。","ex":"《VIII》特羅德王最典型，常在各種場面唐突出現；作者還為此寫了揚加斯那句「大叔，你什麼時候來的！？」並配了圖。《IV》瑪妮亞會不顧後果說出突兀的話，其實也會告訴玩家該做什麼，是親切的角色。《V》的桑丘負責給建議。《VII》瑪莉貝爾任性、毒舌吐槽、讓故事順暢前進，是理想的狂言回し。《IX》桑迪負責吐槽，被罵「把辣妹放進 DQ 太離譜」，但作者說她是好孩子。《怪物仙境 3》貝涅特是開朗的魔法研究者，負責說明和驚訝。作者筆下有魅力的女性角色，幾乎全員兼任狂言回し。","ask":"我的遊戲裡，誰在幫玩家說出「這是怎樣？」誰在說明現在發生什麼事？","page":"p.114–117"},{"id":"H-056","title":"先決定主角，再配夥伴的平衡","cat":"角色","rule":"決定夥伴陣容時，先定主角和關鍵角色，再為新系統指定狂言回し，最後看平衡決定其他人。","why":"《VII》先決定主角與王子兼青梅竹馬的基法，再為了夥伴對話系統請瑪莉貝爾擔任狂言回し，然後考慮平衡決定下一位夥伴。《怪物仙境 3》的皮薩羅與羅莎莉偏陰暗，作者覺得需要一個開朗角色讓故事好動，於是讓貝涅特同行。","ex":"《VII》、《怪物仙境 3》。","ask":"我的夥伴裡，個性有沒有互補？有沒有一個讓氣氛變亮的人？","page":"p.116–117"},{"id":"H-057","title":"主線與支線要緊密相連，支線用來回答疑問","cat":"企劃","rule":"支線要和主線緊密連結，並且預留讓玩家想去走的岔路。支線的好用途，是回答主線留下的疑問。","why":"玩家會一直有疑問：這個人為什麼在這裡？他和那個人有什麼過去？用支線回答，主線就有厚度。支線彼此也有關聯、還有牽涉過去的台詞，所以要建立正確的背景設定，任何順序問到都要成立，這很麻煩但非做不可。寫完支線後要一讀再讀，抓出劇本上的 bug。","ex":"《VI》米蕾優為什麼和穆德並肩作戰、為什麼在葛蘭瑪茲身邊、和弟弟泰瑞有什麼過去，都由支線回答。《VII》一邊增加夥伴，一邊構築每個人入隊的小故事；他覺得加坡的故事應該放在主線最開頭，艾菈的伏筆也該早一點。","ask":"玩家在主線裡會冒出哪些疑問？我有沒有用支線去回答？","page":"p.118–121"},{"id":"H-058","title":"角色的謎不要百分之百解開","cat":"角色","rule":"角色的謎團不要全部解開，留一點未解決的東西比較好。","why":"神祕感消失的角色缺乏魅力；現實中也不可能百分之百理解一個人。留下的謎，玩家會自己去想、去享受。","ex":"《VIII》主角原本只是村裡的少年，作者覺得只是普通少年故事收不起來，就加了很多隱藏設定。鳥山明在主角身上順手畫了一隻老鼠，作者就給牠取名托波，還做了用老鼠視角前進的事件；鳥山說想畫村人，村人也受鳥山插圖影響。","ask":"我的角色有沒有留下一點讓玩家自己想像的空白？","page":"p.121"},{"id":"H-059","title":"台詞以三行為基準，用限制當優勢","cat":"台詞","rule":"盡量不用長台詞。訊息窗基本上是三行，但可以只用兩行或一行；把字數限制反過來當成優勢。","why":"作者曾想當漫畫家，把台詞當成對話框裡圖像的一部分，很重視文字的視覺感。初代只能用平假名和少數片假名，不加讀點是因為難看，所以用空白斷句，連換行位置都講究；與其說是文法，不如說是為了好讀。","ex":"初代《勇者鬥惡龍》的空白斷句。","ask":"這句台詞能不能縮成兩行？縮掉的部分真的需要嗎？","page":"p.122–123"},{"id":"H-060","title":"不寫「接話式台詞」，故事靠省略之美","cat":"台詞","rule":"少用只是依序回應上一句的「接話式台詞」。日常對話能成立交流，但產生不了戲劇；故事要靠省略之美。","why":"「今天天氣真好」「對啊，真好」只是普通對話。改成「今天天氣真好」「我比較喜歡下雨」，或回一句讓人想起過去的話，玩家就會好奇兩人是什麼關係。同樣地，對「我喜歡你」回「我也喜歡你」只是普通情侶，回「你又要騙我了嗎？」就讓人在意了。","ex":"教堂裡兩個人的對話。","ask":"這段對話裡，有沒有一句讓玩家想問「咦？什麼事？」","page":"p.123–124"},{"id":"H-061","title":"熱鬧的路人可以多，重要的話只給少數人","cat":"台詞","rule":"配置村人時先想每個人是什麼關係、在聊什麼，再想怎麼牽到主線。熱鬧用的村人可以多，但重要資訊只交給少數人。","why":"現在城鎮畫面變大，人少會顯得空蕩，所以要放很多熱鬧用的村人；但所有人都講重要的話，寫的人和讀的人都累。作者把重要的話交給粉紅色對話框的人，只看他們的台詞故事也能前進；但就算是他們，太長的台詞玩家也不會讀，所以長度要非常小心。","ex":"作者用《怪物仙境 Joker》所長室的開場台詞示範壓縮：保留下令、交付道具、催促出發，刪掉重複的解說。","ask":"玩家只跟「重要的人」說話，能不能順利推進？那些人的台詞夠短嗎？","page":"p.124–127"},{"id":"H-062","title":"決定性台詞、廣告詞、形象三者先備其二","cat":"角色","rule":"創造角色時，決定性台詞和廣告詞很重要。廣告詞、形象、決定性台詞三者，至少先決定其中兩個。","why":"先後順序因角色而異：有時先有廣告詞，再長出形象和台詞；有時先想到決定性台詞，再長出視覺；也有三者同時成形的。三者齊備越多，遊戲中越能自由地讓角色玩，角色自己動起來就贏了。","ex":"《劍神》的賽蒂雅，作者先定下一定要用的廣告詞「絕對領域」，連台詞特徵都先決定，再把形象畫成草圖交給鳥山明，作者自己很喜歡，鳥山似乎不太滿意。同作的迪恩幾乎不說話，全靠一句決定性台詞「Bravo」立起來；《VIII》潔西卡的「哥哥對我說過，要走自己相信的路」也是。","ask":"我的主要角色，各有一句玩家會記住的台詞嗎？","page":"p.128–131"},{"id":"H-063","title":"有人氣潛力的角色，要讓她走得更遠","cat":"角色","rule":"看出角色有成為人氣角色的要素時，就把它徹底做足，讓她承擔更多劇情。","why":"潔西卡是雙馬尾、有點兄控的角色，作者覺得她會受歡迎。中盤她拿到敵人的手杖、被詛咒而和主角對峙，有了這段曲折，3DS 版才加入特殊條件下可以和她結婚的結局，作為一種獎賞。","ex":"《VIII》潔西卡。","ask":"哪個角色是測試玩家最常提到的？我有沒有給她更多戲份？","page":"p.131"},{"id":"H-064","title":"用章節讓每個夥伴先有自己的人生","cat":"企劃","rule":"要放很多夥伴時，可以一人一章，先讓玩家體驗每個人的人生，最後再把他們集合起來，這樣感情投入會更深。","why":"《III》大受歡迎、成為社會現象，《IV》的壓力非常大。《III》的夥伴是酒場湊來的，作者想讓夥伴也有自己的人生；但突然集合一群陌生人不會有感覺，所以改成一章一人，先讓玩家經歷他們的人生再集合。","ex":"《IV》第一章萊恩一人旅行很辛苦，作者就讓霍伊米史萊姆陪他，並安排洞窟中傳來「往這邊走」的聲音，原來是霍伊米在引路。霍伊米說想變成人類，是事後才想到的，所以第五章他真的變成了人類。","ask":"玩家認識我的夥伴，是在他加入那一刻，還是之前就有機會了解他？","page":"p.132–133（對談④）"},{"id":"H-065","title":"刻意出其不意，連章節順序都要翻轉","cat":"企劃","rule":"每一章都要想辦法出其不意；連角色出場、相遇的順序都可以用來翻轉玩家預期。","why":"第二章是三人隊伍，作者想做成像時代劇《水戶黃門》那樣，但主角是艾莉娜，還出現假艾莉娜；武術大會最後以不戰而勝收場。第三章托魯內可篇是他最喜歡的：不是打工，而是自己開店的流程，和一般遊戲完全相反，例如由玩家問客人「這裡是武器店嗎？」。第五章遇到夥伴的順序，照常理應該先遇萊恩，那就太沒變化，所以讓瑪妮亞先登場。","ex":"《IV》各章；托魯內可篇在打工時大量買下破邪之劍帶到第五章，可以賺到大錢，這是作者刻意放的小技巧。","ask":"我的遊戲裡，有沒有一段流程和玩家熟悉的完全相反？","page":"p.134–136（對談④）"},{"id":"H-066","title":"參數也是作者寫的「劇本」","cat":"系統","rule":"怪物參數、遭遇參數、升級參數、咒文、商店、道具價格、寶箱內容這些「參數」的內容，幾乎都由作者一人填；他把這當成和寫劇本一樣重要的工作。","why":"參數的規格到《VII》大致完成，是和開發公司的工作人員一起不斷討論定下來的。劇本寫完後，作者大約花兩個月製作這些參數。","ex":"本書第三部首次公開 PS2 版《V》實際使用的參數表。","ask":"我是把數值當成雜事交給別人填，還是當成設計的一部分親自寫？","page":"p.141–142"},{"id":"H-067","title":"數值靠感覺定，再用試玩反覆調","cat":"平衡","rule":"數值要先填進去，再一次次試玩、調整。速度、攻擊、防禦、最大 HP、經驗值、金錢這類會直接影響遊戲平衡的數值，要特別小心。","why":"掉寶率這類數字「感覺」就好，看起來是沒意義的細微差別，但體感差很多，作者希望讀者感受到他微調數字的用心。最大 HP 用的是上限值，實際值在 85% 到 100% 之間亂數決定，因為三隻史萊姆打出完全一樣的傷害就太無聊了。","ex":"「這隻目前太強，攻擊力降 3，速度也調慢」。速度很重要，因為誰先攻擊會讓平衡差很多；角色升級後速度提高，戰鬥就變輕鬆。調整這些數值很花時間，是作者最重視、絕對不能跳過的步驟。","ask":"我的平衡是試玩調出來的，還是算一算就定案了？","page":"p.144–146"},{"id":"H-068","title":"用「動物、人類、神」三級表現怪物的聰明程度","cat":"系統","rule":"怪物的聰明程度可以用很簡單的分級表現：「動物」不看狀況照樣行動，「人類」會依情況改變做法，「神」在行動直前看最新狀況再決定。","why":"例子是封咒文：動物型怪物 MP 用完也會唱咒、被封印也照唱；人類型會判斷不行就改用別的攻擊；神型在自己行動前才決定，所以不會做白工。要表現更像人的思考，就要想用什麼數字來表現：怪物會一直唱咒文，那就先封印它，封印成功後它就該改用別的攻擊。只要有數字，就能做出各種性格。","ex":"同伴角色和非敵對 NPC 的 AI 全部是「神」。最終頭目卻刻意設成「動物」，偶爾會無意義地唱「冰凍之波」，讓玩家有機會重整態勢；最終戰很長，這樣比較有隨機性，戰鬥也更好玩。","ask":"我的敵人「會不會判斷狀況」？有沒有一隻是刻意設定得笨一點的？","page":"p.146–153"},{"id":"H-069","title":"一個參數就能做出「討厭的怪物」","cat":"系統","rule":"小小一個參數，例如「是否集中攻擊同一人」，就能做出一隻讓人印象深刻、很討人厭的怪物。","why":"集中攻擊的怪物，會一直攻擊同一個隊員直到他倒下，玩家一下就會想起「啊，就是那隻！」。但做太多，被集中攻擊的人很容易戰鬥不能，所以要拿捏。同樣地，「自然回復」讓怪物每回合恢復一定量，一定要每回合打出相當傷害才打得倒；「閃避率」能給怪物「很會躲」的個性。","ex":"集中攻擊、自然回復、閃避率等怪物參數。","ask":"我的每隻頭目，有沒有一個讓玩家記住它的特殊習性？","page":"p.150–152"},{"id":"H-070","title":"行動選擇也有個性：多數平均，少數偏好","cat":"系統","rule":"怪物選擇行動的方式本身也是個性。大多數怪物用平均或微幅偏好的表，少數怪物用非常極端的行動偏好。","why":"約八成怪物採用「平地」（六種行動幾乎平均）或「坡」（越前面的行動越容易被選）。剩下兩成採用特殊模式，例如「崖」，第一種行動約八成機率被選，霍伊米史萊姆就是代表，因為牠一直唱回復咒文。","ex":"《V》的怪物行動模式表。","ask":"我的怪物裡，有沒有「一直做某件事」而讓玩家一眼就懂的類型？","page":"p.154–155"},{"id":"H-071","title":"數字就能讓怪物「被看穿」，所以要設計得能被看穿","cat":"系統","rule":"怪物參數做得好，玩家光看數字就能想像牠的行動；可以用參數設下讓玩家「中計」的小陷阱，但對夠聰明的 AI 來說陷阱會被識破。","why":"作者曾做過一隻一直唱咒文的怪物，被封咒後會改用物理攻擊，而牠的物理攻擊其實非常強，玩家封了咒反而吃苦頭。但夥伴改由 AI 操作後，這種陷阱就失效了，因為聰明的 AI 會看穿。","ex":"「咦，我封了它的咒文，結果更慘」這種陷阱。","ask":"我的陷阱設計，會不會讓 AI 夥伴或熟練玩家一眼看穿而失效？","page":"p.158"},{"id":"H-072","title":"不要讓同一群怪全部用全體攻擊秒殺玩家","cat":"平衡","rule":"「群組控制」這類規則是後來補上的：同一群怪物中，只要一隻已經用了全體攻擊，其他同伴就不再用。","why":"如果一群怪全部唱「基拉」，玩家馬上瀕死。加上這種臨機應變的規則後，怪物個性也更有變化。","ex":"《IV》以後的群組控制參數。","ask":"我的敵人群體會不會在同一回合把玩家打到無法反應？","page":"p.159–163"},{"id":"H-073","title":"66% 的有效率，讓人覺得「一半」","cat":"平衡","rule":"機率的設定以玩家體感為準，而不是數學上的正確。","why":"作者原本想把輔助咒文的有效率設在 50% 左右，但玩家實際的感受比一半還低，因為人對失敗印象特別深；所以刻意把設定值調到約 66%，讓玩家「感覺」大約一半有效。復活咒文也同樣是 66%。輔助咒文表裡耐性 0 與 1 都是 100%，是為了保留之後調整的空間。","ex":"咒文耐性參數表。","ask":"我寫在企劃書上的機率，和玩家實際感受到的一樣嗎？","page":"p.166–169"},{"id":"H-074","title":"怪物的數字，就是牠的劇本","cat":"系統","rule":"只靠數字，就能讓怪物的性格大幅改變；這和「讓角色立起來」是同一件事。","why":"寫完劇本後，作者把每隻怪物的「耐性」「群組控制」「知能」轉成具體的行動，一格一格填進參數表。數字的設定決定了怪物在劇本中的存在感，也決定玩家對牠的印象。到《VII》為止都是作者親自做，現在交給怪物組。","ex":"《VII》以前的參數由作者一人完成。","ask":"我的怪物數值，有沒有承擔「讓玩家記住牠」的工作？","page":"p.170"},{"id":"H-075","title":"重製時大膽取捨，讓支線變成選擇","cat":"心法","rule":"重製舊作時，可以把非主線的支線從「必經」改為「可選」，讓節奏更好；但原作「不合理」的味道可以保留。","why":"《VII》原版分量太多，開發團隊希望重構非主線的劇情，作者監修後讓它更精簡。石版收集原本每個台座都要填滿，重製版改成即使不全填也能看到結局，但通關後想解鎖全世界的人還是能去玩。原作中村人為了自己方便竄改歷史、沒有救贖的故事，他不打算全部改掉，因為那也是《VII》的味道；部分分歧加入救贖，則是為了符合現代。","ex":"《VII Reimagined》刪掉三個小故事，讓「必經」變成「自由選擇」；基法重新以大人姿態登場，並歸還種子。","ask":"我的遊戲有沒有一段「必須走完」其實可以改成「想走再走」的內容？","page":"p.171–173（對談⑤）"},{"id":"H-076","title":"戰鬥要做到在後面看也好看","cat":"系統","rule":"戰鬥演出要做到玩家只是在後面看，也覺得好玩、節奏舒服。","why":"現在很多玩家用 AI 自動戰鬥，所以戰鬥必須在「旁觀」時也有樂趣。《VII Reimagined》的開發團隊在這方面下了很大工夫，戰鬥節奏也很好。","ex":"《VII Reimagined》的戰鬥演出。","ask":"讓我的遊戲自動戰鬥十分鐘，旁觀的人會不會無聊？","page":"p.177（對談⑤）"},{"id":"H-077","title":"真正的隨機會讓玩家覺得不公平，要加一層濾網","cat":"平衡","rule":"遇敵這種隨機機制，不要用完全不修正的「純隨機」，要加一層讓結果平均的濾網。","why":"純隨機的偏差很大，可能連續遇敵、遇到同樣的怪群，這會讓人膩，應該避免。所以他在決定步數時再加一層，例如用「常態分布」的骰子，讓步數多半落在中間，減少遇敵太集中或太單調。","ex":"基本遇敵率大約每 30 步一次；再依區域乘上 25% 到 200% 的倍率，讓不同區域有輕重之分。","ask":"我的隨機系統，玩家會不會因為「運氣太差」而覺得被耍？","page":"p.178–182"},{"id":"H-078","title":"一開始就連續遇敵，是最不能接受的","cat":"平衡","rule":"剛開始移動時，不要讓運氣差的玩家一走就遇敵、連續兩三次遇敵。","why":"原本是每走一步都判定一次遇敵，運氣差的人第一步就會遇到；一次還好，連續兩三次就太過分了。所以改成先決定「走幾步之後一定會遇敵」，在那之前不會遇敵。","ex":"遇敵判定方式的修改。","ask":"玩家剛開始冒險的前五分鐘，有沒有可能因為運氣差而一直被打斷？","page":"p.182"},{"id":"H-079","title":"難度調整要靠戰鬥模擬，不靠表格","cat":"平衡","rule":"一場戰鬥最後出現幾隻怪，有兩個關鍵：畫面放不放得下（表示調整），以及用實際數量模擬戰鬥看難度是否合適（難度調整）。難度調整不能只靠表格。","why":"同樣是 2、7、3 隻的組合，可能強得超出預期，也可能讓玩家太輕鬆，平衡一崩就失敗了。所以要用程式模擬實際戰鬥來確認，這一步不能偷懶。","ex":"體型大的怪物多隻同時出現時，畫面放不下，要減量。","ask":"我的遭遇組合，有沒有實際打過最糟和最輕鬆的情況？","page":"p.188–189"},{"id":"H-080","title":"區域等級：讓玩家一看就知道自己能不能逃","cat":"平衡","rule":"給每個區域一個「區塊等級」，代表這裡預設的玩家等級；同時用它決定能不能逃跑：玩家比區塊等級高 5 級以上，就能 100% 逃走。","why":"區塊等級是「預想隊伍中有誰、會遇到什麼怪」的指標；也讓玩家一眼判斷自己比這裡強還是弱。作者說最辛苦的是「怪物分配」：區塊很多，怪物種類卻有限；每進新區塊就換怪，怪很快見底，所以要一點一點換，到了新大陸再一口氣換掉，這份工作近乎職人技。","ex":"區塊等級 18 的區域，預設玩家等級約 20 到 22。","ask":"玩家走到一個新地方，能不能大概感覺出「這裡對我來說危不危險」？","page":"p.190–193"},{"id":"H-081","title":"難度基準：在自己覺得簡單的平衡裡，取最難的那個","cat":"平衡","rule":"戰鬥平衡的基準，是作者在「自己覺得溫和、簡單」的平衡範圍裡，選出難度最高的那一個。","why":"每個人對難度的感覺不同，總要有人畫一條線。作者會考慮各種情況，自己玩到底；戰鬥平衡也跟塔或洞窟的難度有關。洞窟的設計是讓玩家打到最後時 MP 快見底，剛好打得到出口。","ex":"作者對自己遊戲的平衡方式。","ask":"我的難度基準是誰？是我自己、測試玩家，還是目標玩家？","page":"p.193"},{"id":"H-082","title":"特殊編隊讓遭遇有記憶點","cat":"系統","rule":"一般遭遇是隨機組合，但可以另外設計「特殊編隊」，讓某些組合一定出現，例如同一族群的怪物整隊登場。","why":"隨機組成的遭遇雖然多變，卻缺少印象深刻的場面；整隊的「科羅族」「金屬軍團」這種特殊隊伍，讓玩家有「哇，遇到這隊了」的記憶。也可以用區塊等級控制熟練度：在比自己低 5 級以上的區域戰鬥，熟練度就不會上升。","ex":"《VII》的金屬軍團設在區塊等級 33 的區域，給想練功的玩家去。","ask":"我的遭遇裡，有沒有讓玩家記住的「招牌組合」？","page":"p.194–197"},{"id":"H-083","title":"線上遊戲要讓輕度玩家也能玩","cat":"系統","rule":"線上遊戲不只為重度玩家設計，要讓人可以輕鬆上線、輕鬆下線，也能一個人玩到後面。","why":"作者自己不擅長和人組隊，玩其他 MMORPG 時常常一個人玩，等級一高就很辛苦。網路遊戲有「網路廢人」的負面印象，他希望找到讓人可以舒服下線的方法。於是想到「支援夥伴」：把自己的角色借給別人，對方用了你也高興，自己下線時角色也能幫人。這種輕鬆的人際關係，抓住了輕度玩家。","ex":"《X Online》的支援夥伴、元氣玉（30 分鐘內經驗值與金錢加倍）、兒童時段（2 小時免費遊玩）。","ask":"我的多人遊戲，一個人玩會不會很痛苦？玩家可以輕鬆離開嗎？","page":"p.200–203（對談⑥）"},{"id":"H-084","title":"偶爾回到原點","cat":"心法","rule":"一個系列走得很遠之後，回到原點也是一種新意。","why":"《IX》是掌機、《X》是線上，接連挑戰新東西後，《XI》決定回歸本道：主角一開始就是勇者，《XI》是繞一圈回到《I》的作品。在系列 30 週年時，把各種過去的元素放進去，讓老玩家「啊，是那個！」地回想。","ex":"《XI》從勇者出發，卻被當成罪犯關進牢裡；結局後的延續也是作者想做的「驚喜」。","ask":"我的作品有沒有一個地方，讓長期支持的玩家想起最初的感動？","page":"p.203–205（對談⑥）"},{"id":"H-085","title":"結局之後還有故事，是給玩家的驚喜","cat":"事件","rule":"在結局之後安排還能繼續的故事，可以是一份驚喜，但要讓在結局停下來的玩家也覺得完整。","why":"作者說在第一個結局停下來的人也可以，因為那是一個堂堂正正、很長的結局；之後再發現「原來還有」，是給繼續玩的人的驚喜。他喜歡時光旅行題材，所以放進這樣的元素。這不是假結局，而是一般結局與真結局。","ex":"《XI》第一個結局後還有延續的故事。","ask":"玩家在我的第一個結局停下來，會不會覺得被騙？繼續玩的人會不會覺得值得？","page":"p.204–205（對談⑥）"},{"id":"H-086","title":"讓 AI 夥伴有自己的作戰方式","cat":"系統","rule":"夥伴不聽玩家的話，反而比較真實；讓每個夥伴自己思考戰鬥行動，個性才會跑出來。","why":"《IV》是系列第一款夥伴全部由 AI 操作的遊戲，玩家只能下「作戰」指示。夥伴不是自己，有時候不照意思走，但作者覺得這樣才真實；夥伴在遇到主角之前已經走過很多世界，各有自己的歷史，自己決定行動很正常。結果意外地有趣，艾莉娜有艾莉娜的打法，萊恩也是。加入 AI 的另一個理由，是夥伴和咒文變多後，要玩家一一輸入四個人的行動太麻煩。他刻意沒有加入「命令」選項，結果誕生了只會一直唱「即死咒文」的克利夫特。","ex":"《IV》的夥伴 AI。","ask":"我的 AI 夥伴有沒有「他就是會這樣做」的招牌行為？","page":"p.207–208"},{"id":"H-087","title":"AI 用「危險指數」判斷敵人","cat":"系統","rule":"做夥伴 AI 時，先替每個敵人算出一個「危險指數」，AI 再依這個數字決定先打誰、用什麼攻擊。","why":"危險指數是把敵人的 HP、攻擊力、咒文、防禦力、特技能力等，粗略換算成「有多強」的數字。AI 比較所有敵人的危險指數，判斷怎樣攻擊最能降低危險，這在 38 年前是相當新的嘗試。夥伴 AI 有三個重點：依敵種決定攻擊手段、敵人多隻時先打誰、以及攻擊以外的輔助或回復要怎麼選。","ex":"《IV》紅白機版的 AI。","ask":"我的 AI 判斷目標時，依據的是什麼？玩家看得出它的邏輯嗎？","page":"p.208–209"},{"id":"H-088","title":"每個夥伴對敵人的「成見」不同，個性就出來了","cat":"系統","rule":"AI 本身沒有個體差異，要另外給每個角色一個「先入觀」（對敵人的成見）參數，讓同樣的狀況下不同夥伴做出不同判斷。","why":"如果萊恩和瑪妮亞想法一樣就很怪。所以給每個角色一點補正值，讓他們像怪物一樣各有知能與性格。先入觀是指角色相信某種咒文或特殊攻擊對敵人有效的程度；戰士萊恩和魔法使瑪妮亞的差別本來就大，所以先入觀的差異不一定看得出來。但這種角色差異的微妙設定很重要，可調整的參數有好幾個，在測試中一路修改。","ex":"《IV》七名夥伴與 NPC 都有自己的先入觀。實際上布萊的冰咒和瑪妮亞的火咒都 100% 有效，但布萊補正後認為只有 60%、瑪妮亞認為 80%。","ask":"我的 AI 夥伴面對同一隻敵人，會不會做出一模一樣的選擇？","page":"p.212–216"},{"id":"H-089","title":"AI 要從一開始「不太懂」，慢慢學會","cat":"系統","rule":"AI 對敵人的認識，不應一開始就完美，而是遇過之後才慢慢知道有沒有效。","why":"《IV》的夥伴第一次遇到敵人時其實不太清楚哪種咒文有效，相遇之後才逐漸明白。作者也研究過讓 AI 從敵人那邊學習，但成長太花時間，不實際。","ex":"《IV》夥伴 AI 對敵人的理解方式。","ask":"我的 AI 一開始就知道所有答案嗎？它的「學習」玩家感覺得到嗎？","page":"p.215–216"},{"id":"H-090","title":"王戰時偷偷切換到更聰明的 AI","cat":"系統","rule":"一般戰鬥的作戰模式應付不了頭目時，可以設一個玩家看不到的「對頭目」隱藏作戰，在王戰時自動切換。","why":"只用六種作戰很難應付頭目的特殊攻擊，也很難好好使用輔助咒文。隱藏作戰把輔助咒文的優先度調得很高；感覺敏銳的玩家會注意到，夥伴在王戰時突然大量使用平常不太用的輔助咒文。開發方針是：就算是頭目，只靠夥伴 AI 也能打得和一般戰鬥差不多、勢均力敵。","ex":"《IV》的「對頭目」作戰。","ask":"我的 AI 在頭目戰時，是不是還在用打雜兵的邏輯？","page":"p.217–218"},{"id":"H-091","title":"AI 的「蠢」也要算出來，再刻意保留一點","cat":"系統","rule":"AI 的失誤有時來自評分公式的漏洞；修正之後，也可以刻意保留一小部分原本的「蠢」，當作角色的個性。","why":"克利夫特一直唱「即死咒文」是因為：敵人 HP 200，即死咒文成功率 30% 就能一次歸零，評分是 200×0.3=60，高於物理攻擊的 30，所以一直選它。但實際上即死咒文常常無效。他們討論過讓敵人那邊說「試試即死咒文吧」，但太取巧；也想過讓 AI 從經驗學習，但成長太慢、不實際。正因為有過這段辛苦的時代，夥伴 AI 才一路進化。重製版的克利夫特變得很聰明，幾乎不唱即死咒文，但這樣就不像克利夫特了，所以讓他保留 1/4 的機率唱。","ex":"《IV》克利夫特與重製版的修正。","ask":"我的 AI 有沒有一個玩家會拿來開玩笑、卻又捨不得改掉的習慣？","page":"p.219–221"},{"id":"H-092","title":"地城的理想難度：「好難，但我解開了」","cat":"平衡","rule":"地城的理想，是讓每個玩過的人都覺得「好難喔，但我解開了，別人不知道怎麼樣」。難度大概是「作者自己覺得簡單」的程度剛好。","why":"如果所有人都這樣覺得，那就是理想的地城難度；做得太難就不行了，勉強能解開最好。作者覺得簡單的難度剛好，製作者覺得難時，玩家幾乎解不開。早期地城都是作者親自做，後來分工後交給工作人員，出現了很多拼圖式的機關，有不少玩家卡關、說「太難了」，作者覺得這是本末倒置，後來就把這類機關拿掉了。","ex":"《IV》到《VII》的地城機關比較複雜；《XI》的地城就比較少難題。","ask":"我的地城，是做給「我」覺得好玩，還是給「玩家」覺得自己很厲害？","page":"p.222–223（對談⑦）"},{"id":"H-093","title":"讓會迷路的地方有人帶路","cat":"系統","rule":"在玩家容易迷路的地方，安排一個帶路的角色或聲音，把迷路變成角色的特色。","why":"作者假設 RPG 新手也會玩，所以每個地方都盡量寫得易懂。萊恩的章原本預定一直一人冒險，但覺得太辛苦，就讓霍伊米加入當回復角色；霍伊米會在洞窟中說「這邊喔」引路，也是想出其不意。洞窟通常會讓人迷路，這裡卻刻意不讓人迷路，信不信帶路的聲音由玩家決定，作者很喜歡這個點子。","ex":"《IV》萊恩章的霍伊米；《XI》和《VII》的裏地城也有「那邊不對喔」的台詞。","ask":"我的遊戲在玩家迷路時，會不會有角色自然地提示方向？","page":"p.223–224（對談⑦）"},{"id":"H-094","title":"裏地城是例外：可以很難，但要有變強的確認點","cat":"平衡","rule":"本篇的地城要簡單，但結局後的裏地城可以做得很難；它的功能是讓練功的玩家確認自己變強了。","why":"裏地城本來就是給想挑戰的人；即使練到滿級，頭目也不好打。頭目「要在幾回合內打倒」這類條件，作者自己也不擅長，但他認為需要一個讓玩家確認角色變強的地方。","ex":"《V》第一次加入結局後的裏地城；《II》的隆達爾奇亞號稱系列史上最難關，到處是落穴和迷宮；PS 版《IV》的裏地城難度很高，但能讓德斯皮薩羅成為夥伴，很多人因此去玩。","ask":"我的遊戲有沒有一個讓練到最強的玩家「秀肌肉」的地方？","page":"p.224–225（對談⑦）"},{"id":"H-095","title":"開場的不安：主角不是勇者，就要早點讓人認識他","cat":"台詞","rule":"主角不說話，所以要靠周圍人物的台詞，盡早把主角的個性和處境傳達給玩家。","why":"《IV》第一章萊恩是開場，作者花了很多工夫讓周圍的台詞透露萊恩的性格和特徵。主角不是勇者，只是戰士，還被說有點笨拙；不早點讓玩家知道他的事情，玩家就很難進入故事。萊恩本人不說話，就用周圍的台詞把角色立起來。作者也說明為何先單人再組隊：《III》大賣後，很多沒玩過 RPG 的人也會碰《IV》，一開始就多人隊伍會很辛苦，所以先從一人開始。","ex":"《IV》萊恩章開場的劇本（DS 版）。","ask":"我的主角沉默時，玩家怎麼知道他是什麼樣的人？","page":"p.226–227"},{"id":"H-096","title":"劇本的開關：用「目標」控制進度","cat":"系統","rule":"劇本進度可以用一個具體目標鎖住：達成目標，下一段才解鎖。","why":"《IV》第三章托魯內可篇以賺錢為主題，作者想讓玩家馬上理解這是「靠打工賺錢」的特別遊戲，所以讓托魯內可的目標是蓋橋、修洞窟；為了這個目標必須存錢，存到才解鎖劇情，他第一次用這種機關。他也讓玩家可以在武器店把客人賣來的破邪之劍大量買下，帶到第五章高價賣出。","ex":"《IV》托魯內可篇的商店劇本與分歧選項。","ask":"我的劇情鎖，是讓玩家想去達成，還是只是擋住他？","page":"p.230–235"},{"id":"H-097","title":"不同的載體，劇本寫法也要不同","cat":"台詞","rule":"劇本的寫法要配合遊戲的載體：地圖、移動方式、玩家怎麼玩都不同時，劇本結構也要跟著變。","why":"《勇者鬥惡龍 Walk》幾乎沒有世界地圖，雖有和 GPS 連動的地圖，但它不像一般地圖那樣能承擔機關，也不適合角色走動的事件；所以改成以多人對話推進的劇本，以史萊米奇擔任狂言回し兼引導者。","ex":"Walk 第 6 章第 1 話開場用了一句當年流行的電影台詞，因為與第 5 章間隔太久。","ask":"我的遊戲平台（手機、主機、VR）適合什麼樣的敘事方式？","page":"p.236–240"},{"id":"H-098","title":"文章要簡潔，而且要有戲劇性","cat":"台詞","rule":"作者審稿時的標準是：刪掉不需要的部分，修正台詞，文章要盡量簡潔，同時要有戲劇性。","why":"他會請助理一起寫劇本，但要助理把他的口吻、話的展開、寫法的習慣放進去；最終劇本完成前會仔細檢查，有時大幅重寫，因為最後是以他的作品發表。他說這次的修改不是絕對的，但劇本是《勇者鬥惡龍》的本質要素。","ex":"HD-2D 版《I&II》的羅雷西亞王對話與摩恩柏克城劇本，原案與修正稿並列，粉紅是刪除、黃色是修正。","ask":"把我的劇本刪掉三成，故事還會完整嗎？會不會反而更有力？","page":"p.240–253"},{"id":"H-099","title":"重點是「讓玩家舒服地被引導」","cat":"心法","rule":"作者認為他做遊戲的本質，是「從遊戲內部操控玩家」，讓玩家舒適地玩下去。","why":"早期冒險遊戲多是玩家自己輸入文字、電腦回應的單純反覆；作者在《港口鎮》《鄂霍次克》首次做出「讓玩家能主動行動、同時被遊戲控制」的狀況。他用「兩支箭」說明：第一支箭，是讓玩家確實走在軌道上、被引導到各處調查；第二支箭，是電腦主動降臨的事件，例如電話突然響起、證物突然寄到旅館，讓玩家「咦！？」地吃驚。他是娛樂工作者，總想著怎麼嚇玩家、怎麼讓玩家滿足。","ex":"《鄂霍次克》中警方突然用無線電聯絡、旅館突然寄來證據照片；《II》的摩恩柏克公主被變成狗、薩瑪托利亞王子一直擦身而過，都承接了這種手法。","ask":"我的遊戲裡，玩家主動探索和遊戲主動驚嚇，比例是多少？","page":"p.254–261（對談⑧）"},{"id":"H-100","title":"基本是王道","cat":"心法","rule":"要做能延續的作品，就走王道；「每次都要打倒魔王」對作者來說是好事。奇招只能用一次。","why":"一開始就會冒出「別人已經打倒魔王了」「主角其實就是魔王」這類奇招，但不被這些誘惑、把「我是勇者，要打倒魔王」這條王道寫得有趣，才是真本事。就像刑事劇最後都是抓到犯人，模式卻千變萬化。既然是王道，主角努力的場面就要給足「做到了！」的成就感，玩完後的感動非常重要。現代光說「壞」已經沒人信服，魔王要做真正的壞事才算壞；魔王會意識到勇者，所以才會四處行動。","ex":"作者對系列「每作都打倒魔王」的態度。","ask":"我的作品有沒有被奇招誘惑？王道的部分寫得夠有趣嗎？","page":"p.265"},{"id":"H-101","title":"遊戲開頭最關鍵","cat":"企劃","rule":"玩家很任性，設計者的意圖他們不管，只在乎好不好玩。所以開頭非常重要，一開始就讓人覺得無聊，玩家就走了。","why":"開頭卡住，玩家就不玩了，不管後面多有趣都沒用；只要覺得「好累的遊戲」就結束了。很多遊戲以「再撐一下就好玩了」為由，讓玩家一開始先忍耐，玩家也習慣了，但這種自以為是的狀況是錯的。好玩的遊戲，就要想辦法讓玩家早點知道它好玩，這是設計者的義務。上手難，就已經不行了。","ex":"作者對所有遊戲開頭的要求。","ask":"玩家前十分鐘玩到的，是我遊戲最好玩的部分嗎？","page":"p.266"},{"id":"H-102","title":"清楚意識讓人享受的點","cat":"心法","rule":"要清楚知道自己想讓玩家享受哪裡，並多看各種作品，研究別人怎麼讓人開心。","why":"作者每週看三、四部連續劇，看到視角新穎的會很興奮。他覺得戲劇和遊戲有共通點：煩惱讓人享受哪裡、在哪裡入迷，劇本的起伏與轉折，思考方式很多是共通的。連續劇的結構和遊戲很像，有紮實的主幹，周圍散布幾個支線。創作的抽屜越多，越能把讓人享受的要素塞滿，抽屜的豐富度會影響深度。","ex":"作者看連續劇的習慣。","ask":"我最近看了什麼作品，從中學到怎麼讓人開心？","page":"p.267"},{"id":"H-103","title":"主角不說話，讓玩家成為主角","cat":"角色","rule":"《勇者鬥惡龍》的主角不說話，好讓玩家完全代入主角。","why":"人最大的樂趣是體驗不同於現在的人生；小說、電影是代入主角，遊戲則是自己操作主角，更能成為主角。主角明明是自己，卻講出自己沒想過的話，就會和主角疏離，所以主角不說話。作者曾想當漫畫家，所以用台詞推動故事、有時讓玩家真心煩惱，演出人生的各種戲劇；讓玩家走遍另一個世界，煩惱、下決定、享受精彩的冒險，是他的最終目標。","ex":"「人生就是角色扮演」。","ask":"我的主角講的話，會不會讓玩家覺得「我才不會這樣說」？","page":"p.268"},{"id":"H-104","title":"把麻煩的東西全部拿掉","cat":"心法","rule":"把自己玩其他 RPG 時覺得「難懂」「麻煩」的東西全部拿掉，就是一款新遊戲。","why":"《勇者鬥惡龍》就是這樣做出來的。他不否定其他設計者的想法，只是不在自己的遊戲用自己排斥的要素。他喜歡的《創世紀》《巫術》都很有趣、很創新，但也有很多難懂的地方，他會想「換我會這樣做」。這種負面經驗累積起來，就成了一種知識；有趣的是，遊戲因為有玩家在玩，才會一路進化。大家都有負面印象的部分，可以從別的遊戲裡挑出來改。","ex":"作者希望讀者也能從自己的不滿出發，做出新遊戲。","ask":"我玩別人的遊戲時最討厭的是什麼？我的遊戲有沒有同樣的問題？","page":"p.269–270"},{"id":"H-105","title":"失敗也會變強","cat":"系統","rule":"《勇者鬥惡龍》全滅時不會 Game Over，只是金錢減半、被輕輕責備一下，就能繼續；經驗值保留。","why":"一般想法是死了就 Game Over、從上次存檔重來。但這樣做，之後得到的經驗值也會消失，同樣的失敗重複下去，就永遠不會成長。只是錢減半、經驗值保留，死了也能一點一點變強。現在想來這可能是劃時代的設計：只要持續挑戰，就能把失敗當養分升級，總有一天跨過去。","ex":"《勇者鬥惡龍》的全滅規則。","ask":"玩家在我的遊戲裡失敗時，有沒有帶走任何東西？","page":"p.271"},{"id":"H-106","title":"自己變強了，世界也會變","cat":"平衡","rule":"讓玩家明確感受到「自己變強了」：怪物的參數固定不變，玩家升級就會變輕鬆。","why":"也有讓敵人跟著玩家一起變強、隨時都有挑戰性的做法，作者不否定，但那樣不管到哪裡都只是持續的「有挑戰」，完全沒有「自己變強了」的實感。他要的是「剛才苦戰的敵人，升級後再挑戰就輕鬆贏了」這種體驗；成長之後能去的世界變大，和世界的互動方式也不同。","ex":"《勇者鬥惡龍》怪物參數是絕對值。","ask":"我的難度會跟著玩家升級嗎？玩家有機會感受到「我變強了」嗎？","page":"p.272"},{"id":"H-107","title":"要讓一百個人都能玩到最後","cat":"平衡","rule":"目標是一百個人來玩，一百個人都能玩到最後。","why":"一百個人裡，有人覺得太簡單，也有人覺得太難。所以設計成卡住時只要升級、學會某個咒文就能過關；把劇情切成可以一天收尾的短篇；一天聽到的資訊盡量當天就能解開，不用把謎題帶到隔天，也不用記住複雜的資訊。他相信玩家要嚐到故事的結尾，才會被打動。對「太簡單」的意見，後來的作品加入了「綁手綁腳玩法」的選單，讓人自己決定難度。","ex":"《I》整體很短，故事一條到底；《IV》很長，所以做成每天玩兩三個小時就能完結的短篇集。《III》的埃吉培城、城裡的拼圖、淺灘的地點，就算卡住，只要練等學會開門咒文就過得去。","ask":"我的遊戲有沒有一個地方，會讓一部分玩家永遠過不去？","page":"p.272–274"},{"id":"H-108","title":"人情味會成為滋味","cat":"心法","rule":"作者一直在意的，是做一款溫暖、讓人興奮、而且有安心感的遊戲。","why":"所以他不做「死一次就無法挽回」的內容，要讓人安心地玩。人情味的部分，例如當一天國王、在旅店醒來發現沒人，這類讓人興奮的點子很多，再塞進許多讓人會心一笑的小插曲。《IV》沒加入「命令」，結果克利夫特一直唱即死咒文；這樣的人情味讓角色立了起來、成了遊戲的滋味，被大家記住，討不了厭的角色自己走起來是很好的事。","ex":"《IV》克利夫特。","ask":"我的遊戲裡，有沒有讓玩家會心一笑的小地方？","page":"p.274"},{"id":"H-109","title":"任性的夥伴更有人味","cat":"角色","rule":"遊戲裡和其他冒險者組隊，如果像真人一樣，意思不一定傳得到；夥伴不是自己，各有各的行動，會讓人焦急，但才有人味。","why":"《IV》是第一次挑戰夥伴 AI，所以刻意沒放「命令」，想讓 AI 夥伴也有感情。他也說未來 AI 進化後，角色可能會對玩家的命令抱怨，那樣大概也很煩人（笑）。","ex":"「喂，這裡要用回復咒文吧！」「拜託先加防禦啦！」的焦急感。","ask":"我的 AI 夥伴有沒有讓玩家又好氣又好笑的時候？","page":"p.275–276"},{"id":"H-110","title":"故事與自由度的曖昧關係","cat":"企劃","rule":"好的點子要自然到讓玩家不覺得厲害；自由度不是把故事拿掉，而是讓故事在玩家的遊玩中自然發生。","why":"《V》作者想做大一點、像人生一樣的故事，一開始想到「親子三代打倒魔王」，但每代換主角太普通、不好玩。於是主角不換，讓主角從小孩長成大人、成為父親，再和孩子一起打倒魔王。玩家自然地玩過這段過程，可能什麼也沒注意，但作者自負這個構想很劃時代。好點子就是要自然到不讓人覺得厲害，很多地方都融入遊戲裡。《V》又加入可選擇結婚對象的事件，大受好評。","ex":"《V》親子三代與碧安卡、芙蘿拉之爭（至今仍在吵）。","ask":"我最得意的設計，玩家會不會「自然到沒發現」？","page":"p.276–277"},{"id":"H-111","title":"讓成功體驗沁入身體，感動才熱","cat":"心法","rule":"從史萊姆開始打、累積經驗值、實際感覺到成長，越來越強，以前做不到的現在做得到；這些成功體驗累積起來，就是《勇者鬥惡龍》的世界。","why":"以前打不倒的敵人沒那麼強了，和夥伴一起經歷的事變成學生時代的回憶之一，就像有人真的覺得《V》的結婚典禮是自己的回憶。不只是沉浸感，遊戲的經驗也能在現實中派上用場；多年後還會想起「那時候真好」。他說現在常有人對他說「我是玩勇者鬥惡龍長大的」，他雖然害羞但很開心。現實的困難，把它當成遊戲裡的任務，就會想「一定攻略給你看」。","ex":"遊戲回憶和現實回憶幾乎等值。","ask":"玩家在我的遊戲裡累積的成功，能不能變成他們自己的回憶？","page":"p.277–278"},{"id":"H-112","title":"看不見前方的樂趣，是遊戲才有的醍醐味","cat":"事件","rule":"做劇本時，不只是排流程，而是用小惡作劇、出其不意的事件構成故事，這樣才好玩。","why":"《勇者鬥惡龍》的故事是王道，最後一定打倒魔王；但在那之前塞進什麼小故事，從小事件發想會比較好想。在頭目戰前插入預料外的事件、讓角色外表和內在有反差、放入打亂玩家預測的台詞，玩家會看不清前方、被出其不意而覺得有趣。仔細看他的作品，處處有意外和惡作劇，他想像大家撞見這些時吃驚的臉，非常期待。","ex":"作者作品中處處藏著惡作劇。","ask":"我的劇本，玩家能不能預測下一步？有沒有讓他「咦？」的瞬間？","page":"p.279"},{"id":"H-113","title":"讓數值模糊一點","cat":"平衡","rule":"讓玩家「感覺」舒服，比數字精確更重要。","why":"同樣是火焰咒文，怪物放的傷害比玩家放的低；作者一直想著怎麼做玩家才會覺得爽，一邊想一邊調數值。復活咒文設定上說一半機率，某些作品內部其實調到約 66%，因為他判斷玩家體感的「一半」就是這個程度。","ex":"「ザオラル」的成功率、怪物與玩家的同名咒文傷害差異。","ask":"我的數值，是為了公平而精確，還是為了好玩而調過？","page":"p.280–281"},{"id":"H-114","title":"虛擬侵蝕現實的一天","cat":"系統","rule":"玩家之間自發流傳的東西，常常不是設計者預期的；要留空間讓玩家「玩出意外」。","why":"《IX》因藏寶圖「まさゆきの地図」成為大話題，累計擦身而過超過一億人次、登上金氏世界紀錄，很多人帶著 DS 上街交換。作者原本以為大家會傳頌「打倒 95 級佐瑪的人」或「攻略地圖的人」，結果大家熱烈流傳的，是一張滿滿金屬王的地圖，完全沒想到。他覺得那時虛擬真的滲進現實了。","ex":"《IX》擦身通訊與藏寶圖。","ask":"如果玩家能互相分享，他們最可能分享什麼？我有沒有讓它變得容易？","page":"p.280–282"},{"id":"H-115","title":"親眼看別人玩","cat":"心法","rule":"做完遊戲後，親眼看玩家玩，找出他們卡住的地方。","why":"作者做完《港口鎮》後，在秋葉原店頭一直看試玩的客人。初期電腦版要玩家直接打日文指令，他已登錄很多詞，玩家仍會打出意料外的詞，搭檔就答不出來；他當場體會到用日文輸入很難。這促成了《鄂霍次克》的「單鍵指令選擇」，紅白機版《港口鎮》也改成指令選擇，玩家從「找詞」的苦差事中解放。","ex":"《VII》重製版也為玩家著想，把收集石板做得比較好找。","ask":"我最近一次在旁邊看別人玩我的遊戲，是什麼時候？","page":"p.282"},{"id":"H-116","title":"鬆鬆的感覺很棒","cat":"心法","rule":"只要好玩，什麼都可以放；鬆鬆的、好上手，正是好玩的原因。","why":"《勇者鬥惡龍》明明是奇幻，卻有現代元素、學園、賭場，就像主題樂園。《I》的概念是不看說明書也能玩，指令只用「說話」「道具」這種一看就懂的詞；不用想太深，按按鈕、跟人說話、跟敵人打，不知不覺就變強了。","ex":"《X Online》的旅人市集、大陸間鐵道、季節活動；《XI》的獎章女學園。","ask":"我的遊戲，不看說明書能玩嗎？","page":"p.283–284"},{"id":"H-117","title":"把對時代的天線伸到最長","cat":"企劃","rule":"對當下的事件和社會風氣保持敏感，從中找題材。","why":"作者自認很愛趕流行，受時代影響深。做《VI》時社會流行「尋找自我」，他就從這裡發想故事。《XI》的關鍵字是「夥伴」：四散的夥伴像磁力微弱的磁鐵球慢慢互相吸引、最後再次集結，也就是回歸王道並放進時代的口味。他也一直挑戰新東西，會失敗、會被批評，但不放棄地繼續挑戰的人，他認為都是「勇者」。主角會遭遇悲慘的事，但夥伴的羈絆一定穩穩的，這才是故事的關鍵。","ex":"《VI》尋找自我、《XI》夥伴。","ask":"我的作品主題，和現在社會的心情有什麼連結？","page":"p.284–285"},{"id":"H-118","title":"遊戲是溝通的工具","cat":"心法","rule":"玩家記得的不只是遊戲，還有當時跟誰一起玩、怎麼炫耀、怎麼被罵。遊戲能成為現實中的力量。","why":"升級或解謎時跟朋友炫耀、被哥哥拜託幫忙練等、最早發現祕密成為班上英雄、玩太久被爸媽罵，這些回憶和遊戲綁在一起。人生中大家都在扮演自己的角色，遇到很多辛苦；但遊戲裡的辛苦是可以克服的。他希望玩家現實不順時，能想起「這傢伙我打倒過」，好好想怎麼突破。說遊戲直接影響人生有點自以為是，但如果能碰觸到大家的人生，那是他的心願，也是遊戲的心願。","ex":"新作推出時，玩家會帶著當年的感情再碰一次。","ask":"玩家在遊戲外，會怎麼跟朋友聊我的遊戲？","page":"p.286–287"},{"id":"H-119","title":"膚淺的深度，不如沒有","cat":"系統","rule":"善惡數值這類「看起來有深度」的系統，如果只是薄薄一層，不如不要。","why":"以前很多遊戲放善惡要素：在鎮上偷東西惡值上升、打倒善良怪物善值下降、多付錢就更善。變成壞人就打聽不到情報、夥伴不肯入隊，甚至玩不完。如果是更有哲學性的問題，由玩家在情境中的行動決定善惡，也許會讓人感動；但只是附贈品般的善惡，玩家參數一變、鎮民台詞就跟著變，乍看有趣，玩的人只會不安。不過，如果遊戲本身就是專門玩這件事，玩家也明白並享受，那也許可行。","ex":"善惡參數的假想例。","ask":"我的隱藏系統，玩家真的感受得到，還是只是讓他們不安？","page":"p.287–288"},{"id":"H-120","title":"讓遊戲易懂是基本","cat":"心法","rule":"《勇者鬥惡龍》不變的要素之一，是「易懂」。不能讓玩家被丟下，要讓人安心地進入遊戲。","why":"指令仍維持平假名（最近有些改變）。代代相傳時，「易懂」的部分盡量不改；昔日相同的部分紮實地留著，其他地方改了，也能和舊印象連在一起。故事推進、戰鬥系統、怪物平衡、和夥伴的對話都一樣。玩到一半讓玩家冒出「咦？什麼啦？看不懂」這種不滿，要盡量避免；細部設計改了很多，但根本沒變，始終朝「易懂」前進。","ex":"系列一直維持的指令與介面方向。","ask":"我的遊戲改版時，哪些「易懂」的地方絕對不能動？","page":"p.289"},{"id":"H-121","title":"重要的事說兩次、三次","cat":"台詞","rule":"重要的事至少說兩次。玩家不會記得台詞，就算十頁前埋過伏筆也沒用。","why":"漫畫也一樣，讀者不會記得台詞，就算當伏筆也完全起不了作用；遊戲也是。「往北走有洞窟」只讓一個人說，玩家會忘記，所以要在很多地方讓好幾個人說。重要的台詞，在下一個鎮、別的地方和誰隨意聊天時也要一直讓人說；就算被玩家覺得「這我已經聽過了！」也沒關係，這樣大多數玩家才記得住。埋伏筆時也要有這種程度的細心。","ex":"「往北走有洞窟」這類情報。","ask":"我的關鍵情報，玩家在幾個地方會聽到？","page":"p.290"},{"id":"H-122","title":"繞路的樂趣是 RPG 的王道","cat":"企劃","rule":"《勇者鬥惡龍》不只鋪設世界觀，也完全鋪了一條故事的軌道，這樣比較好玩。但要大量準備「繞路」的要素：主軌道要有，但最好「不知不覺地」存在。","why":"作者自己的遊戲，繞路非常有趣。玩家要能「安心地脫離軌道」：在途中想「咦？是不是偏離軌道了？」，但又覺得「算了，再玩一下」，累積小冒險。想脫離就可以脫離，隨時又能回到軌道。與其一下子被丟進自由的荒野，不如從鋪好的軌道稍微偏離的地方，喊著「才不聽你們的！」，人反而更覺得自由。軌道要鋪，也要準備脫離軌道的樂趣。","ex":"《I》一開始就讓玩家看見最終目的地龍王之島，「那就是龍王之島，去打倒他！」，在當時是劃時代的手法。","ask":"我的玩家能不能安心地偏離主線？偏離後能不能找到回去的路？","page":"p.291–292"},{"id":"H-123","title":"不需要複雜的挑戰，也不用全部教","cat":"系統","rule":"不要一開始就教全部。教學只教必要的，讓玩家「大概懂了」的感覺去玩，玩著玩著就學會各種東西。","why":"作者最早寫程式時，以為要學會很多東西才行，結果只用了大概四個指令。他的第一款原創遊戲是《戀愛網球》，《港口鎮》的電腦版也幾乎只用這四個指令就做出來。他玩遊戲或做遊戲都是這種想法：教學也不全部教，一開始教太多，玩家會反過來覺得麻煩。簡單的部分說明就好，讓玩家覺得自己懂了。","ex":"INPUT、PRINT、IF～THEN、GO～TO 四個指令。","ask":"我的教學，有沒有在玩家還不需要的時候就教了？","page":"p.292–293"},{"id":"H-124","title":"讓玩家體驗自己的故事","cat":"企劃","rule":"遊戲是「自己去體驗的故事」，所以要在各處放下讓玩家停下來的鉤子。","why":"據說越來越多玩家習慣搭在故事軌道上，不享受煩惱，只想早點通關、往前推、不想思考。作者覺得如果有不用思考也能玩的遊戲，那也不錯；但他的作品是以「自己體驗的故事」來做的，玩家用那種態度玩，把軌道完整的劇本早早通關就往下一個走，他有點困擾，雖然也不是不懂那種心情。為了這些早解型玩家，他做了一點工夫：在遊戲的重點各處放好幾個「就是這裡」的鉤子，希望玩家在某處停下來。感受到體驗的樂趣後，就算脫離了軌道，也能在遊戲世界裡體驗很多事。","ex":"作者對早解型玩家的設計。","ask":"玩家如果一路衝主線，會不會錯過我最想讓他體驗的東西？我有沒有放鉤子讓他停下來？","page":"p.294–295"},{"id":"H-125","title":"只要有一點怪怪的地方，玩家就沒勁了","cat":"系統","rule":"遊戲只要有一個地方怪怪的，玩家就會失去幹勁；而且往往是很瑣碎的小事。","why":"按鈕反應有點慢、怪物動作偶爾卡頓、畫面切換太久、場景轉換有太多沒意義的演出；這類 bug 和修正項目一多，玩的人就沒勁了。玩家很快會注意到壞的地方，做得好的部分反而不會被注意，因為玩起來很順。作者說製作者為了讓玩家沒有煩躁、舒服地玩，下了很多苦功；好的部分沒人發現，壞的部分會被看見，所以才有「反面教師」這個詞。","ex":"按鈕反應、畫面切換、演出長度。","ask":"我的遊戲有沒有一個瑣碎卻會讓人煩的地方？","page":"p.295–296"},{"id":"H-126","title":"玩別人的遊戲，會有各種輸入","cat":"心法","rule":"再忙也要玩別人做的作品，不是浪費時間；不然點子會一直流出去、最後枯竭。","why":"作者常看連續劇，新開播的連續劇幾乎全部錄下，無聊的就一直刪。別人問他「你怎麼有空看那麼多」，但接觸別人的作品是一種刺激，他也很在意現在什麼東西受歡迎。不過他看或玩時，純粹是以玩家的立場享受，有趣的東西就是有趣。然後再想：要找出自己獨特作品的方向，該怎麼做？輸入很重要。","ex":"作者看連續劇的習慣。","ask":"我最近一個月接觸了多少別人的作品？","page":"p.296–297"},{"id":"H-127","title":"要懂程式嗎？更重要的是遊戲感","cat":"心法","rule":"程式知識有比較好，邏輯思考很重要；但對遊戲設計者最重要的，是「遊戲感」。","why":"寫各種劇本時有複雜分歧，就會用流程圖，把台詞和事件放進去展開，自然會有遊戲式的思考。但只學程式不行；程式設計師要的是程式技術，遊戲設計師要的是遊戲感，兩者不同。要磨練遊戲感，只能不斷嘗試；再怎麼學電腦也做不出好玩的遊戲，要靠感覺掌握玩家對什麼覺得好玩。作者以前寫程式時，眼前是電腦，但他做的時候一直看著電腦另一邊的「人」：那個人會有什麼反應、會怎麼想。「電腦做得到這麼厲害的事」這種想法不行，永遠要用玩家的視角，以電腦另一邊的人為對象來做。","ex":"作者用流程圖寫劇本。","ask":"我在做的這個功能，是因為「技術做得到」，還是因為「玩家會開心」？","page":"p.297–298"},{"id":"H-128","title":"腦中的傑作，要把它做出來","cat":"心法","rule":"大家腦中都有熱情和點子；難的是把它做成形。在腦中時都是傑作。","why":"要把它活用成形時會有辛苦和困難，但要努力把腦中的傑作做成形。製作過程中會失敗、會受傷，但全部都是學習，就算失敗了也一樣。","ex":"作者對想做遊戲的人的建議。","ask":"我腦中的那個傑作，今天往前做了一步嗎？","page":"p.298–299"},{"id":"H-129","title":"比起編劇，更希望成為娛樂者","cat":"心法","rule":"作者不覺得自己是編劇，比較像是娛樂者（entertainer）。","why":"故事當然也寫，但他的風格是讓人開心就好，在那裡長出人與人之間的劇本就有趣。想故事時當然很開心，這是他工作的核心；但他會一邊想「讓這傢伙做這種事怎樣？」「這裡變成這樣，大家會嚇一跳吧」，一邊想玩家的反應，想著想著就旁生枝節，而他很喜歡這樣。每次這樣，他都覺得自己是娛樂者。他會在各處放一些惡搞的梗，例如進到某個地方，從黑暗中拿到某樣東西，讓玩家上鉤，大叫「中計了！」。","ex":"《III》伊西斯城的地下有寶物，拿了之後骷髏站起來問「吵醒我的是你們嗎？」，如果回答「不是」，一般會被罵「說謊！」，作者卻讓骷髏說「是嗎，不是你啊，我認錯人了」。","ask":"我在寫劇本時，有沒有一直想著玩家的反應？","page":"p.299–300"},{"id":"H-130","title":"磨練日文獨有的表現","cat":"台詞","rule":"用語言的細微差異寫出角色的性別、性格、年齡；這種用字的妙味，是《勇者鬥惡龍》的味道。","why":"日文有獨特的文法，稍微換一下用語，就能表現出人物的性別、性格甚至年齡。作者以前在雜誌當撰稿人，很擅長分寫這種文章，他覺得這種台詞的妙味就是《勇者鬥惡龍》的味道。做海外版時語言障礙非常厚：把細微語感翻成多種語言很難，他不是母語者，完全不懂英文的微妙說法，只能交給翻譯。他能做的，就是把日文的表現磨得更好；語言是活的，流行語也一樣。","ex":"海外版第一作《DRAGON WARRIOR》1989 年在北美發售，2005 年起改用《DRAGON QUEST》。","ask":"我的角色，光看台詞能不能分出是誰說的？","page":"p.300–301"},{"id":"H-131","title":"做出和漫畫、電影不同的遊戲獨有做法","cat":"心法","rule":"遊戲是不可思議的媒體：就代入感來說，可能比電影更強，因為玩家能在某種程度上自己推動故事。要做出遊戲才有的特色，需要相當工夫。","why":"也有把漫畫或電影改編成遊戲的例子。作者自己做過漫畫改編，他覺得確實有些世界只有遊戲能畫，和漫畫、電影不太重疊；所以遊戲就是遊戲，原創遊戲正在變多。從無到有做遊戲很辛苦，但重要的是用獨特的做法、以前沒有的樣式去做。大紅的超好看漫畫，改編成遊戲不一定好玩，看做法也可能變成超爛的遊戲；把漫畫的哪一部分做成怎樣的遊戲，靠的是遊戲設計者的感覺。","ex":"作者以監修身分參與的漫畫改編遊戲《Famicom Jump II 最強的七人》（1991）。","ask":"我的遊戲有沒有一段其實拍成影片就好、不需要玩家操作的地方？哪一部分是「只有遊戲畫得出來」的？","page":"p.302"},{"id":"H-132","title":"試著用分鏡畫出想像","cat":"心法","rule":"腦中抽象的點子，先用粗略分鏡或手繪地圖視覺化，再具體化。只靠腦中印象直接寫程式，算不上好方法；寫出故事大綱和分鏡，比較能把想像具體化。","why":"作者以前一個人做遊戲時，有段時間只靠腦中印象就直接寫程式，電腦版《港口鎮》就是最典型的例子，連分鏡都沒畫就完成了；但他說這其實不是好方法。《勇者鬥惡龍》也一樣：向鳥山明發包怪物時，會徹底共享印象，用粗略分鏡傳達自己印象的基本部分，盡量不讓傳接球失誤。他只畫在不影響鳥山作業的範圍內，因為自己多少會畫一點，畫太細反而會有負面影響；隨便畫一畫，鳥山應該更會冒出點子，再補上文字說明去發包。","ex":"《VII》的梅爾賓是受鳥山明插圖影響劇本最大的例子：作者請的是老戰士，心中形象沒那麼衰弱，但鳥山畫出很衰弱的老爺爺，他便從設定和劇本重新構思。鳥山似乎喜歡畫老爺爺、大叔，畫主角一直最辛苦。","ask":"我給美術的指示，有沒有留下讓對方發揮的空間？對方的圖有沒有反過來啟發我？","page":"p.303–304"},{"id":"H-133","title":"放入冒險遊戲的要素","cat":"企劃","rule":"RPG 是冒險遊戲的延長線；把冒險遊戲的要素放進 RPG，會很有趣。","why":"1987 年後半，作者覺得冒險遊戲有點走到盡頭：它基本上是紙芝居式的，一張圖一張圖推進故事，很難放進其他遊戲要素。玩家在各地反覆移動、在定點獲得情報、把故事完成，過程中要讓玩家不卡關，冒險遊戲一卡關就沒事可做了；RPG 卡關時還能戰鬥、升級，因為有等級這個安全閥，謎題做簡單也不怕被一下就通關。於是 1980 年代末起，他把各種自己的冒險遊戲要素放進《勇者鬥惡龍》。他說這樣擴充開來，RPG 系統其實和冒險遊戲非常契合；RPG 是在冒險遊戲的系統上加了很有趣的戰鬥系統、以移動為主的遊戲。","ex":"用 DQ 的系統重現《鄂霍次克》並非不可能：做日本地圖的田野，放進釧路、網走的城鎮地圖，配置人物，跟他們說話就給提示。因為是警察，為了升級而戰的對象就是壞人，這種遊戲其實已經有了。","ask":"我的 RPG 有沒有借用冒險遊戲的解謎與情報收集？","page":"p.304–306"},{"id":"H-134","title":"把對自己作品的不滿，用在下一次","cat":"心法","rule":"遊戲完成時，作者大約 95% 滿意，覺得做完了；但時間一久，各種不滿會冒出來。這些不滿正是下一作的提示。","why":"「那裡那樣做就好了」「這樣做故事會更寬」，正因為有這些遺憾，才做得出下一作。完成後也會一再開反省會，一直想下去，話題就變成「那新作要怎麼辦？」。重點是不要把不滿往負面想，不滿裡藏著下一作的提示。","ex":"作者的反省會。","ask":"我上一個作品最大的遺憾是什麼？下一個作品要怎麼補？","page":"p.306–307"},{"id":"H-135","title":"被捨棄的點子，過一陣子再想","cat":"心法","rule":"被捨棄的點子不一定沒價值，過一陣子再看，可能可以重新使用。","why":"劇本大致完成後，為了重新調整，讓曾被捨棄的怪物復活、把刪掉的小故事改形狀再採用，這種情況多到數不清。捨棄怪物或小故事有它的理由，所以不是全部都捨；但它當初會被採用，就是因為有好的地方，所以可以再確認它的好處、重新挖掘。內容好的話。","ex":"作者劇本調整時的做法。","ask":"我的點子筆記裡，有沒有一個當初被砍、現在其實可以用的？","page":"p.307–308"},{"id":"H-136","title":"遊戲製作最堅持的三件事：發想力、忍耐力、捨棄的勇氣","cat":"心法","rule":"作者說遊戲製作最重要的有三件事：發想力、忍耐力、捨棄的勇氣。","why":"發想力是想出各種有趣點子的能力。忍耐力是把點子做成形、做成遊戲；想到有趣的點子，要把它放進遊戲，需要相當的忍耐力。最後是捨棄的勇氣：辛苦完成的東西，看了不好玩就要捨棄，因為之前的辛苦會化成泡影，所以需要相當的勇氣；就算還沒完成，做到某個程度了也很難捨。他喜歡看連續劇，常看到一些讓人懷疑「完成前都沒人說話嗎？」的爛作；大概不是沒說，而是說不出口。捨棄需要勇氣，這件事很重要，所以他再說一次：發想力、忍耐力、捨棄的勇氣。","ex":"作者常被問「最重要的是什麼」時的回答。","ask":"我現在的專案裡，有沒有一個不好玩卻捨不得砍的部分？","page":"p.308–309"},{"id":"H-137","title":"平衡調整是最後的堡壘","cat":"平衡","rule":"戰鬥平衡的調整是最後一道防線，每次都要非常小心；調整時要有具體的根據，而不只是感覺。","why":"例如有個三層地城，先決定「這個地城要打幾場」：一層約八場剛好，三場太少、二十場太多。設定機率時要讀清楚：5% 機率的行動，打二十場可能一次都不會發生，那就改成 10%。遇敵太少，就會升不了級，此時可以提高怪物的經驗值；前中盤的怪物經驗值差 1，印象就會大不同，要非常小心。「為什麼是 5% 而不是 10%？」也要有明確根據。如果想要「打五十場升一級」，就會算出「這段時間要遇到幾次」「這隻怪掉稀有寶箱的機率要多少」。測試時，他總以自己的感受為基準做感覺調整。平衡調整做不好，好不容易做的遊戲一下就變得很無聊。","ex":"三層地城、一層八場的例子。","ask":"我的每個機率和經驗值，說得出「為什麼是這個數字」嗎？","page":"p.309–311"},{"id":"H-138","title":"給享受遊戲的年輕人","cat":"心法","rule":"遊戲曾被當成壞東西，現在時代變了；在變動的世界裡持續下去，需要柔軟的信念。","why":"作者做《勇者鬥惡龍》的四十年前，約 30 歲，採訪他的多是快五十歲的人，那時大人大多認為「遊戲是壞事」，把他當成做了不得了東西的人。新的娛樂對上一代來說大概就是壞的；電視、漫畫一開始也被批評。後來出現「我是玩勇者鬥惡龍長大的」的人，他感到情況完全不同了。2025 年秋天，他獲國家授勳表彰，就遊戲設計師而言似乎是首例。持續就是力量，但時代會變；在變動的世界裡怎麼持續，需要柔軟性。不是堅硬的信念，而是帶著有點柔軟的信念，去度過接下來的時代。","ex":"作者 2025 年秋的授勳。","ask":"我的作品和創作態度，有沒有足夠的彈性面對變化？","page":"p.311–312"}],"flow":[{"step":"1","what":"魔王","ids":["H-001","H-043","H-045"],"q":"魔王想做什麼？為什麼？為什麼沒有一開始就殺掉主角？"},{"step":"2","what":"主角","ids":["H-002","H-003","H-103"],"q":"主角一定是勇者嗎？主角說不說話？"},{"step":"3","what":"冒險目的","ids":["H-004"],"q":"除了打倒魔王，要找什麼、救誰、取回什麼？"},{"step":"4","what":"世界與時代","ids":["H-005","H-006"],"q":"時代一定，敵人和主角身分怎麼跟著定？哪個版本會讓玩家「喔！」？"},{"step":"5","what":"世界地圖","ids":["H-007","H-008","H-009","H-010"],"q":"先畫地圖了嗎？哪些地方讓人想去？"},{"step":"6","what":"城鎮","ids":["H-011","H-012"],"q":"每個城鎮在困擾什麼？怎麼解決？"},{"step":"7","what":"夥伴","ids":["H-013","H-048","H-056"],"q":"夥伴是劇本給、玩家選，還是混合？相遇有記憶點嗎？"},{"step":"8","what":"事件","ids":["H-014","H-015","H-034","H-035"],"q":"有哪些比預期「稍微斜上方」的事件？任務會不會像跑腿？"},{"step":"9","what":"系統骨架","ids":["H-017"],"q":"用八條以內寫出系統骨架。"},{"step":"10","what":"城鎮人物配置","ids":["H-018"],"q":"每個城鎮有存在理由嗎？第二次來時誰不見了？"},{"step":"11","what":"台詞","ids":["H-019","H-031","H-059","H-060","H-121"],"q":"路人台詞有沒有生活感？重要情報有幾個人說？"},{"step":"12","what":"怪物","ids":["H-020","H-069"],"q":"怪物從世界觀長出來了嗎？每隻頭目的招牌習性是什麼？"},{"step":"13","what":"怪物 AI","ids":["H-021","H-068","H-070"],"q":"敵人分動物／人類／神哪一級？"},{"step":"14","what":"夥伴 AI","ids":["H-022","H-086","H-088","H-091"],"q":"AI 夥伴有個性嗎？有沒有刻意保留的「蠢」？"},{"step":"15","what":"武器、防具、道具","ids":["H-023"],"q":"關鍵道具怎麼拿到、誰守著？"},{"step":"16","what":"職業","ids":["H-024"],"q":"玩家看得出怪物大概會做什麼嗎？"},{"step":"17","what":"咒文、特技、技能","ids":["H-025"],"q":"物理職業除了「攻擊」還有什麼選擇？"},{"step":"18","what":"寶箱與隱藏道具","ids":["H-026"],"q":"有幾個「看得到拿不到」、讓人想回來的寶物？"},{"step":"19","what":"目的的分層與獎賞","ids":["H-027","H-085"],"q":"中盤時玩家知道最終目標嗎？通關後還有什麼？"},{"step":"20","what":"概念與廣告詞","ids":["H-028","H-062"],"q":"一句話說得出這個遊戲嗎？"}]};
const CATS = [['企劃','--c1'],['角色','--c2'],['台詞','--c3'],['事件','--c4'],['系統','--c5'],['平衡','--c6'],['心法','--c7']];
const cc = c => `var(${(CATS.find(x => x[0] === c) || [0, '--muted'])[1]})`;
const esc = s => String(s).replace(/[&<>"]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[m]));
const grid = document.getElementById('grid'), q = document.getElementById('q'), status = document.getElementById('status');
let active = new Set();

grid.innerHTML = DATA.items.map(it => `
<details class="card" id="${it.id}" style="--cc:${cc(it.cat)}" data-cat="${esc(it.cat)}" data-text="${esc((it.id + it.title + it.rule + it.why + it.ex + it.ask).toLowerCase())}">
  <summary>
    <div class="meta"><span class="cat">● ${esc(it.cat)}</span><span>${it.id}｜${esc(it.page)}</span></div>
    <h3>${esc(it.title)}</h3>
    <p class="rule">${esc(it.rule)}</p>
    <span class="more">展開理由與例子 ▾</span>
  </summary>
  <div class="body">
    <h4>理由</h4><p>${esc(it.why)}</p>
    <h4>書中例子</h4><p>${esc(it.ex)}</p>
    <div class="ask"><b>問自己</b>${esc(it.ask)}</div>
  </div>
</details>`).join('');

const chips = document.getElementById('chips');
chips.innerHTML = `<button class="chip" data-c="" aria-pressed="true">全部 <small>${DATA.items.length}</small></button>` +
  CATS.map(([c, v]) => `<button class="chip" data-c="${c}" aria-pressed="false" style="--cc:var(${v})"><span class="dot"></span>${c} <small>${DATA.items.filter(x => x.cat === c).length}</small></button>`).join('');
chips.addEventListener('click', e => {
  const b = e.target.closest('.chip'); if (!b) return;
  const c = b.dataset.c;
  if (!c) active.clear(); else active.has(c) ? active.delete(c) : active.add(c);
  chips.querySelectorAll('.chip').forEach(x => x.setAttribute('aria-pressed', x.dataset.c ? String(active.has(x.dataset.c)) : String(active.size === 0)));
  apply();
});
q.addEventListener('input', apply);
function apply() {
  const v = q.value.trim().toLowerCase(); let n = 0;
  grid.querySelectorAll('.card').forEach(el => {
    const ok = (!active.size || active.has(el.dataset.cat)) && (!v || el.dataset.text.includes(v));
    el.classList.toggle('hide', !ok); if (ok) n++;
  });
  status.textContent = n === DATA.items.length ? `共 ${n} 條，點卡片展開` : `符合 ${n} 條`;
}
apply();

document.getElementById('flow').innerHTML = DATA.flow.map(s => `
<div class="step"><div class="n">${s.step}</div><h3>${esc(s.what)}</h3><p>${esc(s.q)}</p>
<div class="links">${s.ids.map(id => `<button data-go="${id}">${id} ${esc((DATA.items.find(x => x.id === id) || {}).title || '')}</button>`).join('')}</div></div>`).join('');

const tabs = [['t-cards', 'v-cards'], ['t-flow', 'v-flow']];
function show(tid) {
  tabs.forEach(([t, v]) => { const on = t === tid; document.getElementById(t).setAttribute('aria-selected', on); document.getElementById(v).classList.toggle('hide', !on); });
}
tabs.forEach(([t]) => document.getElementById(t).addEventListener('click', () => show(t)));
document.getElementById('flow').addEventListener('click', e => {
  const b = e.target.closest('[data-go]'); if (!b) return;
  q.value = ''; active.clear(); chips.querySelectorAll('.chip').forEach(x => x.setAttribute('aria-pressed', String(!x.dataset.c))); apply();
  show('t-cards'); const el = document.getElementById(b.dataset.go); el.open = true; el.scrollIntoView({ block: 'start' });
});
if (/^#H-\d{3}$/.test(location.hash)) { const el = document.getElementById(location.hash.slice(1)); if (el) { el.open = true; el.scrollIntoView(); } }
</script>

</body>
</html>
