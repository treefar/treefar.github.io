<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>treefar 專案導航</title>
<style>
  :root {
    --bg: #0e1116;
    --panel: #171c24;
    --panel-hover: #1e2530;
    --line: #2a3342;
    --ink: #e8edf4;
    --dim: #8b97a8;
    --c-game: #5eead4;
    --c-story: #c4b5fd;
    --c-site: #93c5fd;
    --c-tool: #fbbf24;
    --c-local: #fda4af;
    --c-ext: #86efac;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Microsoft JhengHei UI", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
    background: var(--bg); color: var(--ink);
    min-height: 100vh; padding: 40px 20px 60px;
  }
  .wrap { max-width: 1080px; margin: 0 auto; }
  header { display: flex; align-items: baseline; gap: 14px; margin-bottom: 4px; flex-wrap: wrap; }
  h1 { font-size: 26px; letter-spacing: 1px; }
  h1 span { color: var(--dim); font-weight: 400; }
  .about-link { margin-left: auto; color: var(--dim); text-decoration: none; font-size: 14px; border-bottom: 1px dotted var(--dim); }
  .about-link:hover { color: var(--ink); }
  .hint { color: var(--dim); font-size: 13px; margin-bottom: 24px; }
  @media (max-width: 640px) { .hint .kbd-only { display: none; } }

  h2.sec { font-size: 15px; letter-spacing: 3px; color: var(--dim); margin: 36px 0 14px; display: flex; align-items: center; gap: 10px; }
  h2.sec::after { content: ""; flex: 1; height: 1px; background: var(--line); }

  .filters { display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
  .chip {
    border: 1px solid var(--line); background: none; color: var(--dim);
    padding: 6px 14px; border-radius: 999px; font-size: 13px; cursor: pointer;
    font-family: inherit; transition: all .15s;
  }
  .chip:hover { color: var(--ink); border-color: var(--dim); }
  .chip.on { color: var(--bg); background: var(--ink); border-color: var(--ink); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
  .card {
    position: relative; display: flex; flex-direction: column; background: var(--panel);
    border: 1px solid var(--line); border-radius: 14px; overflow: hidden;
    text-decoration: none; color: inherit; transition: all .15s;
  }
  .card:hover { background: var(--panel-hover); border-color: var(--dim); transform: translateY(-3px); }
  .card.hide { display: none; }
  .thumb { position: relative; aspect-ratio: 16/9; background: #0a0d12; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .slide-text-thumb {
    display: flex; align-items: flex-end; padding: 18px;
    background: linear-gradient(135deg, #182033 0%, #36456d 55%, #5c6fb0 100%);
  }
  .slide-text-thumb span {
    max-width: 90%; color: #fff; font-size: 17px; font-weight: 700; line-height: 1.35;
  }
  .key {
    position: absolute; top: 10px; right: 10px; width: 24px; height: 24px;
    background: rgba(10,13,18,.72); border: 1px solid rgba(255,255,255,.25); border-radius: 6px;
    color: #fff; font-size: 12px; display: flex; align-items: center; justify-content: center;
    backdrop-filter: blur(2px);
  }
  .body { padding: 14px 16px 14px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .tag { font-size: 11px; letter-spacing: 2px; }
  .card h3 { font-size: 16px; }
  .card p { font-size: 13px; color: var(--dim); line-height: 1.6; flex: 1; }
  .foot { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; }
  .url { font-size: 12px; color: var(--dim); opacity: .7; }
  .gh { font-size: 12px; color: var(--dim); border-bottom: 1px dotted var(--dim); cursor: pointer; }
  .gh:hover { color: var(--ink); }

  .mini-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
  .mini {
    display: flex; flex-direction: column; gap: 5px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px;
    text-decoration: none; color: inherit; transition: all .15s; cursor: pointer;
  }
  .mini:hover { background: var(--panel-hover); border-color: var(--dim); }
  .mini h3 { font-size: 14px; display: flex; align-items: center; gap: 8px; }
  .mini .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .mini p { font-size: 12px; color: var(--dim); line-height: 1.5; }
  .mini .addr { font-size: 11px; color: var(--dim); opacity: .7; font-family: Consolas, monospace; word-break: break-all; }
  .note { font-size: 12px; color: var(--dim); opacity: .8; margin: -6px 0 12px; }

  .t-game { color: var(--c-game); } .d-game { background: var(--c-game); }
  .t-story { color: var(--c-story); } .d-story { background: var(--c-story); }
  .t-site { color: var(--c-site); } .d-site { background: var(--c-site); }
  .t-tool { color: var(--c-tool); } .d-tool { background: var(--c-tool); }
  .d-local { background: var(--c-local); }
  .d-ext { background: var(--c-ext); }

  footer { margin-top: 44px; color: var(--dim); font-size: 12px; opacity: .6; }
  .toast {
    position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%) translateY(80px);
    background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 10px;
    font-size: 13px; transition: transform .25s, opacity .25s; pointer-events: none; z-index: 9;
    opacity: 0;
  }
  .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

  /* ===== 暫時性首頁存取門檻：不需要時可連同頁尾 JS 區塊一起移除 ===== */
  body.gate-locked { overflow: hidden; }
  body.gate-locked > .wrap { filter: blur(9px); pointer-events: none; user-select: none; }
  .access-gate {
    position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center;
    padding: 24px; background: rgba(8, 11, 15, .88); backdrop-filter: blur(10px);
  }
  .access-gate[hidden] { display: none; }
  .access-card {
    width: min(100%, 390px); padding: 30px; border: 1px solid var(--line); border-radius: 18px;
    background: var(--panel); box-shadow: 0 24px 80px rgba(0, 0, 0, .45);
  }
  .access-mark {
    width: 46px; height: 46px; display: grid; place-items: center; margin-bottom: 18px;
    border-radius: 13px; background: var(--ink); color: var(--bg); font-weight: 800; font-size: 20px;
  }
  .access-card h2 { font-size: 21px; margin-bottom: 8px; }
  .access-card p { color: var(--dim); font-size: 13px; line-height: 1.7; }
  .access-form { display: grid; gap: 12px; margin-top: 22px; }
  .access-form label { font-size: 13px; color: var(--dim); }
  .access-form input {
    width: 100%; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px;
    background: var(--bg); color: var(--ink); font: inherit; outline: none;
  }
  .access-form input:focus { border-color: var(--c-tool); box-shadow: 0 0 0 3px rgba(251, 191, 36, .12); }
  .access-form button {
    padding: 12px 16px; border: 0; border-radius: 10px; background: var(--ink); color: var(--bg);
    font: inherit; font-weight: 700; cursor: pointer;
  }
  .access-form button:hover { opacity: .9; }
  .access-error { min-height: 21px; color: #fda4af !important; }
</style>
</head>
<body class="gate-locked">
<div class="access-gate" id="accessGate" role="dialog" aria-modal="true" aria-labelledby="accessTitle">
  <section class="access-card">
    <div class="access-mark" aria-hidden="true">樹</div>
    <h2 id="accessTitle">私人專案首頁</h2>
    <p>這是暫時性的存取門檻。請輸入密碼後進入。</p>
    <form class="access-form" id="accessForm">
      <label for="accessPassword">密碼</label>
      <input id="accessPassword" name="password" type="password" inputmode="numeric" autocomplete="current-password" required autofocus />
      <button type="submit">進入首頁</button>
      <p class="access-error" id="accessError" role="alert" aria-live="polite"></p>
    </form>
  </section>
</div>
<div class="wrap">

  <div class="filters" id="filters">

    <button class="chip" data-f="story">互動敘事</button>
    <button class="chip" data-f="site">網站</button>

  <p class="note">可下載的完整簡報；卡片縮圖是封面，點擊後直接下載 PPTX。</p>
  <div class="grid" id="slides"></div>

  <h2 class="sec">外部連結</h2>
  <div class="mini-grid" id="links"></div>

  <footer>treefar.github.io — 自用專案導航</footer>
</div>

// ===== 以下為渲染邏輯，一般不用動 =====
const grid = document.getElementById("grid");
SITES.forEach((s, i) => {
  const a = document.createElement("a");
  a.className = "card"; a.dataset.f = s.cat; a.href = s.url || `/${s.slug}/`;
  if (s.url) { a.target = "_blank"; a.rel = "noopener"; }
  const t = s.tag.toLowerCase().includes("story") && !s.cat.includes("game") ? "story" : s.cat.split(" ")[0];
  a.innerHTML = `
    <div class="thumb"><img src="/previews/${s.image || (s.slug + ".jpg")}" alt="${s.title}" width="640" height="360" loading="lazy">${i < 9 ? '<span class="key">' + (i + 1) + '</span>' : ''}</div>
    <div class="body">
      <div class="tag t-${t}">${s.tag}</div>
      <h3>${s.title}</h3>
      <p>${s.desc}</p>
      <div class="foot"><span class="url">${s.urlLabel || ("/" + s.slug)}</span>${s.repo === false ? '<span class="url">登入使用</span>' : `<span class="gh" data-gh="https://github.com/treefar/${s.repo || s.slug}">repo</span>`}</div>
    </div>`;
  grid.appendChild(a);
});

const slides = document.getElementById("slides");
SLIDES.forEach((s) => {
  const a = document.createElement("a");
  a.className = "card"; a.href = s.url;
  a.innerHTML = `
    ${s.image ? `<div class="thumb"><img src="/previews/${s.image}" alt="${s.title}" width="640" height="360" loading="lazy"></div>` : `<div class="thumb slide-text-thumb"><span>${s.title}</span></div>`}
    <div class="body">
      <div class="tag t-tool">${s.tag}</div>
      <h3>${s.title}</h3>
      <p>${s.desc}</p>
      <div class="foot"><span class="url">${s.kind === "data" ? "下載 Excel" : s.kind === "collection" ? "開啟簡報集" : "下載 PPTX"}</span><span class="gh">投影片專區</span></div>
    </div>`;
  slides.appendChild(a);
});

const tools = document.getElementById("tools");
TOOLS.forEach(t => {
  const el = document.createElement(t.url ? "a" : "div");
  el.className = "mini";
  if (t.url) el.href = t.url;
  el.innerHTML = `
    <h3><span class="dot d-local"></span>${t.title}</h3>
    <p>${t.desc || ""}</p>
    <span class="addr">${t.url || t.path}</span>`;
  if (t.path) el.addEventListener("click", () => {
    navigator.clipboard.writeText(t.path).then(showToast);
  });
  tools.appendChild(el);
});

const links = document.getElementById("links");
LINKS.forEach(t => {
  const el = document.createElement("a");
  el.className = "mini"; el.href = t.url; el.target = "_blank"; el.rel = "noopener";
  el.innerHTML = `
    <h3><span class="dot d-ext"></span>${t.title}</h3>
    <p>${t.desc || ""}</p>
    <span class="addr">${t.url}</span>`;
  links.appendChild(el);
});

const cards = [...grid.querySelectorAll(".card")];
document.getElementById("filters").addEventListener("click", e => {
  const btn = e.target.closest(".chip");
  if (!btn) return;
  document.querySelectorAll(".chip").forEach(c => c.classList.remove("on"));
  btn.classList.add("on");
  const f = btn.dataset.f;
  cards.forEach(c => c.classList.toggle("hide", f !== "all" && !c.dataset.f.split(" ").includes(f)));
});
grid.addEventListener("click", e => {
  const gh = e.target.closest(".gh");
  if (gh) { e.preventDefault(); e.stopPropagation(); window.open(gh.dataset.gh, "_blank"); }
});
addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") return;
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= cards.length) location.href = cards[n - 1].getAttribute("href");
});
function showToast() {
  const t = document.getElementById("toast");
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 1600);
}

// ===== 暫時性首頁存取門檻：不需要時可連同上方 CSS／HTML 區塊一起移除 =====
const ACCESS_SESSION_KEY = "treefar-home-access-v1";
const ACCESS_PASSWORD_HASH = "4c08c723d47104e004dee56e8fa90173f7158339f7cb30d2099d8e64522c3d59";
const accessGate = document.getElementById("accessGate");
const accessForm = document.getElementById("accessForm");
const accessPassword = document.getElementById("accessPassword");
const accessError = document.getElementById("accessError");

function unlockHomepage() {
  document.body.classList.remove("gate-locked");
  accessGate.hidden = true;
}

if (sessionStorage.getItem(ACCESS_SESSION_KEY) === "granted") {
  unlockHomepage();
} else {
  requestAnimationFrame(() => accessPassword.focus());
}

accessForm.addEventListener("submit", async event => {
  event.preventDefault();
  accessError.textContent = "";
  const bytes = new TextEncoder().encode(accessPassword.value);
  const digest = await crypto.subtle.digest("SHA-256", bytes);
  const hash = [...new Uint8Array(digest)].map(byte => byte.toString(16).padStart(2, "0")).join("");
  if (hash === ACCESS_PASSWORD_HASH) {
    sessionStorage.setItem(ACCESS_SESSION_KEY, "granted");
    accessPassword.value = "";
    unlockHomepage();
    return;
  }
  accessPassword.select();
  accessError.textContent = "密碼不正確，請再試一次。";
});
</script>
