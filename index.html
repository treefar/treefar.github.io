<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:,">
<title>treefar 專案導航</title>
<style>
  :root {
    --bg: #0e1116;
    --panel: #171c24;
    --panel-hover: #1e2530;
    --line: #2a3342;
    --ink: #e8edf4;
    --dim: #8b97a8;
    --c-game: #5eead4;
    --c-story: #c4b5fd;
    --c-site: #93c5fd;
    --c-tool: #fbbf24;
    --c-local: #fda4af;
    --c-ext: #86efac;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Microsoft JhengHei UI", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
    background: var(--bg); color: var(--ink);
    min-height: 100vh; padding: 40px 20px 60px;
  }
  .wrap { max-width: 1080px; margin: 0 auto; }
  header { display: flex; align-items: baseline; gap: 14px; margin-bottom: 4px; flex-wrap: wrap; }
  h1 { font-size: 26px; letter-spacing: 1px; }
  h1 span { color: var(--dim); font-weight: 400; }
  .header-links { margin-left: auto; display: flex; align-items: center; gap: 14px; }
  .about-link { color: var(--dim); text-decoration: none; font-size: 14px; border-bottom: 1px dotted var(--dim); }
  .about-link:hover { color: var(--ink); }
  .private-link {
    display: inline-flex; align-items: center; align-self: center; gap: 6px;
    padding: 5px 12px; border: 1px solid var(--line); border-radius: 999px;
    color: var(--dim); text-decoration: none; font-size: 13px; transition: all .15s;
  }
  .private-link:hover { color: var(--ink); border-color: var(--dim); background: var(--panel); }
  .private-link svg { flex: none; }
  .hint { color: var(--dim); font-size: 13px; margin-bottom: 24px; }
  @media (max-width: 640px) { .hint .kbd-only { display: none; } }

  h2.sec { font-size: 15px; letter-spacing: 3px; color: var(--dim); margin: 36px 0 14px; display: flex; align-items: center; gap: 10px; }
  h2.sec::after { content: ""; flex: 1; height: 1px; background: var(--line); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
  .card {
    position: relative; display: flex; flex-direction: column; background: var(--panel);
    border: 1px solid var(--line); border-radius: 14px; overflow: hidden;
    text-decoration: none; color: inherit; transition: all .15s;
  }
  .card:hover { background: var(--panel-hover); border-color: var(--dim); transform: translateY(-3px); }
  .card.hide { display: none; }
  .thumb { position: relative; aspect-ratio: 16/9; background: #0a0d12; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .slide-text-thumb {
    display: flex; align-items: flex-end; padding: 18px;
    background: linear-gradient(135deg, #182033 0%, #36456d 55%, #5c6fb0 100%);
  }
  .slide-text-thumb span {
    max-width: 90%; color: #fff; font-size: 17px; font-weight: 700; line-height: 1.35;
  }
  .key {
    position: absolute; top: 10px; right: 10px; width: 24px; height: 24px;
    background: rgba(10,13,18,.72); border: 1px solid rgba(255,255,255,.25); border-radius: 6px;
    color: #fff; font-size: 12px; display: flex; align-items: center; justify-content: center;
    backdrop-filter: blur(2px);
  }
  .body { padding: 14px 16px 14px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .tag { font-size: 11px; letter-spacing: 2px; }
  .card h3 { font-size: 16px; }
  .card p { font-size: 13px; color: var(--dim); line-height: 1.6; flex: 1; }
  .foot { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; }
  .url { font-size: 12px; color: var(--dim); opacity: .7; }
  .gh { font-size: 12px; color: var(--dim); border-bottom: 1px dotted var(--dim); cursor: pointer; }
  .gh:hover { color: var(--ink); }

  .notice-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .notice-card {
    display: flex; flex-direction: column; gap: 6px; min-height: 118px; padding: 15px 16px;
    border: 1px solid var(--line); border-left: 4px solid var(--c-tool); border-radius: 12px;
    background: linear-gradient(135deg, rgba(251, 191, 36, .08), var(--panel));
    color: inherit; text-decoration: none; transition: all .15s;
  }
  .notice-card:hover { background: var(--panel-hover); border-color: var(--dim); transform: translateY(-2px); }
  .notice-card time { color: var(--c-tool); font-size: 11px; font-weight: 700; letter-spacing: 1px; }
  .notice-card strong { font-size: 14px; line-height: 1.45; }
  .notice-card p { margin: 0; color: var(--dim); font-size: 12px; line-height: 1.55; }
  @media (max-width: 760px) { .notice-grid { grid-template-columns: 1fr; } }

  .t-game { color: var(--c-game); } .d-game { background: var(--c-game); }
  .t-story { color: var(--c-story); } .d-story { background: var(--c-story); }
  .t-site { color: var(--c-site); } .d-site { background: var(--c-site); }
  .t-tool { color: var(--c-tool); } .d-tool { background: var(--c-tool); }
  .d-local { background: var(--c-local); }
  .d-ext { background: var(--c-ext); }

  footer { margin-top: 44px; color: var(--dim); font-size: 12px; opacity: .6; }
  .toast {
    position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%) translateY(80px);
    background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 10px;
    font-size: 13px; transition: transform .25s, opacity .25s; pointer-events: none; z-index: 9;
    opacity: 0;
  }
  .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>treefar <span>／公開專案導航</span></h1>
    <div class="header-links">
      <a class="about-link" href="/about.html">關於我</a>
      <a class="private-link" href="https://tf-private.pages.dev/" target="_blank" rel="noopener" title="需登入">
      <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>私人工作台
      </a>
    </div>
  </header>
  <p class="hint"><span class="kbd-only">按數字鍵 1–3 直接開啟對應專案</span></p>

  <section aria-labelledby="noticeHeading">
    <h2 class="sec" id="noticeHeading">近期注意事項</h2>
    <div class="notice-grid" id="homeNotices"></div>
  </section>

  <h2 class="sec">公開工具與教學專區</h2>
  <div class="grid" id="grid"></div>

  <footer>treefar.github.io — 樹遠老師公開專案導航</footer>
</div>
<div class="toast" id="toast">已複製路徑</div>

<script>
// ===== 公開精選專案 (1, 2, 3) =====
const SITES = [
  { slug: "academic-calendar-115", title: "115 學年度學生行事曆", cat: "site tool", tag: "REFERENCE × ACADEMIC CALENDAR",
    image: null, repo: "treefar.github.io",
    desc: "把 2026 年 8 月至 2027 年 7 月的學生行事曆分成重要、中度、參考三色，依今天自動整理近期期限，並提供月份、色級與關鍵字篩選。" },
  { slug: "steam-tag-prompter", title: "Steam 標籤定位器", cat: "tool gamedev", tag: "① CONCEPT × STEAM TAGS",
    desc: "430 個 Steam 官方標籤釐清遊戲定位，選完列出 Steam 上最接近的遊戲。靈感輪盤、取捨說明、定位單與 AI 工單。短網址 /tool" },
  { slug: "game-glossary", title: "遊戲名詞大百科", cat: "tool site gamedev", tag: "① CONCEPT × GLOSSARY",
    image: null,
    desc: "530 條遊戲術語的教學查詢系統：類型、題材、機制、果汁、黑話，每條附白話定義、代表作、易混淆詞比較與來源，並對應 Steam 官方標籤、與標籤定位器互連。短網址 /glossary" }
];

// ===== 以下為渲染邏輯 =====
const CALENDAR_NOTICES = [
  { date: "2026-08-30", title: "新生宿舍開放、初選第三階段開始", desc: "初選至 9/2 上午 9:00；新生宿舍 8/30 上午 9:00 開放。" },
  { date: "2026-08-31", title: "註冊基準日與研究生畢業離校截止", desc: "研究生請留意論文繳交與 114-2 畢業離校手續。" },
  { date: "2026-09-07", title: "開學、加退選開始", desc: "加退選至 9/14 上午 9:00；同日開放多項課程申請。" },
  { date: "2026-09-15", title: "被關課學生補加選", desc: "僅開放被關課學生，9/16 上午 9:00 截止。" },
  { date: "2026-09-16", title: "網路確認選課結果", desc: "確認期間至 9/22。" },
  { date: "2026-11-02", title: "第一學期期中考", desc: "考試期間至 11/8，並開放查詢期中預警成績。" },
  { date: "2026-11-30", title: "學雜費減免第一階段與棄選", desc: "減免至 12/11；棄選至 12/7 上午 9:00。" },
  { date: "2026-12-21", title: "第二學期課程初選第一階段", desc: "選課至 2027/1/4 上午 9:00。" },
  { date: "2027-01-04", title: "第一學期期末考", desc: "考試期間至 1/10；同日為休退學申辦截止日。" },
  { date: "2027-01-11", title: "宿舍期末封宿、寒假開始", desc: "住宿生須在上午 10:00 前完成離宿。" },
  { date: "2027-02-15", title: "第二學期註冊基準日", desc: "同日為研究生論文繳交及畢業離校手續截止。" },
  { date: "2027-02-22", title: "第二學期開學、加退選開始", desc: "加退選至 3/2 上午 9:00。" },
  { date: "2027-03-04", title: "網路確認選課結果", desc: "確認期間至 3/10。" },
  { date: "2027-04-19", title: "第二學期期中考", desc: "考試期間至 4/25，並開放查詢期中預警成績。" },
  { date: "2027-05-18", title: "第二學期棄選開始", desc: "棄選至 5/24 上午 9:00。" },
  { date: "2027-06-04", title: "116 學年度第一學期課程初選", desc: "第一階段至 6/21 上午 9:00。" },
  { date: "2027-06-07", title: "畢業班課程期末考", desc: "考試期間至 6/13。" },
  { date: "2027-06-12", title: "115 學年度畢業典禮", desc: "應屆畢業生請依校方通知完成報到。" },
  { date: "2027-06-21", title: "非畢業班期末考", desc: "考試期間至 6/27，並開放查詢學期成績。" },
  { date: "2027-06-28", title: "暑假開始、學生宿舍封宿", desc: "住宿生須在上午 10:00 前完成離宿。" },
];
const homeToday = new Intl.DateTimeFormat("sv-SE", { timeZone: "Asia/Taipei" }).format(new Date());
const homeNoticeItems = CALENDAR_NOTICES.filter(item => item.date >= homeToday).slice(0, 3);
document.getElementById("homeNotices").innerHTML = homeNoticeItems.length
  ? homeNoticeItems.map(item => `<a class="notice-card" href="/academic-calendar-115/">
      <time datetime="${item.date}">${item.date.replaceAll("-", ".")}</time>
      <strong>${item.title}</strong><p>${item.desc}</p></a>`).join("")
  : `<a class="notice-card" href="/academic-calendar-115/"><time>115 學年度</time>
      <strong>本學年度行事曆已結束</strong><p>開啟完整頁面查閱歷史記事。</p></a>`;

const grid = document.getElementById("grid");
SITES.forEach((s, i) => {
  const a = document.createElement("a");
  a.className = "card"; a.dataset.f = s.cat; a.href = s.url || `/${s.slug}/`;
  if (s.url) { a.target = "_blank"; a.rel = "noopener"; }
  const t = s.tag.toLowerCase().includes("story") && !s.cat.includes("game") ? "story" : s.cat.split(" ")[0];
  const thumb = s.image === null
    ? `<div class="thumb slide-text-thumb"><span>${s.title}</span><span class="key">${i + 1}</span></div>`
    : `<div class="thumb"><img src="/previews/${s.image || (s.slug + ".jpg")}" alt="${s.title}" width="640" height="360" loading="lazy"><span class="key">${i + 1}</span></div>`;
  a.innerHTML = `
    ${thumb}
    <div class="body">
      <div class="tag t-${t}">${s.tag}</div>
      <h3>${s.title}</h3>
      <p>${s.desc}</p>
      <div class="foot"><span class="url">${s.urlLabel || ("/" + s.slug)}</span><span class="gh" data-gh="https://github.com/treefar/${s.repo || s.slug}">repo</span></div>
    </div>`;
  grid.appendChild(a);
});

const cards = [...grid.querySelectorAll(".card")];
grid.addEventListener("click", e => {
  const gh = e.target.closest(".gh");
  if (gh) { e.preventDefault(); e.stopPropagation(); window.open(gh.dataset.gh, "_blank"); }
});
addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") return;
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= cards.length) location.href = cards[n - 1].getAttribute("href");
});
function showToast() {
  const t = document.getElementById("toast");
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 1600);
}
</script>
</body>
</html>
