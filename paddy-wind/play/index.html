<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0e1116">
  <title>風從稻田來｜網頁試玩</title>
  <style>
    :root{--bg:#0e1116;--panel:#171c24;--panel2:#1e2530;--line:#2a3342;--ink:#e8edf4;--dim:#96a3b5;--teal:#5eead4;--sun:#f6c45b;--danger:#fda4af}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Inter,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
    body{background:radial-gradient(circle at 75% -20%,rgba(94,234,212,.13),transparent 32rem),var(--bg)}
    a{color:inherit}.shell{width:min(1180px,calc(100% - 24px));margin:auto}
    header{border-bottom:1px solid var(--line);background:rgba(14,17,22,.9);backdrop-filter:blur(14px)}
    header .shell{min-height:60px;display:flex;align-items:center;justify-content:space-between;gap:16px}
    .brand{font-weight:850;text-decoration:none}.brand span{color:var(--teal)}.back{color:var(--dim);font-size:.88rem;text-decoration:none}
    main{padding:18px 0 34px}.stage{overflow:hidden;border:1px solid var(--line);border-radius:18px;background:#050709;box-shadow:0 24px 70px rgba(0,0,0,.38)}
    .canvas-wrap{position:relative;aspect-ratio:16/9;min-height:260px;background:#050709}
    #unity-canvas{display:block;width:100%;height:100%;background:#050709;outline:0;touch-action:none;user-select:none;-webkit-user-select:none}
    .loading{position:absolute;inset:0;display:grid;place-items:center;padding:24px;background:linear-gradient(160deg,#101a20,#0a0d12);text-align:center}
    .loading[hidden]{display:none}.loading-box{width:min(430px,86%)}.loading h1{margin:0 0 8px;font-size:clamp(1.5rem,4vw,2.6rem)}.loading p{margin:0 0 18px;color:var(--dim)}
    .track{height:9px;overflow:hidden;border:1px solid var(--line);border-radius:999px;background:#080b0f}.bar{width:0;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--teal),var(--sun));transition:width .2s}
    .percent{display:block;margin-top:8px;color:var(--teal);font-size:.82rem;font-variant-numeric:tabular-nums}
    .error{position:absolute;left:16px;right:16px;bottom:16px;z-index:5;padding:12px 14px;border:1px solid rgba(253,164,175,.5);border-radius:12px;background:rgba(55,18,26,.94);color:#ffe4e8;font-size:.88rem}
    .error[hidden]{display:none}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 14px;border-top:1px solid var(--line);background:var(--panel)}
    .status{color:var(--dim);font-size:.84rem}.status b{color:var(--sun)}button{min-height:42px;padding:8px 16px;border:1px solid var(--line);border-radius:999px;background:var(--panel2);color:var(--ink);font:inherit;font-weight:750;cursor:pointer}button:hover,button:focus-visible{border-color:var(--teal);outline:none}
    .guide{display:grid;grid-template-columns:1.2fr .8fr;gap:14px;margin-top:14px}.card{padding:18px;border:1px solid var(--line);border-radius:14px;background:var(--panel)}.card h2{margin:0 0 9px;font-size:1rem}.card p{margin:0;color:var(--dim);font-size:.88rem;line-height:1.7}.keys{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}.key{padding:5px 9px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);color:#cdd6e2;font-size:.8rem}
    @media(max-width:720px){header .shell{min-height:54px}.shell{width:min(100% - 12px,1180px)}main{padding-top:8px}.stage{border-radius:12px}.canvas-wrap{min-height:0}.toolbar{align-items:flex-start}.status{max-width:66%}.guide{grid-template-columns:1fr}.card{padding:15px}.back{font-size:.76rem}}
  </style>
</head>
<body>
  <header><div class="shell"><a class="brand" href="../"><span>treefar</span> / 風從稻田來</a><a class="back" href="../">← 回成果頁</a></div></header>
  <main class="shell">
    <section class="stage" aria-label="風從稻田來網頁遊戲">
      <div class="canvas-wrap">
        <canvas id="unity-canvas" tabindex="-1" aria-label="Unity 遊戲畫面"></canvas>
        <div class="loading" id="loading"><div class="loading-box"><h1>風從稻田來</h1><p>正在載入水田、風聲與自行車……</p><div class="track"><div class="bar" id="bar"></div></div><span class="percent" id="percent">0%</span></div></div>
        <div class="error" id="error" role="alert" hidden></div>
      </div>
      <div class="toolbar"><div class="status"><b>桌機與手機</b> 支援鍵盤、手把及手機橫向多點觸控；進入後先點一下遊戲畫面。</div><button type="button" id="fullscreen" disabled>全螢幕</button></div>
    </section>
    <div class="guide"><section class="card"><h2>主要操作</h2><p>按住踩踏即可輕鬆前進；想騎得更順，請約每 0.6 秒點按一次，累積流暢度。沿途會出現順風踩踏、按鈴超車、橋前煞車與白鷺旁滑行等短挑戰，錯過也不會中斷旅程。手機請橫向遊玩。</p><div class="keys"><span class="key">D／踩踏</span><span class="key">A／煞車</span><span class="key">E／按鈴</span><span class="key">Shift／加速</span><span class="key">Q／錄音</span><span class="key">F／相機</span><span class="key">Space／互動</span><span class="key">Esc／暫停</span></div></section><aside class="card"><h2>目前限制</h2><p>這是十五分鐘單一路線垂直切片，支援桌機鍵盤、手把與手機橫向多點觸控。行動裝置效能依瀏覽器而異；音訊需在使用者首次點擊後啟動。<a href="ThirdPartyNotices.txt">第三方字型授權</a></p></aside></div>
  </main>
  <script>
    const canvas=document.querySelector('#unity-canvas');
    const loading=document.querySelector('#loading');
    const bar=document.querySelector('#bar');
    const percent=document.querySelector('#percent');
    const errorBox=document.querySelector('#error');
    const fullscreen=document.querySelector('#fullscreen');
    let unityInstance=null;
    const touchRects={pause:[.02,.03,.15,.21],bell:[.19,.03,.15,.21],observe:[.02,.29,.19,.21],brake:[.02,.76,.22,.21],record:[.27,.76,.15,.21],action:[.44,.76,.15,.21],photo:[.61,.76,.14,.21],boost:[.78,.52,.20,.21],pedal:[.77,.76,.21,.21]};
    const activePointers=new Map();
    function touchControlAt(event){
      const box=canvas.getBoundingClientRect(),x=(event.clientX-box.left)/box.width,y=(event.clientY-box.top)/box.height;
      for(const [name,rect] of Object.entries(touchRects))if(x>=rect[0]&&x<=rect[0]+rect[2]&&y>=rect[1]&&y<=rect[1]+rect[3])return name;
      return '';
    }
    function sendTouch(name,held){if(unityInstance&&name)unityInstance.SendMessage('TouchInput','SetWebTouch',name+':'+(held?'1':'0'));}
    canvas.addEventListener('pointerdown',event=>{if(event.pointerType!=='touch')return;event.preventDefault();canvas.setPointerCapture(event.pointerId);if(unityInstance)unityInstance.SendMessage('TouchInput','SetWebAnyPressed');const name=touchControlAt(event);activePointers.set(event.pointerId,name);sendTouch(name,true);});
    canvas.addEventListener('pointermove',event=>{if(event.pointerType!=='touch'||!activePointers.has(event.pointerId))return;event.preventDefault();const previous=activePointers.get(event.pointerId),next=touchControlAt(event);if(previous===next)return;sendTouch(previous,false);sendTouch(next,true);activePointers.set(event.pointerId,next);});
    function releaseTouch(event){if(event.pointerType!=='touch'||!activePointers.has(event.pointerId))return;event.preventDefault();sendTouch(activePointers.get(event.pointerId),false);activePointers.delete(event.pointerId);}
    canvas.addEventListener('pointerup',releaseTouch);canvas.addEventListener('pointercancel',releaseTouch);canvas.addEventListener('lostpointercapture',releaseTouch);
    const buildUrl='Build';
    const buildRevision=encodeURIComponent('1.0-20260820b');
    const config={
      dataUrl:buildUrl+'/WebGL.data.unityweb?v='+buildRevision,
      frameworkUrl:buildUrl+'/WebGL.framework.js.unityweb?v='+buildRevision,
      codeUrl:buildUrl+'/WebGL.wasm.unityweb?v='+buildRevision,
      streamingAssetsUrl:'StreamingAssets',
      companyName:'Windhe Town Studio',
      productName:'風從稻田來',
      productVersion:'1.0',
      matchWebGLToCanvasSize:true,
      devicePixelRatio:Math.min(window.devicePixelRatio||1,1.5)
    };
    const loader=document.createElement('script');
    loader.src=buildUrl+'/WebGL.loader.js?v='+buildRevision;
    loader.onload=()=>createUnityInstance(canvas,config,p=>{const value=Math.round(p*100);bar.style.width=value+'%';percent.textContent=value+'%';}).then(instance=>{unityInstance=instance;if(matchMedia('(pointer:coarse)').matches)instance.SendMessage('TouchInput','EnableWebTouchUI');loading.hidden=true;fullscreen.disabled=false;fullscreen.addEventListener('click',()=>instance.SetFullscreen(1));canvas.focus();}).catch(message=>{loading.hidden=true;errorBox.hidden=false;errorBox.textContent='載入失敗：'+message;});
    loader.onerror=()=>{loading.hidden=true;errorBox.hidden=false;errorBox.textContent='載入器下載失敗，請重新整理後再試。';};
    document.body.appendChild(loader);
  </script>
</body>
</html>
