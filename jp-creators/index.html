<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>日本遊戲動畫名人錄</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
*{box-sizing:border-box}body{margin:0}
/* 版面：頂部名錄標題＋分類頁籤＋搜尋列，下方人物卡片格；每張卡附 1996–2026 作品時間尺 */
:root{
  --bg:#eef0f3; --surface:#ffffff; --fg:#1b1f2a; --muted:#5d6475; --line:#d6dae2;
  --prod:#2c3f8f; --art:#1f7a64; --music:#8a3a78; --script:#9a5b12; --accent:var(--prod);
  --chip:#e4e8f1;
  --f-display:"Noto Serif TC","Noto Serif JP",serif;
  --f-body:"Noto Sans TC","Noto Sans JP","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12151c; --surface:#1b1f29; --fg:#e6e8ee; --muted:#9aa1b2; --line:#2e3442;
  --prod:#8ea2f0; --art:#5fc7a8; --music:#e08ccd; --script:#e2a35a; --chip:#262b37; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12151c; --surface:#1b1f29; --fg:#e6e8ee; --muted:#9aa1b2; --line:#2e3442;
  --prod:#8ea2f0; --art:#5fc7a8; --music:#e08ccd; --script:#e2a35a; --chip:#262b37; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.6}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:28px 48px}
header h1{font-family:var(--f-display);font-weight:900;font-size:clamp(1.7rem,4vw,2.4rem);margin:0;text-wrap:balance;letter-spacing:.02em}
header p{margin:.3rem 0 0;color:var(--muted);max-width:65ch}
.counts{display:flex;gap:18px;flex-wrap:wrap;margin-top:14px;font-size:.9rem;color:var(--muted)}
.counts b{font-family:var(--f-mono);font-size:1.25rem;color:var(--fg);margin-right:4px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding-block:14px;border-bottom:1px solid var(--line);margin-top:18px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{font:inherit;font-size:.9rem;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:6px 14px;border-radius:999px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.tabs button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--prod);outline-offset:2px}
.bar input,.bar select{font:inherit;font-size:.9rem;padding:6px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg)}
.bar input{flex:1 1 220px;min-width:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:16px;margin-top:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:10px;min-width:0;border-top:3px solid var(--cat)}
.card[data-cat="producers"],.card[data-cat="a_directors"]{--cat:var(--prod)} .card[data-cat="artists"],.card[data-cat="a_artists"]{--cat:var(--art)} .card[data-cat="composers"],.card[data-cat="a_composers"]{--cat:var(--music)} .card[data-cat="a_writers"]{--cat:var(--script)}
.domain{display:flex;gap:0;border:1px solid var(--fg);border-radius:8px;overflow:hidden}
.domain button{font:inherit;font-weight:700;font-size:.95rem;border:0;background:var(--surface);color:var(--fg);padding:7px 18px;cursor:pointer}
.domain button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.domain button:focus-visible{outline:2px solid var(--prod);outline-offset:-3px}
.kind{font-size:.72rem;letter-spacing:.12em;color:var(--cat);font-weight:700}
.name{font-family:var(--f-display);font-weight:900;font-size:1.45rem;line-height:1.2;margin:0}
.sub{color:var(--muted);font-size:.85rem}
.sub .mono{font-family:var(--f-mono)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--chip);border-radius:6px;padding:2px 8px;font-size:.8rem}
.style{margin:0;font-size:.92rem;border-left:2px solid var(--cat);padding-left:10px}
.career{margin:0;font-size:.86rem;color:var(--muted)}
/* 作品時間尺：1996 到 2026 */
.ruler{position:relative;height:22px;margin:4px 0 0}
.ruler::before{content:"";position:absolute;left:0;right:0;top:10px;height:1px;background:var(--line)}
.ruler i{position:absolute;top:6px;width:9px;height:9px;margin-left:-4.5px;border-radius:50%;background:var(--cat)}
.ruler i.pre{background:var(--muted);opacity:.6}
.ruler span{position:absolute;top:13px;font:10px var(--f-mono);color:var(--muted)}
.works{width:100%;border-collapse:collapse;font-size:.86rem}
.works td{padding:5px 0;border-top:1px solid var(--line);vertical-align:top}
.works td.y{font-family:var(--f-mono);font-variant-numeric:tabular-nums;width:3.4em;color:var(--cat);font-weight:600}
.works .orig{display:block;color:var(--muted);font-size:.78rem}
.works .r{color:var(--muted);font-size:.78rem;text-align:right;padding-left:8px;white-space:nowrap}
.lks{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:2px}
.lk{font-size:.75rem;color:var(--cat);text-decoration:none;border-bottom:1px solid currentColor}
.lk.s{color:var(--muted);border-bottom-style:dotted}
.lk:hover{opacity:.75}
.chip.ofc{color:var(--cat);text-decoration:none;border:1px solid var(--cat);background:transparent}
.legend{font-size:.8rem;color:var(--muted);margin-top:8px}
.src{font-size:.78rem;display:flex;flex-wrap:wrap;gap:4px 10px}
.src a{color:var(--muted)}
.empty{color:var(--muted);padding:40px 0;text-align:center}
footer{margin-top:36px;color:var(--muted);font-size:.8rem;max-width:75ch}
@media (max-width:420px){.works .r{display:none}}
</style>
</head>
<body>

<div class="wrap">
<header>
  <h1>日本遊戲動畫名人錄 1996–2026</h1>
  <p>近三十年有代表作的日本遊戲與動畫創作者：遊戲分製作人、美術、音樂；動畫分導演、腳本、配樂、角色設計與作畫。每位附代表作、年份、經歷與查證來源。</p>
  <div class="counts" id="counts"></div>
  <p class="legend">作品連結：<b>▶</b> 是查證過的官方 YouTube 影片；<b>⌕</b> 表示沒找到官方影片，改開 YouTube 搜尋；<b>官網</b>是作品官方網站。</p>
</header>
<div class="bar">
  <div class="domain" id="domain" role="group" aria-label="領域">
    <button id="d-game" data-d="game" aria-pressed="true">遊戲</button>
    <button id="d-anime" data-d="anime" aria-pressed="false">動畫</button>
  </div>
  <div class="tabs" id="tabs" role="group" aria-label="分類"></div>
  <input id="q" type="search" placeholder="搜尋姓名、作品、公司…" aria-label="搜尋">
  <select id="sort" aria-label="排序">
    <option value="born">依出生年</option>
    <option value="first">依首部代表作年份</option>
    <option value="count">依收錄作品數</option>
  </select>
</div>
<main class="grid" id="grid"></main>
<footer id="foot"></footer>
</div>

const META = "資料由 Claude Sonnet 子代理於 2026-10-07 至 10-08 以網路搜尋逐人查證整理；影片連結經 YouTube oEmbed 驗證、只收官方頻道。年份為首發年。資料可能有誤，引用前請點來源核對。";
const DOMAINS={game:{name:"遊戲",cats:{producers:"製作人／總監",artists:"美術設計",composers:"音樂"}},
  anime:{name:"動畫",cats:{a_directors:"導演",a_writers:"腳本／系列構成",a_composers:"配樂",a_artists:"角色設計／作畫"}}};
const LABEL={};for(const d of Object.values(DOMAINS)) Object.assign(LABEL,d.cats);
const Y0=1996,Y1=2026;
const people=[];
for(const [dk,d] of Object.entries(DOMAINS)) for(const k of Object.keys(d.cats)) for(const p of (DATA[k]||[])) people.push({...p,cat:k,dom:dk});
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const first=p=>Math.min(...(p.works||[]).map(w=>w.year||9999));
document.getElementById("foot").textContent=META;
let dom="game",cat="all";
try{dom=localStorage.getItem("jgp-dom")||"game";cat=localStorage.getItem("jgp-cat")||"all"}catch(e){}
if(!DOMAINS[dom])dom="game"; if(cat!=="all"&&!(cat in DOMAINS[dom].cats))cat="all";
function head(){
  const d=DOMAINS[dom], mine=people.filter(p=>p.dom===dom);
  document.getElementById("counts").innerHTML=Object.entries(d.cats).map(([k,l])=>`<span><b>${(DATA[k]||[]).length}</b>${l}</span>`).join("")+`<span><b>${mine.reduce((n,p)=>n+(p.works||[]).length,0)}</b>部代表作</span>`;
  document.getElementById("tabs").innerHTML=`<button id="t-all" data-k="all">全部</button>`+Object.entries(d.cats).map(([k,l])=>`<button id="t-${k}" data-k="${k}">${l}</button>`).join("");
  document.querySelectorAll("#domain button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.d===dom));
}
function ruler(p){
  const dots=(p.works||[]).filter(w=>w.year).map(w=>{
    const pre=w.year<Y0, x=pre?0:Math.min(100,(w.year-Y0)/(Y1-Y0)*100);
    return `<i class="${pre?"pre":""}" style="left:${x}%" title="${esc(w.year+" "+w.title_zh)}"></i>`}).join("");
  return `<div class="ruler" aria-hidden="true">${dots}<span style="left:0">1996</span><span style="right:0">2026</span></div>`;
}
const MUSIC=new Set(["composers","a_composers"]);
function links(p,w){
  const kw=MUSIC.has(p.cat)?"サウンドトラック":p.dom==="game"?"トレーラー":"PV";
  const v=w.video
    ?`<a class="lk v" href="${esc(w.video.url)}" target="_blank" rel="noopener" title="${esc(w.video.title+"｜"+w.video.channel)}">▶ ${MUSIC.has(p.cat)?"聽配樂":p.dom==="game"?"看預告":"看 PV"}</a>`
    :`<a class="lk s" href="https://www.youtube.com/results?search_query=${encodeURIComponent(w.title_orig+" "+kw)}" target="_blank" rel="noopener" title="沒有查證到官方影片，改開 YouTube 搜尋">⌕ YouTube 搜尋</a>`;
  const s=w.site?`<a class="lk" href="${esc(w.site)}" target="_blank" rel="noopener">官網</a>`:"";
  return `<span class="lks">${v}${s}</span>`;
}
function card(p){
  const works=[...(p.works||[])].sort((a,b)=>(a.year||0)-(b.year||0));
  return `<article class="card" data-cat="${p.cat}">
    <div class="kind">${LABEL[p.cat]}</div>
    <div><h2 class="name">${esc(p.name_zh)}</h2>
    <div class="sub">${esc(p.name_ja)} · ${esc(p.name_en)}${p.born?` · <span class="mono">${p.born}</span> 年生`:""}</div></div>
    <div class="chips">${p.role?`<span class="chip">${esc(p.role)}</span>`:""}${p.company?`<span class="chip">${esc(p.company)}</span>`:""}${p.official?`<a class="chip ofc" href="${esc(p.official.url)}" target="_blank" rel="noopener">↗ ${esc(p.official.label)}</a>`:""}</div>
    ${p.style?`<p class="style">${esc(p.style)}</p>`:""}
    ${ruler(p)}
    <table class="works"><tbody>${works.map(w=>`<tr><td class="y">${esc(w.year)}</td><td>${esc(w.title_zh)}<span class="orig">${esc(w.title_orig)}</span>${links(p,w)}</td><td class="r">${esc(w.role)}</td></tr>`).join("")}</tbody></table>
    ${p.career?`<p class="career">${esc(p.career)}</p>`:""}
    <div class="src">來源：${(p.sources||[]).map(s=>`<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.label)}</a>`).join("")}</div>
  </article>`;
}
function render(){
  const q=document.getElementById("q").value.trim().toLowerCase();
  const sort=document.getElementById("sort").value;
  let list=people.filter(p=>p.dom===dom&&(cat==="all"||p.cat===cat));
  if(q) list=list.filter(p=>JSON.stringify(p).toLowerCase().includes(q));
  list.sort(sort==="born"?(a,b)=>(a.born||9999)-(b.born||9999):sort==="first"?(a,b)=>first(a)-first(b):(a,b)=>(b.works||[]).length-(a.works||[]).length);
  document.getElementById("grid").innerHTML=list.length?list.map(card).join(""):`<p class="empty">找不到符合「${esc(q)}」的人物或作品。</p>`;
  document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.k===cat));
}
document.getElementById("tabs").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;cat=b.dataset.k;try{localStorage.setItem("jgp-cat",cat)}catch(err){}render()});
document.getElementById("domain").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;dom=b.dataset.d;cat="all";try{localStorage.setItem("jgp-dom",dom);localStorage.setItem("jgp-cat",cat)}catch(err){}head();render()});
document.getElementById("q").addEventListener("input",render);
document.getElementById("sort").addEventListener("change",render);
head();render();
</script>
